<title>Printmotive 3D T-Shirt Designer</title>

     THREE.JS MODULES

<script type="module" id="three-module-script">
    import * as THREE from
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

    import { OrbitControls } from
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

    import { GLTFLoader } from
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


    /*
        Make Three.js available to the rest of the application.
        OrbitControls and GLTFLoader are also exposed globally.
    */

    window.THREE = THREE;
    window.OrbitControls = OrbitControls;
    window.GLTFLoader = GLTFLoader;

    window.dispatchEvent(
        new Event("three-ready")
    );
</script>

<style>

* {
    box-sizing: border-box;
}


html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #080a0d;
    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


body {
    overflow-x: hidden;
}


button,
label {
    -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   APP
   ========================================================= */

.app {
    width: 100%;
    max-width: 900px;

    margin: auto;

    min-height: 100vh;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {
    height: 60px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 16px;

    background: #111419;

    border-bottom:

}


.logo {

    font-weight: 800;
}


.badge {
    font-size: 11px;

    color: #aeb5c0;

    background: #20242b;

    padding:

    border-radius: 20px;
}

   VIEWER
   ========================================================= */

.viewer {
    position: relative;

    width: 100%;

    height: 62vh;

    min-height: 430px;

    background:
        radial-gradient(
            circle at 50% 35%,
            #30353d 0%,
            #15181d 40%,
            #080a0d 75%
        );

    overflow: hidden;
}


#canvas {
    width: 100%;
    height: 100%;

    display: block;

    touch-action: none;
}


/* =========================================================
   HINT
   ========================================================= */

.hint {
    position: absolute;

    left: 50%;
    bottom: 14px;

    transform:
        translateX(-50%);

    padding:
        8px 13px;

    background:
        rgba(0,0,0,.65);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 30px;

    font-size: 12px;

    color: #dce1e8;

    white-space: nowrap;

    pointer-events: none;
}


/* =========================================================
   ERROR / LOADING OVERLAY
   ========================================================= */

.viewer-message {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: calc(100% - 40px);

    max-width: 430px;

    padding: 18px;

    text-align: center;

    background:
        rgba(8,10,13,.86);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 16px;

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    pointer-events: none;

    z-index: 5;
}


.viewer-message.hidden {
    display: none;
}


.viewer-message-title {
    font-size: 15px;
    font-weight: 700;

    margin-bottom: 7px;
}


.viewer-message-text {

    line-height: 1.5;

    color: #aeb6c3;

    background: #111419;

    border-top:
        1px solid #272b32;

    flex-shrink: 0;
}


.buttons {
    display: flex;

    gap: 10px;

    flex-wrap: wrap;
}


.btn {
    border: none;

    padding:
        12px 17px;

    border-radius: 12px;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    background: white;

    color: #111;

    min-height: 46px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    user-select: none;

    -webkit-user-select: none;
}


.btn.secondary {
    background: #252a31;

    color: white;
}


.btn:active {
    transform:
        scale(.97);
}


.btn:disabled {
    opacity: .5;

    cursor:
        not-allowed;

    transform: none;
}


input[type="file"] {
    display: none;
}


/* =========================================================
   STATUS
   ========================================================= */

.status {
    margin-top: 11px;

    font-size: 12px;

    color: #aeb6c3;

    line-height: 1.5;
}


.note {
    margin-top: 7px;

    font-size: 11px;

    color: #747d89;
}


/* =========================================================
   CROP MODAL
   ========================================================= */

.modal {
    position: fixed;

    inset: 0;

    z-index: 999;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 14px;

    background:
        rgba(0,0,0,.88);
}


.modal.show {
    display: flex;
}


.modal-box {
    width:

    max-height:

    overflow: hidden;

    background: #15181d;

    border:
        1px solid #30353e;

    border-radius: 18px;

    padding: 14px;
}


.modal-title {
    font-size: 14px;

    margin-bottom: 10px;
}


.crop-area {

.modal-buttons {

@media (max-width: 600px) {

        width: 100%;
    }


    .btn {

    }


    .hint {
        font-size: 11px;

        bottom: 12px;
    }

    .viewer {
        min-height: 390px;
    }

<!-- =========================================================
     APPLICATION
     ========================================================= -->

<script>

"use strict";


/* =========================================================
   CONFIG
   ========================================================= */

const MODEL_FILE = "shirt.glb";


/* =========================================================
   VARIABLES
   ========================================================= */

let scene = null;

let camera = null;

let renderer = null;

let controls = null;

let shirt = null;

let originalMaterials = [];

let designTexture = null;

let cropper = null;

let threeReady = false;

let animationStarted = false;

let modelLoaded = false;


/* =========================================================
   ELEMENTS
   ========================================================= */

const canvas =
    document.getElementById("canvas");


const viewer =
    document.getElementById("viewer");


const status =
    document.getElementById("status");


const designInput =
    document.getElementById("designInput");


const cropModal =
    document.getElementById("cropModal");


const cropImage =
    document.getElementById("cropImage");


const viewerMessage =
    document.getElementById("viewerMessage");


const viewerMessageTitle =
    document.getElementById("viewerMessageTitle");


const viewerMessageText =
    document.getElementById("viewerMessageText");


/* =========================================================
   STATUS HELPERS
   ========================================================= */

function setStatus(message) {

    status.innerText =
        message;

}


function showViewerMessage(
    title,
    message
) {

    viewerMessageTitle.innerText =
        title;

    viewerMessageText.innerText =
        message;

    viewerMessage.classList.remove(
        "hidden"
    );

}


function hideViewerMessage() {

    viewerMessage.classList.add(
        "hidden"
    );

}


/* =========================================================
   WAIT FOR THREE.JS
   ========================================================= */

window.addEventListener(
    "three-ready",
    function() {

        threeReady = true;

        init();

    }
);


/* =========================================================
   THREE.JS FAILED TO LOAD
   ========================================================= */

setTimeout(
    function() {

        if (!threeReady) {

            setStatus(
                "Three.js failed to load. Check your internet connection."
            );

            showViewerMessage(
                "3D Engine Failed",
                "Three.js could not be loaded. Please refresh the page and check your internet connection."
            );

        }

    },
    10000
);


/* =========================================================
   INIT
   ========================================================= */

function init() {

    try {

        /* -----------------------------------------------------
           SCENE
           ----------------------------------------------------- */

        scene =
            new THREE.Scene();


        /* -----------------------------------------------------
           CAMERA
           ----------------------------------------------------- */

        camera =
            new THREE.PerspectiveCamera(
                35,
                1,
                0.01,
                1000
            );


        camera.position.set(
            0,
            0.8,
            3.4
        );


        /* -----------------------------------------------------
           RENDERER
           ----------------------------------------------------- */

        renderer =
            new THREE.WebGLRenderer({

                canvas: canvas,

                antialias: true,

                alpha: true,

                preserveDrawingBuffer: false

            });


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio || 1,
                1.8
            )
        );


        renderer.setClearColor(
            0x000000,
            0
        );


        renderer.outputColorSpace =
            THREE.SRGBColorSpace;


        renderer.toneMapping =
            THREE.ACESFilmicToneMapping;


        renderer.toneMappingExposure =
            1.15;


        /* -----------------------------------------------------
           LIGHTS
           ----------------------------------------------------- */

        const hemiLight =
            new THREE.HemisphereLight(
                0xffffff,
                0x333333,
                2.1
            );


        scene.add(
            hemiLight
        );


        const keyLight =
            new THREE.DirectionalLight(
                0xffffff,
                2.5
            );


        keyLight.position.set(
            3,
            5,
            4
        );


        scene.add(
            keyLight
        );


        const fillLight =
            new THREE.DirectionalLight(
                0xffffff,
                1.2
            );


        fillLight.position.set(
            -4,
            2,
            2
        );


        scene.add(
            fillLight
        );


        const rimLight =
            new THREE.DirectionalLight(
                0xffffff,
                0.8
            );


        rimLight.position.set(
            0,
            3,
            -4
        );


        scene.add(
            rimLight
        );


        /* -----------------------------------------------------
           ORBIT CONTROLS
           ----------------------------------------------------- */

        controls =
            new OrbitControls(
                camera,
                canvas
            );


        controls.enableDamping =
            true;


        controls.dampingFactor =
            0.08;


        controls.enablePan =
            false;


        controls.minDistance =
            1.5;


        controls.maxDistance =
            6;


        controls.target.set(
            0,
            0.55,
            0
        );


        controls.update();


        /* -----------------------------------------------------
           LOAD MODEL
           ----------------------------------------------------- */

        loadModel();


        /* -----------------------------------------------------
           RESIZE
           ----------------------------------------------------- */

        resize();


        window.addEventListener(
            "resize",
            resize
        );


        window.addEventListener(
            "orientationchange",
            function() {

                setTimeout(
                    resize,
                    150
                );

            }
        );


        /* -----------------------------------------------------
           START ANIMATION
           ----------------------------------------------------- */

        if (!animationStarted) {

            animationStarted =
                true;

            animate();

        }


    } catch (error) {

        console.error(
            "THREE INIT ERROR:",
            error
        );


        setStatus(
            "3D viewer initialization failed."
        );


        showViewerMessage(
            "3D Viewer Error",
            "The 3D viewer could not start. Check the browser console for details."
        );

    }

}


/* =========================================================
   LOAD GLB MODEL
   ========================================================= */

function loadModel() {

    setStatus(
        "Loading 3D T-shirt..."
    );


    showViewerMessage(
        "Loading 3D T-shirt...",
        "Please wait while the model is loaded."
    );


    const loader =
        new GLTFLoader();


    loader.load(

        MODEL_FILE,


        function(gltf) {

            try {

                /* ---------------------------------------------
                   GET MODEL
                   --------------------------------------------- */

                shirt =
                    gltf.scene;


                if (!shirt) {

                    throw new Error(
                        "GLB scene is empty."
                    );

                }


                /* ---------------------------------------------
                   TRAVERSE MODEL
                   --------------------------------------------- */

                shirt.traverse(
                    function(object) {

                        if (!object.isMesh) {
                            return;
                        }


                        object.castShadow =
                            true;


                        object.receiveShadow =
                            true;


                        /*
                            Store original materials safely.
                        */

                        if (
                            Array.isArray(
                                object.material
                            )
                        ) {

                            originalMaterials.push({

                                mesh: object,

                                material:
                                    object.material.slice()

                            });

                        } else {

                            originalMaterials.push({

                                mesh: object,

                                material:
                                    object.material

                            });

                        }

                    }
                );


                /* ---------------------------------------------
                   CHECK MESH
                   --------------------------------------------- */

                if (
                    originalMaterials.length === 0
                ) {

                    throw new Error(
                        "No mesh found inside shirt.glb."
                    );

                }


                /* ---------------------------------------------
                   CALCULATE BOUNDING BOX
                   --------------------------------------------- */

                const box =
                    new THREE.Box3()
                        .setFromObject(
                            shirt
                        );


                const size =
                    box.getSize(
                        new THREE.Vector3()
                    );


                const center =
                    box.getCenter(
                        new THREE.Vector3()
                    );


                /* ---------------------------------------------
                   VALIDATE MODEL SIZE
                   --------------------------------------------- */

                if (
                    !isFinite(size.x) ||
                    !isFinite(size.y) ||
                    !isFinite(size.z) ||
                    size.x <= 0 ||
                    size.y <= 0 ||
                    size.z <= 0
                ) {

                    throw new Error(
                        "Invalid GLB dimensions."
                    );

                }


                /* ---------------------------------------------
                   CENTER MODEL
                   --------------------------------------------- */

                shirt.position.sub(
                    center
                );


                /* ---------------------------------------------
                   NORMALIZE MODEL SIZE
                   --------------------------------------------- */

                const maxSize =
                    Math.max(
                        size.x,
                        size.y,
                        size.z
                    );


                const targetSize =
                    2.2;


                const scale =
                    targetSize /
                    maxSize;


                shirt.scale.setScalar(
                    scale
                );


                /* ---------------------------------------------
                   ADD MODEL
                   --------------------------------------------- */

                scene.add(
                    shirt
                );


                /* ---------------------------------------------
                   RESET CAMERA TARGET
                   --------------------------------------------- */

                controls.target.set(
                    0,
                    0,
                    0
                );


                controls.update();


                /* ---------------------------------------------
                   MODEL READY
                   --------------------------------------------- */

                modelLoaded =
                    true;


                hideViewerMessage();


                setStatus(
                    "3D T-shirt ready. Upload your design."
                );


                console.log(
                    "3D MODEL LOADED SUCCESSFULLY:",
                    MODEL_FILE
                );


            } catch (error) {

                console.error(
                    "MODEL PROCESSING ERROR:",
                    error
                );


                handleModelError(
                    error
                );

            }

        },


        function(progress) {

            if (
                progress &&
                progress.total
            ) {

                const percent =
                    Math.round(
                        (
                            progress.loaded /
                            progress.total
                        ) * 100
                    );


                setStatus(
                    "Loading 3D T-shirt... " +
                    percent +
                    "%"
                );

            } else {

                setStatus(
                    "Loading 3D T-shirt..."
                );

            }

        },


        function(error) {

            console.error(
                "GLB LOAD ERROR:",
                error
            );


            handleModelError(
                error
            );

        }

    );

}


/* =========================================================
   MODEL ERROR HANDLER
   ========================================================= */

function handleModelError(error) {

    modelLoaded =
        false;


    let message =
        "Could not load shirt.glb.";


    if (
        error &&
        error.message
    ) {

        message =
            error.message;

    }


    setStatus(
        "Model load failed."
    );


    showViewerMessage(
        "3D Model Failed",
        "Make sure shirt.glb is uploaded beside index.html."
    );


    console.error(
        "MODEL ERROR DETAILS:",
        message
    );

}


/* =========================================================
   RESIZE
   ========================================================= */

function resize() {

    if (
        !renderer ||
        !camera ||
        !viewer
    ) {

        return;

    }


    const rect =
        viewer.getBoundingClientRect();


    const width =
        Math.max(
            1,
            rect.width
        );


    const height =
        Math.max(
            1,
            rect.height
        );


    renderer.setSize(
        width,
        height,
        false
    );


    camera.aspect =
        width /
        height;


    camera.updateProjectionMatrix();

}


/* =========================================================
   CREATE DESIGN TEXTURE
   ========================================================= */

function createDesignTexture(
    image
) {

    const textureCanvas =
        document.createElement(
            "canvas"
        );


    const context =
        textureCanvas.getContext(
            "2d"
        );


    if (!context) {

        throw new Error(
            "Could not create canvas context."
        );

    }


    const size =
        2048;


    textureCanvas.width =
        size;


    textureCanvas.height =
        size;


    context.clearRect(
        0,
        0,
        size,
        size
    );


    const scale =
        Math.min(

            size /
            image.width,

            size /
            image.height

        );


    const width =
        image.width *
        scale;


    const height =
        image.height *
        scale;


    context.drawImage(

        image,

        (size - width) /
        2,

        (size - height) /
        2,

        width,

        height

    );


    const texture =
        new THREE.CanvasTexture(
            textureCanvas
        );


    texture.colorSpace =
        THREE.SRGBColorSpace;


    texture.anisotropy =
        renderer
            .capabilities
            .getMaxAnisotropy();


    texture.needsUpdate =
        true;


    return texture;

}


/* =========================================================
   CLONE MATERIAL WITH DESIGN
   ========================================================= */

function createMaterialWithDesign(
    material,
    texture
) {

    const newMaterial =
        material.clone();


    newMaterial.map =
        texture;


    newMaterial.needsUpdate =
        true;


    return newMaterial;

}


/* =========================================================
   APPLY DESIGN
   ========================================================= */

function applyDesign(
    image
) {

    if (!shirt) {

        setStatus(
            "Please wait for the 3D model to load."
        );

        return;

    }


    try {

        /* ---------------------------------------------
           Dispose old design texture
           --------------------------------------------- */

        if (designTexture) {

            designTexture.dispose();

            designTexture =
                null;

        }


        /* ---------------------------------------------
           Create new texture
           --------------------------------------------- */

        designTexture =
            createDesignTexture(
                image
            );


        /* ---------------------------------------------
           Apply texture
           --------------------------------------------- */

        shirt.traverse(
            function(object) {

                if (!object.isMesh) {

                    return;

                }


                const oldMaterial =
                    object.material;


                /*
                    Handle models with
                    multiple materials.
                */

                if (
                    Array.isArray(
                        oldMaterial
                    )
                ) {

                    object.material =
                        oldMaterial.map(
                            function(material) {

                                return createMaterialWithDesign(
                                    material,
                                    designTexture
                                );

                            }
                        );

                } else {

                    object.material =
                        createMaterialWithDesign(
                            oldMaterial,
                            designTexture
                        );

                }

            }
        );


        setStatus(
            "Design applied. Drag the T-shirt to rotate."
        );


    } catch (error) {

        console.error(
            "DESIGN APPLY ERROR:",
            error
        );


        setStatus(
            "Could not apply the design."
        );

    }

}


/* =========================================================
   FILE UPLOAD
   ========================================================= */

designInput.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files &&
            event.target.files[0];


        if (!file) {

            return;

        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            setStatus(
                "Please select a valid image."
            );

            designInput.value =
                "";

            return;

        }


        const imageURL =
            URL.createObjectURL(
                file
            );


        cropImage.onload =
            function() {

                URL.revokeObjectURL(
                    imageURL
                );


                if (cropper) {

                    cropper.destroy();

                    cropper =
                        null;

                }


                cropper =
                    new Cropper(
                        cropImage,
                        {

                            viewMode: 1,

                            autoCropArea: 0.8,

                            background: false,

                            responsive: true,

                            zoomable: true,

                            movable: true,

                            rotatable: false,

                            scalable: false

                        }
                    );


                cropModal.classList.add(
                    "show"
                );

            };


        cropImage.onerror =
            function() {

                URL.revokeObjectURL(
                    imageURL
                );


                setStatus(
                    "Could not open the selected image."
                );


                designInput.value =
                    "";

            };


        cropImage.src =
            imageURL;

    }
);


/* =========================================================
   CANCEL CROP
   ========================================================= */

document
    .getElementById("cancelCrop")
    .addEventListener(
        "click",
        function() {

            cropModal.classList.remove(
                "show"
            );


            if (cropper) {

                cropper.destroy();

                cropper =
                    null;

            }


            designInput.value =
                "";

        }
    );


/* =========================================================
   APPLY CROP
   ========================================================= */

document
    .getElementById("applyCrop")
    .addEventListener(
        "click",
        function() {

            if (!cropper) {

                return;

            }


            try {

                const croppedCanvas =
                    cropper.getCroppedCanvas({

                        maxWidth: 2048,

                        maxHeight: 2048,

                        imageSmoothingEnabled:
                            true,

                        imageSmoothingQuality:
                            "high"

                    });


                if (!croppedCanvas) {

                    throw new Error(
                        "Could not create cropped image."
                    );

                }


                const image =
                    new Image();


                image.onload =
                    function() {

                        applyDesign(
                            image
                        );

                    };


                image.onerror =
                    function() {

                        setStatus(
                            "Could not process the cropped image."
                        );

                    };


                image.src =
                    croppedCanvas.toDataURL(
                        "image/png"
                    );


                cropModal.classList.remove(
                    "show"
                );


                cropper.destroy();

                cropper =
                    null;


            } catch (error) {

                console.error(
                    "CROP ERROR:",
                    error
                );


                setStatus(
                    "Could not crop the image."
                );

            }

        }
    );


/* =========================================================
   REMOVE DESIGN
   ========================================================= */

document
    .getElementById("removeDesign")
    .addEventListener(
        "click",
        function() {

            if (!shirt) {

                setStatus(
                    "3D model is not loaded yet."
                );

                return;

            }


            try {

                /* -----------------------------------------
                   Restore original materials
                   ----------------------------------------- */

                originalMaterials.forEach(
                    function(item) {

                        if (
                            Array.isArray(
                                item.material
                            )
                        ) {

                            item.mesh.material =
                                item.material.slice();

                        } else {

                            item.mesh.material =
                                item.material;

                        }

                    }
                );


                /* -----------------------------------------
                   Dispose design texture
                   ----------------------------------------- */

                if (designTexture) {

                    designTexture.dispose();

                    designTexture =
                        null;

                }


                setStatus(
                    "Design removed."
                );


            } catch (error) {

                console.error(
                    "REMOVE DESIGN ERROR:",
                    error
                );


                setStatus(
                    "Could not remove the design."
                );

            }

        }
    );


/* =========================================================
   RESET VIEW
   ========================================================= */

document
    .getElementById("resetView")
    .addEventListener(
        "click",
        function() {

            if (
                !camera ||
                !controls
            ) {

                return;

            }


            camera.position.set(
                0,
                0.8,
                3.4
            );


            controls.target.set(
                0,
                0,
                0
            );


            controls.update();

        }
    );


/* =========================================================
   ANIMATION
   ========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (controls) {

        controls.update();

    }


    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );

    }

}


</script>


</body>
</html>
