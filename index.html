<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Printmotive 3D T-Shirt Designer</title>


<!-- =========================================================
     THREE.JS
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/geometries/DecalGeometry.js"></script>

     CROPPER
========================================================= -->

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css"
>

<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    width:100%;
    height:100%;

    margin:0;
    padding:0;

    overflow:hidden;

    background:#0d0f12;

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

body{
    position:relative;
}


/* =========================================================
   MAIN PAGE LAYOUT
========================================================= */

#app{

    width:100%;
    height:100%;

    display:grid;

    grid-template-rows:
        58px
        minmax(0,1fr)
        auto;

    overflow:hidden;

}


/* =========================================================
   HEADER
========================================================= */

header{

    width:100%;
    height:58px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:0 26px;

    background:#101318;

    border-bottom:1px solid rgba(255,255,255,.08);

    z-index:20;
}

.logo{

    margin:0;

    font-size:20px;

    font-weight:700;

    letter-spacing:-.3px;
}

.headerBadge{

    padding:9px 17px;

    border-radius:25px;

    background:#20252d;

    color:#aeb4be;

    font-size:14px;

    white-space:nowrap;
}


/* =========================================================
   3D AREA
========================================================= */

#viewer{

    position:relative;

    width:100%;
    height:100%;

    min-height:0;

    overflow:hidden;

    /*
       Screenshot jaisa dark grey/black
       gradient background.
    */

    background:

        radial-gradient(
            ellipse at 50% 43%,
            #292d33 0%,
            #1c2025 32%,
            #12151a 65%,
            #0d0f12 100%
        );
}

#viewer canvas{

    position:absolute;

    inset:0;

    display:block;

    width:100% !important;
    height:100% !important;
}


/* =========================================================
   SMALL HELPER TEXT
========================================================= */

#viewerHint{

    position:absolute;

    left:50%;

    bottom:18px;

    transform:translateX(-50%);

    z-index:5;

    padding:10px 20px;

    border-radius:25px;

    background:rgba(0,0,0,.55);

    border:1px solid rgba(255,255,255,.12);

    color:#e4e6e9;

    font-size:13px;

    white-space:nowrap;

    pointer-events:none;

}


/* =========================================================
   LOADING
========================================================= */

#loading{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:10;

    color:#aaa;

    font-size:14px;

    pointer-events:none;
}


/* =========================================================
   BOTTOM CONTROL AREA
========================================================= */

#controlsPanel{

    width:100%;

    padding:

        14px
        26px
        calc(14px + env(safe-area-inset-bottom));

    background:#101318;

    border-top:1px solid rgba(255,255,255,.08);

    z-index:20;
}


/* =========================================================
   BUTTONS
========================================================= */

.buttonRow{

    width:100%;

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:12px;
}

.button{

    width:100%;

    height:52px;

    border:none;

    border-radius:15px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    white-space:nowrap;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.button:active{

    transform:scale(.98);
}

#uploadBtn{

    background:#fff;

    color:#101010;
}

#removeBtn{

    background:#242930;

    color:#fff;
}

#resetBtn{

    grid-column:1 / -1;

    background:#242930;

    color:#fff;
}


/* =========================================================
   BRIGHTNESS
========================================================= */

.brightnessBox{

    margin-top:12px;

    padding:12px 15px 13px;

    border-radius:15px;

    background:#242930;
}

.brightnessTop{

    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:7px;
}

.brightnessLabel{

    font-size:14px;

    font-weight:700;
}

#brightnessValue{

    font-size:13px;

    color:#aeb3bb;
}


/* =========================================================
   RANGE
========================================================= */

#brightness{

    width:100%;

    height:24px;

    margin:0;

    padding:0;

    appearance:none;
    -webkit-appearance:none;

    background:transparent;

    cursor:pointer;
}

#brightness::-webkit-slider-runnable-track{

    height:5px;

    border-radius:10px;

    background:#5b5f65;
}

#brightness::-webkit-slider-thumb{

    appearance:none;
    -webkit-appearance:none;

    width:20px;
    height:20px;

    margin-top:-7.5px;

    border-radius:50%;

    border:none;

    background:#fff;

    box-shadow:
        0 2px 8px rgba(0,0,0,.4);
}

#brightness::-moz-range-track{

    height:5px;

    border-radius:10px;

    background:#5b5f65;
}

#brightness::-moz-range-thumb{

    width:20px;
    height:20px;

    border:none;

    border-radius:50%;

    background:#fff;
}


/* =========================================================
   FILE INPUT
========================================================= */

#fileInput{

    display:none;
}


/* =========================================================
   CROP MODAL
========================================================= */

#cropModal{

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    padding:18px;

    background:rgba(0,0,0,.84);

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
}

#cropModal.show{

    display:flex;
}

.cropBox{

    width:min(520px,100%);

    max-height:92vh;

    overflow:hidden;

    border-radius:20px;

    background:#17191d;

    box-shadow:
        0 20px 70px rgba(0,0,0,.6);

    display:flex;

    flex-direction:column;
}

.cropHeader{

    padding:15px 16px;

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.cropTitle{

    margin:0;

    font-size:16px;

    font-weight:700;
}

.cropArea{

    width:100%;

    height:min(62vh,500px);

    overflow:hidden;

    background:#080808;
}

#cropImage{

    display:block;

    max-width:100%;
}

.cropFooter{

    padding:13px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;
}

.cropButton{

    height:46px;

    border:none;

    border-radius:12px;

    font-size:14px;

    font-weight:700;

    cursor:pointer;
}

#cancelCrop{

    background:#292d33;

    color:#fff;
}

#applyCrop{

    background:#fff;

    color:#111;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    #app{

        grid-template-rows:
            56px
            minmax(0,1fr)
            auto;
    }

    header{

        height:56px;

        padding:0 26px;
    }

    .logo{

        font-size:20px;
    }

    .headerBadge{

        display:none;
    }

    #controlsPanel{

        padding:

            12px
            14px
            calc(12px + env(safe-area-inset-bottom));
    }

    .buttonRow{

        gap:10px;
    }

    .button{

        height:52px;

        font-size:14px;
    }

    .brightnessBox{

        margin-top:10px;
    }

    #viewerHint{

        bottom:15px;

        font-size:12px;

        padding:9px 16px;
    }

}


/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-width:360px){

    header{

        padding:0 18px;
    }

    .logo{

        font-size:18px;
    }

    .button{

        font-size:13px;
    }
}

</style>

</head>


<body>


<div id="app">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <h1 class="logo">
            Printmotive
        </h1>

        <div class="headerBadge">
            3D Designer Prototype
        </div>

    </header>


    <!-- =====================================================
         3D VIEWER
    ====================================================== -->

    <main id="viewer">

        <div id="loading">
            Loading 3D T-Shirt...
        </div>

        <div id="viewerHint">
            Drag to rotate · Pinch to zoom
        </div>

    </main>


    <!-- =====================================================
         CONTROLS
    ====================================================== -->

    <section id="controlsPanel">

        <div class="buttonRow">

            <button
                id="uploadBtn"
                class="button"
                type="button"
            >
                📷 Upload Design
            </button>


            <button
                id="removeBtn"
                class="button"
                type="button"
            >
                Remove Design
            </button>


            <button
                id="resetBtn"
                class="button"
                type="button"
            >
                Reset View
            </button>

        </div>


        <div class="brightnessBox">

            <div class="brightnessTop">

                <span class="brightnessLabel">
                    Brightness
                </span>

                <span id="brightnessValue">
                    50%
                </span>

            </div>


            <input
                id="brightness"
                type="range"
                min="0.25"
                max="2"
                step="0.05"
                value="0.5"
            >

        </div>

    </section>

</div>


<!-- =========================================================
     FILE INPUT
========================================================= -->

<input
    id="fileInput"
    type="file"
    accept="image/*"
>


<!-- =========================================================
     CROP MODAL
========================================================= -->

<div id="cropModal">

    <div class="cropBox">

        <div class="cropHeader">

            <h2 class="cropTitle">
                Adjust Your Design
            </h2>

        </div>


        <div class="cropArea">

            <img
                id="cropImage"
                alt="Design"
            >

        </div>


        <div class="cropFooter">

            <button
                id="cancelCrop"
                class="cropButton"
                type="button"
            >
                Cancel
            </button>

            <button
                id="applyCrop"
                class="cropButton"
                type="button"
            >
                Apply
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   DOM
========================================================= */

const viewer =
    document.getElementById("viewer");

const fileInput =
    document.getElementById("fileInput");

const uploadBtn =
    document.getElementById("uploadBtn");

const removeBtn =
    document.getElementById("removeBtn");

const resetBtn =
    document.getElementById("resetBtn");

const brightness =
    document.getElementById("brightness");

const brightnessValue =
    document.getElementById("brightnessValue");

const loading =
    document.getElementById("loading");

const cropModal =
    document.getElementById("cropModal");

const cropImage =
    document.getElementById("cropImage");

const cancelCrop =
    document.getElementById("cancelCrop");

const applyCrop =
    document.getElementById("applyCrop");


/* =========================================================
   PRINT CONFIGURATION
========================================================= */

/*
   Fixed 3:4 print ratio.
*/

const PRINT_RATIO =
    3 / 4;


/*
   Print width will be calculated from
   the actual shirt width.

   This is important because a fixed
   Three.js size was making the print
   too large / cover the shirt.
*/

const PRINT_WIDTH_RATIO =
    0.42;


/*
   Print depth.
*/

const PRINT_DEPTH_RATIO =
    0.12;


/*
   Print vertical position.

   0.50 = exact middle of bounding box.

   0.55 = slightly below center.

   User wanted chest ke thoda niche.
*/

const PRINT_Y_RATIO =
    0.55;


/*
   Default brightness.
*/

const DEFAULT_BRIGHTNESS =
    0.5;


/* =========================================================
   THREE VARIABLES
========================================================= */

let scene;

let camera;

let renderer;

let controls;

let shirt = null;

let shirtMeshes = [];

let printDecal = null;

let designTexture = null;

let cropper = null;

let originalDesignURL = null;


/* =========================================================
   CAMERA
========================================================= */

const initialCameraPosition =
    new THREE.Vector3(
        0,
        0,
        4.6
    );

const initialTarget =
    new THREE.Vector3(
        0,
        0,
        0
    );


/* =========================================================
   SCENE
========================================================= */

scene =
    new THREE.Scene();


/* =========================================================
   CAMERA
========================================================= */

camera =
    new THREE.PerspectiveCamera(
        38,
        viewer.clientWidth /
        viewer.clientHeight,
        0.1,
        100
    );

camera.position.copy(
    initialCameraPosition
);


/* =========================================================
   RENDERER
========================================================= */

renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        alpha:true,

        powerPreference:
            "high-performance"

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.5
    )
);

renderer.setSize(
    viewer.clientWidth,
    viewer.clientHeight
);

renderer.outputEncoding =
    THREE.sRGBEncoding;

renderer.shadowMap.enabled =
    true;

renderer.domElement.style.display =
    "block";

viewer.appendChild(
    renderer.domElement
);


/* =========================================================
   CONTROLS
========================================================= */

controls =
    new THREE.OrbitControls(
        camera,
        renderer.domElement
    );

controls.target.copy(
    initialTarget
);

controls.enableDamping =
    true;

controls.dampingFactor =
    0.08;

controls.enablePan =
    false;

controls.minDistance =
    2.5;

controls.maxDistance =
    7;

controls.minPolarAngle =
    Math.PI * 0.18;

controls.maxPolarAngle =
    Math.PI * 0.82;

controls.update();


/* =========================================================
   LIGHTING
========================================================= */

const hemi =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        1.25 * DEFAULT_BRIGHTNESS
    );

hemi.name =
    "Main Hemisphere Light";

scene.add(
    hemi
);


const key =
    new THREE.DirectionalLight(
        0xffffff,
        1.25 * DEFAULT_BRIGHTNESS
    );

key.name =
    "Main Key Light";

key.position.set(
    2.5,
    4,
    4
);

scene.add(
    key
);


const fill =
    new THREE.DirectionalLight(
        0xffffff,
        .7 * DEFAULT_BRIGHTNESS
    );

fill.name =
    "Main Fill Light";

fill.position.set(
    -3,
    2,
    2
);

scene.add(
    fill
);


/* =========================================================
   BRIGHTNESS
========================================================= */

function updateBrightness(){

    const value =
        parseFloat(
            brightness.value
        );


    hemi.intensity =
        1.25 * value;


    key.intensity =
        1.25 * value;


    fill.intensity =
        .7 * value;


    brightnessValue.textContent =
        Math.round(
            value * 100
        ) + "%";
}


updateBrightness();


/* =========================================================
   MAKE SHIRT PLAIN
========================================================= */

/*
   VERY IMPORTANT.

   Tumhare current screenshot mein jo
   uploaded/person image poori shirt par
   dikh rahi hai, woh decal nahi hai.

   GLB ke original material/texture mein
   image baked hai.

   Isliye hum original map hata rahe hain
   aur shirt ko plain white material de rahe hain.

   Uploaded design baad mein separate
   DecalGeometry ke through lagega.
*/

function makeShirtPlain(){

    if(!shirt){

        return;
    }


    shirt.traverse(
        function(object){

            if(!object.isMesh){

                return;
            }


            if(
                !object.material
            ){

                return;
            }


            const materials =
                Array.isArray(
                    object.material
                )
                ?
                object.material
                :
                [object.material];


            const newMaterials =
                materials.map(
                    function(oldMaterial){

                        const material =
                            oldMaterial.clone();


                        /*
                           Remove original texture.
                        */

                        material.map = null;

                        material.normalMap = null;

                        material.roughnessMap = null;

                        material.metalnessMap = null;

                        material.aoMap = null;

                        material.emissiveMap = null;


                        /*
                           Plain T-shirt colour.
                        */

                        material.color =
                            new THREE.Color(
                                0xf2f2f2
                            );


                        material.roughness =
                            0.78;

                        material.metalness =
                            0.02;


                        material.needsUpdate =
                            true;


                        return material;

                    }
                );


            object.material =
                Array.isArray(
                    object.material
                )
                ?
                newMaterials
                :
                newMaterials[0];

        }
    );

}


/* =========================================================
   LOAD GLB
========================================================= */

const loader =
    new THREE.GLTFLoader();


loader.load(

    "./shirt.glb",

    function(gltf){

        shirt =
            gltf.scene;


        shirtMeshes =
            [];


        shirt.traverse(
            function(object){

                if(
                    object.isMesh
                ){

                    object.castShadow =
                        true;

                    object.receiveShadow =
                        true;

                    shirtMeshes.push(
                        object
                    );

                }

            }
        );


        /*
           Keep model at origin.

           Camera framing is handled separately.
        */

        shirt.position.set(
            0,
            0,
            0
        );


        scene.add(
            shirt
        );


        /*
           Remove photo texture from
           original GLB.
        */

        makeShirtPlain();


        shirt.updateMatrixWorld(
            true
        );


        /*
           Automatically frame the shirt
           so it is large and centred.
        */

        frameShirt();


        loading.style.display =
            "none";

    },

    function(xhr){

        /*
           Nothing needed here.
        */

    },

    function(error){

        console.error(
            "GLB loading error:",
            error
        );

        loading.textContent =
            "Unable to load 3D T-Shirt.";

    }

);


/* =========================================================
   FRAME SHIRT
========================================================= */

function frameShirt(){

    if(!shirt){

        return;
    }


    shirt.updateMatrixWorld(
        true
    );


    const box =
        new THREE.Box3()
            .setFromObject(
                shirt
            );


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    /*
       Camera target = exact model centre.
    */

    controls.target.copy(
        center
    );


    /*
       Make shirt large enough
       for the viewer.
    */

    const maxSize =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    const fov =
        camera.fov *
        Math.PI /
        180;


    let distance =
        maxSize /
        (2 *
        Math.tan(
            fov / 2
        ));


    /*
       Small margin.
    */

    distance *= 1.18;


    camera.position.set(
        center.x,
        center.y,
        center.z + distance
    );


    camera.near =
        Math.max(
            0.01,
            distance / 100
        );


    camera.far =
        distance * 100;


    camera.updateProjectionMatrix();


    controls.update();

}


/* =========================================================
   FIND FRONT SURFACE
========================================================= */

function findFrontSurface(){

    if(
        !shirt ||
        shirtMeshes.length === 0
    ){

        return null;
    }


    shirt.updateMatrixWorld(
        true
    );


    const bounds =
        new THREE.Box3()
            .setFromObject(
                shirt
            );


    const size =
        bounds.getSize(
            new THREE.Vector3()
        );


    /*
       Chest slightly below centre.
    */

    const chestY =
        bounds.min.y +
        size.y * PRINT_Y_RATIO;


    /*
       Start from front of model.
    */

    const xTests = [

        0,

        -size.x * .05,

        size.x * .05

    ];


    const raycaster =
        new THREE.Raycaster();


    for(
        let i = 0;
        i < xTests.length;
        i++
    ){

        const origin =
            new THREE.Vector3(

                xTests[i],

                chestY,

                bounds.max.z + size.z + 2

            );


        raycaster.set(

            origin,

            new THREE.Vector3(
                0,
                0,
                -1
            )

        );


        const hits =
            raycaster.intersectObjects(
                shirtMeshes,
                true
            );


        for(
            let j = 0;
            j < hits.length;
            j++
        ){

            const hit =
                hits[j];


            if(!hit.face){

                continue;
            }


            const normalMatrix =
                new THREE.Matrix3()
                    .getNormalMatrix(
                        hit.object.matrixWorld
                    );


            const normal =
                hit.face.normal
                    .clone()
                    .applyMatrix3(
                        normalMatrix
                    )
                    .normalize();


            /*
               Front surface only.
            */

            if(
                normal.z <= 0
            ){

                continue;
            }


            return {

                hit:hit,

                normal:normal,

                bounds:bounds,

                size:size

            };

        }

    }


    return null;

}


/* =========================================================
   REMOVE DESIGN
========================================================= */

function removePrint(){

    if(printDecal){

        scene.remove(
            printDecal
        );


        if(
            printDecal.geometry
        ){

            printDecal.geometry.dispose();

        }


        if(
            printDecal.material
        ){

            printDecal.material.dispose();

        }


        printDecal =
            null;

    }


    if(designTexture){

        designTexture.dispose();

        designTexture =
            null;

    }

}


/* =========================================================
   APPLY DESIGN
========================================================= */

function applyDesignToShirt(
    texture
){

    if(
        !shirt ||
        shirtMeshes.length === 0
    ){

        return;
    }


    removePrint();


    const surface =
        findFrontSurface();


    if(!surface){

        console.warn(
            "Front shirt surface not found."
        );

        return;
    }


    const hit =
        surface.hit;


    const normal =
        surface.normal;


    const size =
        surface.size;


    /*
       Print width based on actual
       shirt width.

       This prevents the print from
       covering the whole shirt.
    */

    const printWidth =
        size.x *
        PRINT_WIDTH_RATIO;


    const printHeight =
        printWidth /
        PRINT_RATIO;


    /*
       Position exactly around
       chest / slightly below.
    */

    const position =
        hit.point.clone();


    /*
       Centre horizontally.

       No old right-side offset.
    */

    position.x =
        0;


    /*
       Keep vertical position from
       raycast chest point.
    */

    position.y =
        hit.point.y;


    /*
       Move tiny amount away from
       shirt surface to prevent z-fighting.
    */

    position.add(
        normal
            .clone()
            .multiplyScalar(
                Math.max(
                    size.z * .008,
                    .003
                )
            )
    );


    /*
       Orient decal according to
       actual shirt surface.

       This makes the print follow
       the shirt's front curvature.
    */

    const forward =
        new THREE.Vector3(
            0,
            0,
            1
        );


    const quaternion =
        new THREE.Quaternion();


    quaternion.setFromUnitVectors(
        forward,
        normal
    );


    const orientation =
        new THREE.Euler();


    orientation.setFromQuaternion(
        quaternion,
        "XYZ"
    );


    /*
       3:4 print rectangle.
    */

    const decalSize =
        new THREE.Vector3(

            printWidth,

            printHeight,

            Math.max(
                size.z *
                PRINT_DEPTH_RATIO,
                .15
            )

        );


    /*
       DecalGeometry clips the image
       against the shirt surface.

       It does NOT replace the whole
       shirt texture.
    */

    const geometry =
        new THREE.DecalGeometry(

            hit.object,

            position,

            orientation,

            decalSize

        );


    const material =
        new THREE.MeshBasicMaterial({

            map:texture,

            transparent:true,

            opacity:1,

            side:THREE.DoubleSide,

            depthTest:true,

            depthWrite:false,

            polygonOffset:true,

            polygonOffsetFactor:-4,

            polygonOffsetUnits:-4

        });


    printDecal =
        new THREE.Mesh(
            geometry,
            material
        );


    printDecal.renderOrder =
        20;


    printDecal.frustumCulled =
        false;


    scene.add(
        printDecal
    );

}


/* =========================================================
   CREATE CROPPED TEXTURE
========================================================= */

function createTextureFromCrop(){

    if(!cropper){

        return;
    }


    const cropCanvas =
        cropper.getCroppedCanvas({

            width:900,

            height:1200,

            imageSmoothingEnabled:true,

            imageSmoothingQuality:
                "high",

            fillColor:
                "transparent"

        });


    if(!cropCanvas){

        return;
    }


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        900;

    canvas.height =
        1200;


    const ctx =
        canvas.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        900,
        1200
    );


    ctx.drawImage(

        cropCanvas,

        0,
        0,

        900,
        1200

    );


    designTexture =
        new THREE.CanvasTexture(
            canvas
        );


    designTexture.encoding =
        THREE.sRGBEncoding;


    designTexture.minFilter =
        THREE.LinearFilter;


    designTexture.magFilter =
        THREE.LinearFilter;


    designTexture.generateMipmaps =
        false;


    designTexture.needsUpdate =
        true;


    applyDesignToShirt(
        designTexture
    );

}


/* =========================================================
   OPEN CROP
========================================================= */

function openCropModal(
    imageURL
){

    cropImage.src =
        imageURL;


    cropModal.classList.add(
        "show"
    );


    if(cropper){

        cropper.destroy();

        cropper =
            null;

    }


    cropImage.onload =
        function(){

            cropper =
                new Cropper(

                    cropImage,

                    {

                        aspectRatio:
                            PRINT_RATIO,

                        viewMode:1,

                        dragMode:
                            "move",

                        autoCropArea:
                            .88,

                        cropBoxMovable:
                            true,

                        cropBoxResizable:
                            true,

                        zoomable:
                            true,

                        movable:
                            true,

                        responsive:
                            true,

                        background:
                            false,

                        guides:
                            true,

                        center:
                            true,

                        highlight:
                            false

                    }

                );

        };

}


/* =========================================================
   CLOSE CROP
========================================================= */

function closeCropModal(){

    cropModal.classList.remove(
        "show"
    );


    if(cropper){

        cropper.destroy();

        cropper =
            null;

    }

}


/* =========================================================
   UPLOAD
========================================================= */

uploadBtn.addEventListener(
    "click",
    function(){

        fileInput.click();

    }
);


/* =========================================================
   FILE SELECT
========================================================= */

fileInput.addEventListener(
    "change",
    function(){

        const file =
            this.files &&
            this.files[0];


        if(!file){

            return;
        }


        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            return;
        }


        if(
            originalDesignURL
        ){

            URL.revokeObjectURL(
                originalDesignURL
            );

        }


        originalDesignURL =
            URL.createObjectURL(
                file
            );


        openCropModal(
            originalDesignURL
        );


        this.value =
            "";

    }
);


/* =========================================================
   CANCEL CROP
========================================================= */

cancelCrop.addEventListener(
    "click",
    function(){

        closeCropModal();

    }
);


/* =========================================================
   APPLY CROP
========================================================= */

applyCrop.addEventListener(
    "click",
    function(){

        if(!cropper){

            return;
        }


        createTextureFromCrop();

        closeCropModal();

    }
);


/* =========================================================
   REMOVE
========================================================= */

removeBtn.addEventListener(
    "click",
    function(){

        removePrint();

    }
);


/* =========================================================
   RESET CAMERA
========================================================= */

resetBtn.addEventListener(
    "click",
    function(){

        if(!shirt){

            return;
        }


        frameShirt();

    }
);


/* =========================================================
   BRIGHTNESS
========================================================= */

brightness.addEventListener(
    "input",
    function(){

        updateBrightness();

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        const width =
            viewer.clientWidth;

        const height =
            viewer.clientHeight;


        if(
            width <= 0 ||
            height <= 0
        ){

            return;
        }


        camera.aspect =
            width /
            height;


        camera.updateProjectionMatrix();


        renderer.setSize(
            width,
            height
        );


        /*
           Re-frame only when needed.
        */

        if(shirt){

            frameShirt();

        }

    }
);


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    controls.update();


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>
