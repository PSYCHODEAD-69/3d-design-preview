<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Printmotive 3D T-Shirt Designer</title>


<!-- =====================================================
     THREE.JS
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/geometries/DecalGeometry.js"></script>


<!-- =====================================================
     CROPPER
===================================================== -->

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css"
>

<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>


<style>

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#111;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


#app{

    width:100%;
    height:100%;

    position:relative;

}


/* =====================================================
   VIEWER
===================================================== */

#viewer{

    position:absolute;

    inset:0;

}


canvas{

    display:block;

}


/* =====================================================
   MAIN UI
===================================================== */

#ui{

    position:absolute;

    left:12px;
    right:12px;

    bottom:12px;

    z-index:20;

    padding:14px;

    border-radius:18px;

    background:
        rgba(20,20,20,.88);

    backdrop-filter:
        blur(12px);

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.35);

}


#upload{

    display:none;

}


.uploadBtn{

    width:100%;

    height:48px;

    border:0;

    border-radius:13px;

    background:#fff;

    color:#111;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

}


#removeBtn{

    width:100%;

    height:42px;

    margin-top:9px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius:12px;

    background:#252525;

    color:#fff;

    font-size:14px;

    cursor:pointer;

    display:none;

}


.controlRow{

    margin-top:11px;

}


.controlLabel{

    color:#fff;

    font-size:13px;

    margin-bottom:5px;

}


input[type="range"]{

    width:100%;

}


#status{

    margin-top:9px;

    color:#ddd;

    text-align:center;

    font-size:12px;

    min-height:17px;

}


/* =====================================================
   LOADING
===================================================== */

#loading{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:50;

    background:#111;

    color:#fff;

    font-size:15px;

}


/* =====================================================
   CROP MODAL
===================================================== */

#cropModal{

    position:absolute;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;

    justify-content:center;

    padding:15px;

    background:
        rgba(0,0,0,.90);

}


.cropBox{

    width:min(
        95vw,
        500px
    );

    max-height:92vh;

    background:#181818;

    border-radius:18px;

    padding:15px;

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.5);

    overflow:hidden;

}


.cropTitle{

    color:#fff;

    font-size:16px;

    font-weight:700;

    margin-bottom:12px;

    text-align:center;

}


.cropArea{

    width:100%;

    height:min(
        68vh,
        600px
    );

    background:#222;

    border-radius:12px;

    overflow:hidden;

}


#cropImage{

    display:block;

    max-width:100%;

}


.cropInfo{

    color:#999;

    text-align:center;

    font-size:11px;

    margin-top:9px;

}


.cropButtons{

    display:flex;

    gap:10px;

    margin-top:12px;

}


.cropButtons button{

    flex:1;

    height:45px;

    border:0;

    border-radius:12px;

    font-weight:700;

    cursor:pointer;

}


#applyCrop{

    background:#fff;

    color:#111;

}


#cancelCrop{

    background:#292929;

    color:#fff;

}


</style>

</head>


<body>


<div id="app">


    <!-- =================================================
         3D VIEWER
    ================================================= -->

    <div id="viewer"></div>


    <!-- =================================================
         LOADING
    ================================================= -->

    <div id="loading">

        Loading 3D T-Shirt...

    </div>


    <!-- =================================================
         ORIGINAL UI
    ================================================= -->

    <div id="ui">


        <label
            for="upload"
            class="uploadBtn"
        >

            Upload Your Design

        </label>


        <input
            id="upload"
            type="file"
            accept="image/png,image/jpeg,image/webp"
        >


        <button
            id="removeBtn"
        >

            Remove Design

        </button>


        <div class="controlRow">


            <div class="controlLabel">

                Print Brightness

            </div>


            <input
                id="brightness"
                type="range"
                min="0.5"
                max="2"
                step="0.05"
                value="1"
            >


        </div>


        <div id="status">

            Drag to rotate • Pinch to zoom

        </div>


    </div>


    <!-- =================================================
         CROP MODAL
    ================================================= -->

    <div id="cropModal">


        <div class="cropBox">


            <div class="cropTitle">

                Adjust Your Design

            </div>


            <div class="cropArea">

                <img
                    id="cropImage"
                    alt="Design"
                >

            </div>


            <div class="cropInfo">

                Fixed 3:4 print area • Move or zoom your design

            </div>


            <div class="cropButtons">


                <button
                    id="cancelCrop"
                >

                    Cancel

                </button>


                <button
                    id="applyCrop"
                >

                    Apply Design

                </button>


            </div>


        </div>


    </div>


</div>


<script>

"use strict";


/* =========================================================
   CONFIG
========================================================= */

const MODEL_FILE =
    "shirt.glb";


/*
    REAL PRINT RATIO

    Width : Height

    3 : 4
*/

const PRINT_RATIO =
    3 / 4;


/*
    Print width.

    Increase/decrease ONLY this
    if you need a different print size.
*/

const PRINT_WIDTH =
    0.78;


const PRINT_HEIGHT =
    PRINT_WIDTH /
    PRINT_RATIO;


/*
    Decal projection depth.

    Larger value allows the decal
    to catch curved shirt geometry.
*/

const PRINT_DEPTH =
    0.24;


/*
    Vertical print position.

    0.50 = center
    0.59 = chest
    0.63 = lower
*/

const PRINT_Y_RATIO =
    0.59;


/*
    Small surface offset.
*/

const PRINT_OFFSET =
    0.004;


/*
    Move model upward.
*/

const MODEL_Y_OFFSET =
    0.25;


/*
    Default camera.
*/

const CAMERA_Z =
    5.2;


const CAMERA_Y =
    0.65;


const TARGET_Y =
    0.55;


/* =========================================================
   GLOBALS
========================================================= */

let scene;

let camera;

let renderer;

let controls;

let shirt = null;

let shirtMeshes = [];

let printDecal = null;

let designTexture = null;

let cropper = null;

let pendingImageURL = null;


/* =========================================================
   DOM
========================================================= */

const viewer =
    document.getElementById(
        "viewer"
    );


const loading =
    document.getElementById(
        "loading"
    );


const upload =
    document.getElementById(
        "upload"
    );


const removeBtn =
    document.getElementById(
        "removeBtn"
    );


const brightness =
    document.getElementById(
        "brightness"
    );


const status =
    document.getElementById(
        "status"
    );


const cropModal =
    document.getElementById(
        "cropModal"
    );


const cropImage =
    document.getElementById(
        "cropImage"
    );


const applyCrop =
    document.getElementById(
        "applyCrop"
    );


const cancelCrop =
    document.getElementById(
        "cancelCrop"
    );


/* =========================================================
   INIT
========================================================= */

init();


function init(){

    /* -----------------------------------------------------
       SAFETY CHECK
    ----------------------------------------------------- */

    if(
        typeof THREE ===
        "undefined"
    ){

        status.textContent =
            "Three.js could not be loaded.";

        return;

    }


    if(
        typeof THREE.OrbitControls ===
        "undefined"
    ){

        status.textContent =
            "OrbitControls could not be loaded.";

        return;

    }


    if(
        typeof THREE.GLTFLoader ===
        "undefined"
    ){

        status.textContent =
            "GLTFLoader could not be loaded.";

        return;

    }


    if(
        typeof THREE.DecalGeometry ===
        "undefined"
    ){

        status.textContent =
            "DecalGeometry could not be loaded.";

        return;

    }


    if(
        typeof Cropper ===
        "undefined"
    ){

        status.textContent =
            "Cropper could not be loaded.";

        return;

    }


    /* -----------------------------------------------------
       SCENE
    ----------------------------------------------------- */

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x111111
        );


    /* -----------------------------------------------------
       CAMERA
    ----------------------------------------------------- */

    camera =
        new THREE.PerspectiveCamera(

            35,

            window.innerWidth /
            window.innerHeight,

            0.01,

            100

        );


    camera.position.set(

        0,

        CAMERA_Y,

        CAMERA_Z

    );


    /* -----------------------------------------------------
       RENDERER
    ----------------------------------------------------- */

    renderer =
        new THREE.WebGLRenderer({

            antialias:true,

            alpha:false,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio ||
            1,

            1.35

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    renderer.outputEncoding =
        THREE.sRGBEncoding;


    renderer.physicallyCorrectLights =
        false;


    viewer.appendChild(
        renderer.domElement
    );


    /* -----------------------------------------------------
       LIGHTS
    ----------------------------------------------------- */

    const hemi =
        new THREE.HemisphereLight(

            0xffffff,

            0x555555,

            1.25

        );


    hemi.name =
        "Main Hemisphere Light";


    scene.add(
        hemi
    );


    const keyLight =
        new THREE.DirectionalLight(

            0xffffff,

            1.25

        );


    keyLight.name =
        "Main Key Light";


    keyLight.position.set(

        2,
        4,
        5

    );


    scene.add(
        keyLight
    );


    const fillLight =
        new THREE.DirectionalLight(

            0xffffff,

            0.7

        );


    fillLight.name =
        "Main Fill Light";


    fillLight.position.set(

        -3,
        2,
        4

    );


    scene.add(
        fillLight
    );


    /* -----------------------------------------------------
       CONTROLS
    ----------------------------------------------------- */

    controls =
        new THREE.OrbitControls(

            camera,

            renderer.domElement

        );


    controls.enableDamping =
        true;


    controls.dampingFactor =
        0.08;


    controls.enablePan =
        false;


    controls.minDistance =
        3;


    controls.maxDistance =
        8;


    controls.target.set(

        0,

        TARGET_Y,

        0

    );


    /* -----------------------------------------------------
       EVENTS
    ----------------------------------------------------- */

    upload.addEventListener(

        "change",

        handleUpload

    );


    applyCrop.addEventListener(

        "click",

        applyCroppedDesign

    );


    cancelCrop.addEventListener(

        "click",

        cancelCropper

    );


    removeBtn.addEventListener(

        "click",

        removeDesign

    );


    brightness.addEventListener(

        "input",

        updateBrightness

    );


    window.addEventListener(

        "resize",

        onResize

    );


    /* -----------------------------------------------------
       LOAD MODEL
    ----------------------------------------------------- */

    loadModel();


    /* -----------------------------------------------------
       LOOP
    ----------------------------------------------------- */

    animate();

}


/* =========================================================
   LOAD MODEL
========================================================= */

function loadModel(){

    const loader =
        new THREE.GLTFLoader();


    loader.load(

        MODEL_FILE,


        function(gltf){

            shirt =
                gltf.scene;


            shirtMeshes =
                [];


            shirt.traverse(

                function(object){

                    if(
                        object.isMesh
                    ){

                        shirtMeshes.push(
                            object
                        );


                        /*
                           Keep original shirt
                           materials untouched.
                        */

                        if(
                            object.material
                        ){

                            if(
                                Array.isArray(
                                    object.material
                                )
                            ){

                                object.material =
                                    object.material.map(

                                        function(mat){

                                            return mat.clone();

                                        }

                                    );

                            }
                            else{

                                object.material =
                                    object.material.clone();

                            }

                        }


                        object.castShadow =
                            false;


                        object.receiveShadow =
                            true;

                    }

                }

            );


            /* ------------------------------------------------
               NORMALIZE MODEL
            ------------------------------------------------ */

            const box =
                new THREE.Box3()
                    .setFromObject(
                        shirt
                    );


            const size =
                new THREE.Vector3();


            box.getSize(
                size
            );


            const maxSize =
                Math.max(

                    size.x,
                    size.y,
                    size.z

                );


            const scale =
                2.25 /
                maxSize;


            shirt.scale.setScalar(
                scale
            );


            /*
               Move upward.
            */

            shirt.position.y +=
                MODEL_Y_OFFSET;


            scene.add(
                shirt
            );


            /*
               VERY IMPORTANT

               DecalGeometry reads
               mesh.matrixWorld.
            */

            shirt.updateMatrixWorld(
                true
            );


            /* ------------------------------------------------
               CAMERA
            ------------------------------------------------ */

            camera.position.set(

                0,

                CAMERA_Y,

                CAMERA_Z

            );


            controls.target.set(

                0,

                TARGET_Y,

                0

            );


            controls.update();


            loading.style.display =
                "none";


            status.textContent =
                "3D T-Shirt Ready • Upload your design";


            renderer.render(

                scene,

                camera

            );

        },


        function(xhr){

            if(
                xhr &&
                xhr.lengthComputable
            ){

                const percent =
                    Math.round(

                        (
                            xhr.loaded /
                            xhr.total

                        ) * 100

                    );


                loading.textContent =
                    "Loading 3D T-Shirt " +
                    percent +
                    "%";

            }

        },


        function(error){

            console.error(
                "GLB ERROR:",
                error
            );


            loading.textContent =
                "Unable to load shirt.glb";


            status.textContent =
                "Model loading failed.";

        }

    );

}


/* =========================================================
   UPLOAD
========================================================= */

function handleUpload(event){

    const file =
        event.target.files &&
        event.target.files[0];


    if(!file){

        return;

    }


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        status.textContent =
            "Please select an image.";

        return;

    }


    /*
       Revoke previous temporary URL.
    */

    if(
        pendingImageURL
    ){

        URL.revokeObjectURL(
            pendingImageURL
        );

    }


    pendingImageURL =
        URL.createObjectURL(
            file
        );


    /*
       Open crop UI.
    */

    cropImage.onload =
        function(){

            openCropper();

        };


    cropImage.onerror =
        function(){

            status.textContent =
                "Could not load image.";

        };


    cropImage.src =
        pendingImageURL;

}


/* =========================================================
   OPEN CROPPER
========================================================= */

function openCropper(){

    cropModal.style.display =
        "flex";


    /*
       Destroy previous cropper.
    */

    if(cropper){

        cropper.destroy();

        cropper =
            null;

    }


    /*
       Wait for modal/image layout.
    */

    requestAnimationFrame(

        function(){

            cropper =
                new Cropper(

                    cropImage,

                    {

                        aspectRatio:
                            PRINT_RATIO,

                        viewMode:
                            1,

                        dragMode:
                            "move",

                        autoCropArea:
                            0.88,

                        responsive:
                            true,

                        restore:
                            false,

                        guides:
                            true,

                        center:
                            true,

                        highlight:
                            true,

                        cropBoxMovable:
                            true,

                        cropBoxResizable:
                            true,

                        toggleDragModeOnDblclick:
                            false,

                        zoomable:
                            true,

                        zoomOnWheel:
                            true,

                        movable:
                            true,

                        rotatable:
                            false,

                        scalable:
                            false

                    }

                );

        }

    );

}


/* =========================================================
   CANCEL CROPPER
========================================================= */

function cancelCropper(){

    if(cropper){

        cropper.destroy();

        cropper =
            null;

    }


    cropModal.style.display =
        "none";


    if(
        pendingImageURL
    ){

        URL.revokeObjectURL(
            pendingImageURL
        );

        pendingImageURL =
            null;

    }


    upload.value =
        "";


    status.textContent =
        "Design upload cancelled.";

}


/* =========================================================
   APPLY CROPPED DESIGN
========================================================= */

function applyCroppedDesign(){

    if(!cropper){

        status.textContent =
            "Cropper is not ready.";

        return;

    }


    if(!shirt){

        status.textContent =
            "3D model is still loading.";

        return;

    }


    /*
       Get EXACT fixed 3:4 crop.
    */

    const croppedCanvas =
        cropper.getCroppedCanvas({

            width:
                900,

            height:
                1200,

            imageSmoothingEnabled:
                true,

            imageSmoothingQuality:
                "high",

            fillColor:
                "transparent"

        });


    if(
        !croppedCanvas
    ){

        status.textContent =
            "Could not create cropped design.";

        return;

    }


    /*
       Close cropper.
    */

    cropModal.style.display =
        "none";


    cropper.destroy();

    cropper =
        null;


    /*
       Create THREE texture.
    */

    if(
        designTexture
    ){

        designTexture.dispose();

    }


    designTexture =
        new THREE.CanvasTexture(
            croppedCanvas
        );


    designTexture.encoding =
        THREE.sRGBEncoding;


    designTexture.minFilter =
        THREE.LinearFilter;


    designTexture.magFilter =
        THREE.LinearFilter;


    designTexture.generateMipmaps =
        false;


    designTexture.needsUpdate =
        true;


    /*
       Create actual curved
       decal on shirt.
    */

    createCurvedPrint();


    /*
       Remove temporary URL.
    */

    if(
        pendingImageURL
    ){

        URL.revokeObjectURL(
            pendingImageURL
        );

        pendingImageURL =
            null;

    }


    upload.value =
        "";


}


/* =========================================================
   CREATE CURVED PRINT
========================================================= */

function createCurvedPrint(){

    if(
        !shirt ||
        !designTexture
    ){

        return;

    }


    /*
       Remove old decal.
    */

    removePrintOnly();


    /*
       Make sure matrices are current.
    */

    shirt.updateMatrixWorld(
        true
    );


    /*
       Get shirt bounds.
    */

    const bounds =
        new THREE.Box3()
            .setFromObject(
                shirt
            );


    const shirtSize =
        new THREE.Vector3();


    bounds.getSize(
        shirtSize
    );


    /*
       Chest Y position.
    */

    const chestY =
        bounds.min.y +
        (
            shirtSize.y *
            PRINT_Y_RATIO
        );


    /*
       Front of model is assumed +Z.

       Use several X points so that
       the torso surface is reliably
       found even if center geometry
       is slightly unusual.
    */

    const testX = [

        -shirtSize.x * 0.12,

        0,

        shirtSize.x * 0.12

    ];


    const raycaster =
        new THREE.Raycaster();


    let selectedHit =
        null;


    let selectedNormal =
        null;


    /*
       Find front surface.
    */

    for(
        let i = 0;
        i < testX.length;
        i++
    ){

        const origin =
            new THREE.Vector3(

                testX[i],

                chestY,

                bounds.max.z + 2

            );


        const direction =
            new THREE.Vector3(

                0,

                0,

                -1

            );


        raycaster.set(

            origin,

            direction

        );


        const hits =
            raycaster.intersectObjects(

                shirtMeshes,

                true

            );


        for(
            let j = 0;
            j < hits.length;
            j++
        ){

            const hit =
                hits[j];


            if(
                !hit.object ||
                !hit.face
            ){

                continue;

            }


            /*
               Convert face normal to
               world-space normal.
            */

            const normalMatrix =
                new THREE.Matrix3()
                    .getNormalMatrix(

                        hit.object.matrixWorld

                    );


            const normal =
                hit.face.normal
                    .clone()
                    .applyMatrix3(
                        normalMatrix
                    )
                    .normalize();


            /*
               Front-facing surface.

               +Z = front.
            */

            if(
                normal.z <= 0
            ){

                continue;

            }


            selectedHit =
                hit;


            selectedNormal =
                normal;


            break;

        }


        if(
            selectedHit
        ){

            break;

        }

    }


    /*
       Fallback center ray.
    */

    if(
        !selectedHit
    ){

        const origin =
            new THREE.Vector3(

                0,

                chestY,

                bounds.max.z + 2

            );


        const direction =
            new THREE.Vector3(

                0,

                0,

                -1

            );


        raycaster.set(

            origin,

            direction

        );


        const hits =
            raycaster.intersectObjects(

                shirtMeshes,

                true

            );


        if(
            hits.length
        ){

            const hit =
                hits[0];


            selectedHit =
                hit;


            if(
                hit.face
            ){

                const normalMatrix =
                    new THREE.Matrix3()
                        .getNormalMatrix(

                            hit.object.matrixWorld

                        );


                selectedNormal =
                    hit.face.normal
                        .clone()
                        .applyMatrix3(
                            normalMatrix
                        )
                        .normalize();

            }
            else{

                selectedNormal =
                    new THREE.Vector3(

                        0,
                        0,
                        1

                    );

            }

        }

    }


    /*
       No surface.
    */

    if(
        !selectedHit
    ){

        status.textContent =
            "Could not find shirt front print area.";

        return;

    }


    /*
       Actual hit position.
    */

    const position =
        selectedHit.point.clone();


    /*
       Move projector slightly
       outside the fabric.
    */

    position.add(

        selectedNormal
            .clone()
            .multiplyScalar(
                PRINT_OFFSET
            )

    );


    /* =====================================================
       ORIENTATION

       DecalGeometry needs EULER.

       +Z of projector is aligned
       with shirt surface normal.
    ===================================================== */

    const projectorForward =
        new THREE.Vector3(

            0,
            0,
            1

        );


    const quaternion =
        new THREE.Quaternion();


    quaternion.setFromUnitVectors(

        projectorForward,

        selectedNormal

    );


    const orientation =
        new THREE.Euler();


    orientation.setFromQuaternion(

        quaternion,

        "XYZ"

    );


    /* =====================================================
       DECAL SIZE
    ===================================================== */

    const size =
        new THREE.Vector3(

            PRINT_WIDTH,

            PRINT_HEIGHT,

            PRINT_DEPTH

        );


    /* =====================================================
       CREATE DECAL GEOMETRY
    ===================================================== */

    let geometry;


    try{

        geometry =
            new THREE.DecalGeometry(

                selectedHit.object,

                position,

                orientation,

                size

            );

    }
    catch(error){

        console.error(
            "DecalGeometry error:",
            error
        );


        status.textContent =
            "Could not create print area.";

        return;

    }


    /*
       Check geometry.
    */

    if(
        !geometry.attributes ||
        !geometry.attributes.position ||
        geometry.attributes.position.count === 0
    ){

        geometry.dispose();


        status.textContent =
            "Print area could not be generated.";

        return;

    }


    /* =====================================================
       PRINT MATERIAL
    ===================================================== */

    const material =
        new THREE.MeshBasicMaterial({

            map:
                designTexture,

            transparent:
                true,

            opacity:
                1,

            side:
                THREE.DoubleSide,

            depthTest:
                true,

            depthWrite:
                false,

            polygonOffset:
                true,

            polygonOffsetFactor:
                -4,

            polygonOffsetUnits:
                -4

        });


    /*
       Create decal mesh.
    */

    printDecal =
        new THREE.Mesh(

            geometry,

            material

        );


    printDecal.name =
        "Printmotive_Curved_Print";


    printDecal.renderOrder =
        20;


    printDecal.frustumCulled =
        false;


    /*
       DecalGeometry creates
       world-space geometry.

       Keep it in scene so it stays
       correctly aligned with the
       current model.
    */

    scene.add(
        printDecal
    );


    /*
       Show Remove button.
    */

    removeBtn.style.display =
        "block";


    status.textContent =
        "Design applied to print area";


    renderer.render(

        scene,

        camera

    );

}


/* =========================================================
   REMOVE PRINT
========================================================= */

function removePrintOnly(){

    if(
        !printDecal
    ){

        return;

    }


    scene.remove(
        printDecal
    );


    if(
        printDecal.geometry
    ){

        printDecal.geometry.dispose();

    }


    if(
        printDecal.material
    ){

        printDecal.material.dispose();

    }


    printDecal =
        null;

}


/* =========================================================
   REMOVE DESIGN
========================================================= */

function removeDesign(){

    removePrintOnly();


    if(
        designTexture
    ){

        designTexture.dispose();

        designTexture =
            null;

    }


    removeBtn.style.display =
        "none";


    upload.value =
        "";


    status.textContent =
        "Design removed";

}


/* =========================================================
   BRIGHTNESS
========================================================= */

function updateBrightness(){

    const value =
        parseFloat(
            brightness.value
        );


    /*
       Hemisphere.
    */

    const hemi =
        scene.getObjectByName(
            "Main Hemisphere Light"
        );


    if(hemi){

        hemi.intensity =
            1.25 *
            value;

    }


    /*
       Key.
    */

    const key =
        scene.getObjectByName(
            "Main Key Light"
        );


    if(key){

        key.intensity =
            1.25 *
            value;

    }


    /*
       Fill.
    */

    const fill =
        scene.getObjectByName(
            "Main Fill Light"
        );


    if(fill){

        fill.intensity =
            0.7 *
            value;

    }

}


/* =========================================================
   RESIZE
========================================================= */

function onResize(){

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(
        controls
    ){

        controls.update();

    }


    renderer.render(

        scene,

        camera

    );

}

</script>
