<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Printmotive 3D T-Shirt Designer</title>

     THREE.JS
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>

     CROPPER
========================================================= -->

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css"
>

<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>


<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#090909;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    position:relative;
}


/* =========================================================
   HEADER
========================================================= */

header{

    position:absolute;

    top:0;
    left:0;
    width:100%;

    height:58px;

    display:flex;

    align-items:center;
    justify-content:center;

    z-index:20;

    background:rgba(10,10,10,.82);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    border-bottom:1px solid rgba(255,255,255,.06);
}

header h1{

    margin:0;

    padding:0 10px;

    font-size:20px;

    font-weight:700;

    line-height:1;

    text-align:center;

    white-space:nowrap;

}


/* =========================================================
   3D VIEWER
========================================================= */

#viewer{

    position:absolute;

    left:0;
    right:0;
    top:58px;
    bottom:0;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 42%,
            #252525 0%,
            #151515 42%,
            #090909 78%
        );
}

canvas{

    display:block;

    width:100%;
    height:100%;
}


/* =========================================================
   BOTTOM UI
========================================================= */

#ui{

    position:absolute;

    left:12px;
    right:12px;
    bottom:12px;

    z-index:30;

    padding:14px;

    border-radius:18px;

    background:rgba(20,20,20,.88);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:
        0 10px 35px rgba(0,0,0,.35);

}


/* =========================================================
   BUTTON ROW
========================================================= */

.buttonRow{

    width:100%;

    display:grid;

    grid-template-columns:
        1.35fr
        .85fr
        .95fr;

    gap:10px;

}


/* =========================================================
   BUTTON
========================================================= */

.button{

    width:100%;

    min-width:0;

    height:50px;

    border:none;

    border-radius:13px;

    padding:0 8px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:14px;

    font-weight:600;

    color:#fff;

    cursor:pointer;

    white-space:nowrap;

    transition:
        transform .15s ease,
        opacity .15s ease;

    user-select:none;

    -webkit-user-select:none;
}

.button:active{

    transform:scale(.97);

}

#uploadBtn{

    background:#fff;

    color:#111;

}

#removeBtn{

    background:#292929;

    color:#fff;

}

#resetBtn{

    background:#292929;

    color:#fff;

}

.button:hover{

    opacity:.9;

}


/* =========================================================
   BRIGHTNESS
========================================================= */

.brightnessBox{

    margin-top:12px;

    width:100%;

    padding:12px 13px 13px;

    border-radius:14px;

    background:#292929;

}

.brightnessTop{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:8px;

}

.brightnessLabel{

    font-size:13px;

    font-weight:600;

    color:#fff;

}

#brightnessValue{

    font-size:12px;

    color:#aaa;

}


/* RANGE */

#brightness{

    width:100%;

    height:22px;

    margin:0;

    padding:0;

    appearance:none;

    -webkit-appearance:none;

    background:transparent;

    cursor:pointer;

}

#brightness::-webkit-slider-runnable-track{

    height:4px;

    border-radius:10px;

    background:#555;

}

#brightness::-webkit-slider-thumb{

    appearance:none;

    -webkit-appearance:none;

    width:18px;

    height:18px;

    margin-top:-7px;

    border-radius:50%;

    border:none;

    background:#fff;

    box-shadow:0 2px 7px rgba(0,0,0,.45);

}

#brightness::-moz-range-track{

    height:4px;

    border-radius:10px;

    background:#555;

}

#brightness::-moz-range-thumb{

    width:18px;

    height:18px;

    border-radius:50%;

    border:none;

    background:#fff;

}


/* =========================================================
   UPLOAD INPUT
========================================================= */

#fileInput{

    display:none;

}


/* =========================================================
   CROP MODAL
========================================================= */

#cropModal{

    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    padding:18px;

    background:rgba(0,0,0,.82);

    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
}

#cropModal.show{

    display:flex;

}

.cropBox{

    width:min(520px,100%);

    max-height:92vh;

    overflow:hidden;

    border-radius:20px;

    background:#171717;

    box-shadow:
        0 20px 70px rgba(0,0,0,.6);

    display:flex;

    flex-direction:column;

}

.cropHeader{

    padding:15px 16px;

    display:flex;

    align-items:center;
    justify-content:space-between;

    border-bottom:1px solid rgba(255,255,255,.08);

}

.cropTitle{

    margin:0;

    font-size:16px;

    font-weight:700;

}

.cropArea{

    width:100%;

    height:min(62vh,500px);

    background:#080808;

    overflow:hidden;

}

#cropImage{

    display:block;

    max-width:100%;

}

.cropFooter{

    padding:13px;

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

}

.cropButton{

    height:46px;

    border:none;

    border-radius:12px;

    font-size:14px;

    font-weight:600;

    cursor:pointer;

}

#cancelCrop{

    background:#2a2a2a;

    color:#fff;

}

#applyCrop{

    background:#fff;

    color:#111;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    header{

        height:56px;

    }

    header h1{

        font-size:20px;

    }

    #viewer{

        top:56px;

    }

    #ui{

        left:10px;
        right:10px;
        bottom:10px;

        padding:12px;

        border-radius:17px;

    }

    .buttonRow{

        grid-template-columns:
            1.3fr
            .85fr
            .95fr;

        gap:9px;

    }

    .button{

        height:48px;

        padding:0 5px;

        font-size:13px;

    }

    .brightnessBox{

        margin-top:10px;

        padding:11px 12px 12px;

    }

}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media(max-width:360px){

    header h1{

        font-size:18px;

    }

    .buttonRow{

        gap:7px;

    }

    .button{

        font-size:12px;

        padding:0 3px;

    }

}


/* =========================================================
   LOADING
========================================================= */

#loading{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:15;

    color:#aaa;

    font-size:14px;

    pointer-events:none;

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <h1>Printmotive 3D T-Shirt Designer</h1>

</header>


<!-- =========================================================
     VIEWER
========================================================= -->

<div id="viewer">

    <div id="loading">
        Loading 3D T-Shirt...
    </div>

</div>


<!-- =========================================================
     HIDDEN FILE INPUT
========================================================= -->

<input
    id="fileInput"
    type="file"
    accept="image/*"
>


<!-- =========================================================
     BOTTOM UI
========================================================= -->

<div id="ui">

    <div class="buttonRow">

        <button
            id="uploadBtn"
            class="button"
            type="button"
        >
            Upload Design
        </button>


        <button
            id="removeBtn"
            class="button"
            type="button"
        >
            Remove
        </button>


        <button
            id="resetBtn"
            class="button"
            type="button"
        >
            Reset View
        </button>

    </div>


    <div class="brightnessBox">

        <div class="brightnessTop">

            <span class="brightnessLabel">
                Brightness
            </span>

            <span id="brightnessValue">
                50%
            </span>

        </div>


        <input
            id="brightness"
            type="range"
            min="0.25"
            max="2"
            step="0.05"
            value="0.5"
        >

    </div>

</div>


<!-- =========================================================
     CROP MODAL
========================================================= -->

<div id="cropModal">

    <div class="cropBox">

        <div class="cropHeader">

            <h2 class="cropTitle">
                Adjust Your Design
            </h2>

        </div>


        <div class="cropArea">

            <img
                id="cropImage"
                alt="Design"
            >

        </div>


        <div class="cropFooter">

            <button
                id="cancelCrop"
                class="cropButton"
                type="button"
            >
                Cancel
            </button>

            <button
                id="applyCrop"
                class="cropButton"
                type="button"
            >
                Apply
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   BASIC VARIABLES
========================================================= */

const viewer = document.getElementById("viewer");

const fileInput = document.getElementById("fileInput");

const uploadBtn = document.getElementById("uploadBtn");

const removeBtn = document.getElementById("removeBtn");

const resetBtn = document.getElementById("resetBtn");

const brightness = document.getElementById("brightness");

const brightnessValue =
    document.getElementById("brightnessValue");

const loading =
    document.getElementById("loading");

const cropModal =
    document.getElementById("cropModal");

const cropImage =
    document.getElementById("cropImage");

const cancelCrop =
    document.getElementById("cancelCrop");

const applyCrop =
    document.getElementById("applyCrop");


/* =========================================================
   PRINT SETTINGS
========================================================= */

/*
   Fixed crop ratio = 3:4
*/

const PRINT_RATIO = 3 / 4;


/*
   Print size
*/

const PRINT_WIDTH = 0.78;

const PRINT_HEIGHT =
    PRINT_WIDTH / PRINT_RATIO;

const PRINT_DEPTH = 0.24;


/*
   IMPORTANT:

   Lower value = print lower on shirt.

   Current requested position:
   0.54
*/

const PRINT_Y_RATIO = 0.54;


/*
   Lower value = more toward center.

   Current requested position:
   0.055
*/

const PRINT_X_OFFSET = 0.055;


/*
   Tiny distance away from shirt surface
*/

const PRINT_OFFSET = 0.004;


/* =========================================================
   DEFAULT BRIGHTNESS
========================================================= */

const DEFAULT_BRIGHTNESS = 0.5;


/* =========================================================
   THREE.JS VARIABLES
========================================================= */

let scene;

let camera;

let renderer;

let controls;

let shirt = null;

let shirtMeshes = [];

let printDecal = null;

let designTexture = null;

let cropper = null;

let originalDesignURL = null;


/* =========================================================
   CAMERA SETTINGS
========================================================= */

const CAMERA_Z = 5.2;

const CAMERA_Y = 0.65;

const TARGET_Y = 0.55;


/* =========================================================
   SHIRT POSITION
========================================================= */

const MODEL_Y_OFFSET = 0.25;


/* =========================================================
   INITIAL CAMERA VALUES
========================================================= */

const initialCameraPosition =
    new THREE.Vector3(
        0,
        CAMERA_Y,
        CAMERA_Z
    );


const initialTarget =
    new THREE.Vector3(
        0,
        TARGET_Y,
        0
    );


/* =========================================================
   SCENE
========================================================= */

scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x090909);


/* =========================================================
   CAMERA
========================================================= */

camera =
    new THREE.PerspectiveCamera(
        45,
        viewer.clientWidth /
        viewer.clientHeight,
        0.1,
        100
    );


camera.position.copy(
    initialCameraPosition
);


/* =========================================================
   RENDERER
========================================================= */

renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        alpha:true,

        powerPreference:"high-performance"

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        1.5
    )
);


renderer.setSize(
    viewer.clientWidth,
    viewer.clientHeight
);


renderer.outputEncoding =
    THREE.sRGBEncoding;


renderer.shadowMap.enabled = true;


renderer.domElement.style.display =
    "block";


viewer.appendChild(
    renderer.domElement
);


/* =========================================================
   ORBIT CONTROLS
========================================================= */

controls =
    new THREE.OrbitControls(
        camera,
        renderer.domElement
    );


controls.target.copy(
    initialTarget
);


controls.enableDamping = true;

controls.dampingFactor = 0.08;

controls.enablePan = false;

controls.minDistance = 3.5;

controls.maxDistance = 7.5;

controls.maxPolarAngle =
    Math.PI * 0.88;

controls.minPolarAngle =
    Math.PI * 0.12;

controls.update();


/* =========================================================
   LIGHTS
========================================================= */

const hemi =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        1.25 * DEFAULT_BRIGHTNESS
    );

hemi.name =
    "Main Hemisphere Light";

scene.add(hemi);


const key =
    new THREE.DirectionalLight(
        0xffffff,
        1.25 * DEFAULT_BRIGHTNESS
    );

key.name =
    "Main Key Light";

key.position.set(
    2.5,
    4,
    4
);

key.castShadow = true;

scene.add(key);


const fill =
    new THREE.DirectionalLight(
        0xffffff,
        0.7 * DEFAULT_BRIGHTNESS
    );

fill.name =
    "Main Fill Light";

fill.position.set(
    -3,
    2,
    2
);

scene.add(fill);


/* =========================================================
   UPDATE BRIGHTNESS
========================================================= */

function updateBrightness(){

    const value =
        parseFloat(
            brightness.value
        );


    if(hemi){

        hemi.intensity =
            1.25 * value;

    }


    if(key){

        key.intensity =
            1.25 * value;

    }


    if(fill){

        fill.intensity =
            0.7 * value;

    }


    const percent =
        Math.round(
            value * 100
        );


    brightnessValue.textContent =
        percent + "%";

}


/*
   Apply default brightness immediately.
*/

updateBrightness();


/* =========================================================
   LOAD SHIRT
========================================================= */

const loader =
    new THREE.GLTFLoader();


loader.load(

    "./shirt.glb",

    function(gltf){

        shirt =
            gltf.scene;


        /*
           Keep the model's original materials.
        */

        shirt.traverse(
            function(object){

                if(
                    object.isMesh
                ){

                    object.castShadow = true;

                    object.receiveShadow = true;

                    shirtMeshes.push(
                        object
                    );

                }

            }
        );


        /*
           Move shirt slightly upward.
        */

        shirt.position.y =
            MODEL_Y_OFFSET;


        scene.add(
            shirt
        );


        loading.style.display =
            "none";


        /*
           Make sure matrices are updated
           before raycasting / decal creation.
        */

        shirt.updateMatrixWorld(
            true
        );

    },

    function(xhr){

        /*
           Progress intentionally kept silent.
        */

    },

    function(error){

        loading.textContent =
            "Unable to load 3D T-Shirt.";

        console.error(
            "GLB loading error:",
            error
        );

    }

);


/* =========================================================
   FIND FRONT SHIRT SURFACE
========================================================= */

function findFrontSurface(){

    if(
        !shirt ||
        shirtMeshes.length === 0
    ){

        return null;

    }


    shirt.updateMatrixWorld(
        true
    );


    const bounds =
        new THREE.Box3()
            .setFromObject(
                shirt
            );


    const size =
        bounds.getSize(
            new THREE.Vector3()
        );


    /*
       Chest position.

       PRINT_Y_RATIO = 0.54
       means slightly below the
       previous chest position.
    */

    const chestY =
        bounds.min.y +
        size.y * PRINT_Y_RATIO;


    /*
       Try center first and then
       tiny left/right positions.
    */

    const xTests = [

        0,

        -size.x * 0.08,

        size.x * 0.08

    ];


    const raycaster =
        new THREE.Raycaster();


    for(
        let i = 0;
        i < xTests.length;
        i++
    ){

        const origin =
            new THREE.Vector3(

                xTests[i],

                chestY,

                bounds.max.z + 2

            );


        raycaster.set(

            origin,

            new THREE.Vector3(
                0,
                0,
                -1
            )

        );


        const hits =
            raycaster.intersectObjects(
                shirtMeshes,
                true
            );


        for(
            let j = 0;
            j < hits.length;
            j++
        ){

            const hit =
                hits[j];


            if(
                !hit.face
            ){

                continue;

            }


            /*
               Convert face normal
               to world space.
            */

            const normalMatrix =
                new THREE.Matrix3()
                    .getNormalMatrix(
                        hit.object.matrixWorld
                    );


            const normal =
                hit.face.normal
                    .clone()
                    .applyMatrix3(
                        normalMatrix
                    )
                    .normalize();


            /*
               Only accept the front-facing
               shirt surface.
            */

            if(
                normal.z <= 0
            ){

                continue;

            }


            return {

                hit:hit,

                normal:normal,

                bounds:bounds,

                size:size,

                chestY:chestY

            };

        }

    }


    return null;

}


/* =========================================================
   REMOVE EXISTING PRINT
========================================================= */

function removePrint(){

    if(
        printDecal
    ){

        scene.remove(
            printDecal
        );


        if(
            printDecal.geometry
        ){

            printDecal.geometry.dispose();

        }


        if(
            printDecal.material
        ){

            printDecal.material.dispose();

        }


        printDecal = null;

    }


    if(
        designTexture
    ){

        designTexture.dispose();

        designTexture = null;

    }

}


/* =========================================================
   APPLY DESIGN TO PRINT AREA
========================================================= */

function applyDesignToShirt(
    texture
){

    if(
        !shirt ||
        shirtMeshes.length === 0
    ){

        return;

    }


    removePrint();


    const surface =
        findFrontSurface();


    if(
        !surface
    ){

        console.warn(
            "Could not find front shirt surface."
        );

        return;

    }


    const hit =
        surface.hit;


    const normal =
        surface.normal;


    /*
       Start from actual shirt surface.
    */

    const position =
        hit.point.clone();


    /*
       Move print toward center.

       This is deliberately much smaller
       than the previous offset.
    */

    position.x +=
        PRINT_X_OFFSET;


    /*
       Tiny offset prevents z-fighting.
    */

    position.add(
        normal
            .clone()
            .multiplyScalar(
                PRINT_OFFSET
            )
    );


    /*
       Orient decal according to actual
       shirt surface normal.

       This allows the decal geometry to
       follow the mesh surface.
    */

    const forward =
        new THREE.Vector3(
            0,
            0,
            1
        );


    const quaternion =
        new THREE.Quaternion();


    quaternion.setFromUnitVectors(
        forward,
        normal
    );


    const orientation =
        new THREE.Euler();


    orientation.setFromQuaternion(
        quaternion,
        "XYZ"
    );


    /*
       Fixed 3:4 print area.
    */

    const decalSize =
        new THREE.Vector3(

            PRINT_WIDTH,

            PRINT_HEIGHT,

            PRINT_DEPTH

        );


    /*
       Project the design directly
       onto the shirt mesh.
    */

    const geometry =
        new THREE.DecalGeometry(

            hit.object,

            position,

            orientation,

            decalSize

        );


    /*
       Transparent material so only
       the actual uploaded design is visible.
    */

    const material =
        new THREE.MeshBasicMaterial({

            map:texture,

            transparent:true,

            opacity:1,

            side:THREE.DoubleSide,

            depthTest:true,

            depthWrite:false,

            polygonOffset:true,

            polygonOffsetFactor:-4,

            polygonOffsetUnits:-4

        });


    printDecal =
        new THREE.Mesh(
            geometry,
            material
        );


    printDecal.renderOrder =
        20;


    printDecal.frustumCulled =
        false;


    scene.add(
        printDecal
    );

}


/* =========================================================
   CREATE FINAL CROPPED TEXTURE
========================================================= */

function createTextureFromCrop(){

    if(
        !cropper
    ){

        return;

    }


    const cropCanvas =
        cropper.getCroppedCanvas({

            width:900,

            height:1200,

            imageSmoothingEnabled:true,

            imageSmoothingQuality:"high",

            fillColor:"transparent"

        });


    if(
        !cropCanvas
    ){

        return;

    }


    /*
       Final fixed print canvas.

       900 x 1200 = 3:4
    */

    const designCanvas =
        document.createElement(
            "canvas"
        );


    designCanvas.width =
        900;

    designCanvas.height =
        1200;


    const ctx =
        designCanvas.getContext(
            "2d"
        );


    ctx.clearRect(
        0,
        0,
        900,
        1200
    );


    ctx.drawImage(

        cropCanvas,

        0,
        0,

        900,
        1200

    );


    /*
       Create Three.js texture.
    */

    designTexture =
        new THREE.CanvasTexture(
            designCanvas
        );


    designTexture.encoding =
        THREE.sRGBEncoding;


    designTexture.minFilter =
        THREE.LinearFilter;


    designTexture.magFilter =
        THREE.LinearFilter;


    designTexture.generateMipmaps =
        false;


    designTexture.needsUpdate =
        true;


    /*
       Apply to actual shirt.
    */

    applyDesignToShirt(
        designTexture
    );

}


/* =========================================================
   OPEN CROP MODAL
========================================================= */

function openCropModal(
    imageURL
){

    cropImage.src =
        imageURL;


    cropModal.classList.add(
        "show"
    );


    /*
       Destroy previous Cropper.
    */

    if(
        cropper
    ){

        cropper.destroy();

        cropper = null;

    }


    cropImage.onload =
        function(){

            cropper =
                new Cropper(
                    cropImage,
                    {

                        aspectRatio:
                            PRINT_RATIO,

                        viewMode:1,

                        dragMode:"move",

                        autoCropArea:0.88,

                        cropBoxMovable:true,

                        cropBoxResizable:true,

                        zoomable:true,

                        movable:true,

                        responsive:true,

                        background:false,

                        guides:true,

                        center:true,

                        highlight:false

                    }
                );

        };

}


/* =========================================================
   CLOSE CROP MODAL
========================================================= */

function closeCropModal(){

    cropModal.classList.remove(
        "show"
    );


    if(
        cropper
    ){

        cropper.destroy();

        cropper = null;

    }


    cropImage.onload = null;

}


/* =========================================================
   UPLOAD BUTTON
========================================================= */

uploadBtn.addEventListener(
    "click",
    function(){

        fileInput.click();

    }
);


/* =========================================================
   FILE SELECT
========================================================= */

fileInput.addEventListener(
    "change",
    function(){

        const file =
            this.files &&
            this.files[0];


        if(
            !file
        ){

            return;

        }


        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            return;

        }


        /*
           Revoke previous object URL.
        */

        if(
            originalDesignURL
        ){

            URL.revokeObjectURL(
                originalDesignURL
            );

        }


        originalDesignURL =
            URL.createObjectURL(
                file
            );


        openCropModal(
            originalDesignURL
        );


        /*
           Allow selecting same file again.
        */

        this.value = "";

    }
);


/* =========================================================
   CANCEL CROP
========================================================= */

cancelCrop.addEventListener(
    "click",
    function(){

        closeCropModal();

    }
);


/* =========================================================
   APPLY CROP
========================================================= */

applyCrop.addEventListener(
    "click",
    function(){

        if(
            !cropper
        ){

            return;

        }


        createTextureFromCrop();


        closeCropModal();

    }
);


/* =========================================================
   REMOVE DESIGN
========================================================= */

removeBtn.addEventListener(
    "click",
    function(){

        removePrint();

    }
);


/* =========================================================
   RESET VIEW
========================================================= */

resetBtn.addEventListener(
    "click",
    function(){

        camera.position.copy(
            initialCameraPosition
        );


        controls.target.copy(
            initialTarget
        );


        controls.update();

    }
);


/* =========================================================
   BRIGHTNESS SLIDER
========================================================= */

brightness.addEventListener(
    "input",
    function(){

        updateBrightness();

    }
);


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        const width =
            viewer.clientWidth;

        const height =
            viewer.clientHeight;


        if(
            height <= 0
        ){

            return;

        }


        camera.aspect =
            width / height;


        camera.updateProjectionMatrix();


        renderer.setSize(
            width,
            height
        );

    }
);


/* =========================================================
   ANIMATION LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    controls.update();


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>

</body>
</html>
