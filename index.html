<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Printmotive 3D T-Shirt Designer</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/geometries/DecalGeometry.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:flex;flex-direction:column}
.header{height:56px;min-height:56px;display:flex;align-items:center;justify-content:center;background:#0d0d0d;border-bottom:1px solid #222;z-index:20}
.logo{font-size:18px;font-weight:800}
#viewer{position:relative;flex:1;min-height:0;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#loading{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#080808}
.loading-title{font-size:18px;font-weight:700;margin-bottom:12px}
.progress-box{width:min(280px,80%);height:7px;background:#222;border-radius:50px;overflow:hidden}
#progress{width:0;height:100%;background:#fff}
#loadingText{margin-top:10px;font-size:13px;color:#aaa}
.controls{min-height:104px;padding:8px;display:flex;align-items:center;justify-content:center;gap:8px;background:#0d0d0d;border-top:1px solid #222;z-index:20;flex-wrap:wrap}
button,.upload-label{border:0;outline:none;padding:11px 14px;border-radius:10px;background:#fff;color:#000;font-size:13px;font-weight:700;cursor:pointer}
button:active,.upload-label:active{transform:scale(.97)}
.secondary{background:#1e1e1e;color:#fff;border:1px solid #333}
input[type=file]{display:none}
.brightness-control{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:#181818;border:1px solid #303030;border-radius:10px;padding:9px;color:#ccc;font-size:13px}
#brightnessSlider{width:175px;accent-color:#fff}
#message{position:fixed;left:50%;bottom:125px;transform:translateX(-50%);z-index:200;display:none;max-width:90%;padding:10px 14px;border-radius:10px;background:#151515;border:1px solid #333;font-size:13px;text-align:center}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:15px;background:rgba(0,0,0,.85)}
.modal.active{display:flex}
.modal-box{width:min(500px,100%);max-height:92vh;overflow:hidden;background:#111;border:1px solid #2a2a2a;border-radius:16px;display:flex;flex-direction:column}
.modal-header{padding:14px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #252525}
.modal-title{font-size:16px;font-weight:800}
.close{width:34px;height:34px;padding:0;border-radius:50%;background:#222;color:#fff;font-size:20px}
.crop-area{position:relative;width:100%;height:min(60vh,500px);background:#050505;overflow:hidden}
.crop-area img{display:block;max-width:100%}
.crop-info{padding:10px 15px;color:#aaa;font-size:12px;line-height:1.5;text-align:center;border-top:1px solid #222}
.modal-buttons{padding:12px 15px;display:flex;gap:8px;border-top:1px solid #222}
.modal-buttons button{flex:1}
@media(max-width:600px){
.header{height:55px;min-height:55px}
.logo{font-size:16px}
.controls{min-height:104px}
button,.upload-label{padding:10px 11px;font-size:12px}
#brightnessSlider{width:160px}
}
</style>
</head>

<body>

<div class="header">
<div class="logo">Printmotive 3D T-Shirt Designer</div>
</div>

<div id="viewer">
<div id="loading">
<div class="loading-title">Loading T-Shirt...</div>
<div class="progress-box"><div id="progress"></div></div>
<div id="loadingText">Preparing 3D model</div>
</div>
</div>

<div class="controls">
<label class="upload-label" for="designInput">Upload Design</label>
<input id="designInput" type="file" accept="image/png,image/jpeg,image/webp">
<button id="removeBtn" class="secondary">Remove</button>
<button id="resetBtn" class="secondary">Reset View</button>
<div class="brightness-control">
<span>Brightness</span>
<input id="brightnessSlider" type="range" min=".30" max="1.10" step=".05" value=".70">
</div>
</div>

<div id="message"></div>

<div id="cropModal" class="modal">
<div class="modal-box">
<div class="modal-header">
<div class="modal-title">Adjust Your Design</div>
<button id="closeCrop" class="close">×</button>
</div>
<div class="crop-area">
<img id="cropImage" alt="Design">
</div>
<div class="crop-info">
Move and zoom your design.<br>
Print ratio is fixed at <b>3 : 4</b>.
</div>
<div class="modal-buttons">
<button id="cancelCrop" class="secondary">Cancel</button>
<button id="applyCrop">Apply Design</button>
</div>
</div>
</div>

<script>
const MODEL_FILE="shirt.glb";
const PRINT_RATIO=3/4;
const PRINT_WIDTH=.78;
const PRINT_HEIGHT=PRINT_WIDTH/PRINT_RATIO;
const PRINT_DEPTH=.16;
const PRINT_X=0;
const PRINT_Y_RATIO=.60;
const MODEL_Y_OFFSET=.22;
const DEFAULT_CAMERA_Z=5.0;
const DEFAULT_CAMERA_Y=.68;
const DEFAULT_TARGET_Y=.55;

let scene,camera,renderer,controls,shirt=null,decal=null,designTexture=null,cropper=null,designURL=null;
let shirtMeshes=[];
let shirtBounds=null;

const viewer=document.getElementById("viewer");
const loading=document.getElementById("loading");
const progress=document.getElementById("progress");
const loadingText=document.getElementById("loadingText");
const designInput=document.getElementById("designInput");
const cropModal=document.getElementById("cropModal");
const cropImage=document.getElementById("cropImage");
const applyCrop=document.getElementById("applyCrop");
const cancelCrop=document.getElementById("cancelCrop");
const closeCrop=document.getElementById("closeCrop");
const removeBtn=document.getElementById("removeBtn");
const resetBtn=document.getElementById("resetBtn");
const brightnessSlider=document.getElementById("brightnessSlider");
const message=document.getElementById("message");

function showMessage(text){
message.textContent=text;
message.style.display="block";
clearTimeout(showMessage.timer);
showMessage.timer=setTimeout(()=>message.style.display="none",2800);
}

scene=new THREE.Scene();
scene.background=new THREE.Color(0x080808);

camera=new THREE.PerspectiveCamera(
35,
viewer.clientWidth/viewer.clientHeight,
.01,
100
);
camera.position.set(0,DEFAULT_CAMERA_Y,DEFAULT_CAMERA_Z);

renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:"high-performance"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.35));
renderer.setSize(viewer.clientWidth,viewer.clientHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.physicallyCorrectLights=false;
viewer.appendChild(renderer.domElement);

const ambient=new THREE.HemisphereLight(0xffffff,0x222222,.75);
scene.add(ambient);

const keyLight=new THREE.DirectionalLight(0xffffff,1.15);
keyLight.position.set(2,4,4);
scene.add(keyLight);

const fillLight=new THREE.DirectionalLight(0xffffff,.35);
fillLight.position.set(-3,2,2);
scene.add(fillLight);

function applyBrightness(value){
const b=parseFloat(value);
ambient.intensity=.75*b;
keyLight.intensity=1.15*b;
fillLight.intensity=.35*b;
}

brightnessSlider.addEventListener("input",()=>{
applyBrightness(brightnessSlider.value);
});

applyBrightness(brightnessSlider.value);

controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.08;
controls.enablePan=false;
controls.minDistance=3.0;
controls.maxDistance=7.0;
controls.target.set(0,DEFAULT_TARGET_Y,0);
controls.update();

const loader=new THREE.GLTFLoader();

loader.load(
MODEL_FILE,
gltf=>{
shirt=gltf.scene;

const originalBox=new THREE.Box3().setFromObject(shirt);
const size=originalBox.getSize(new THREE.Vector3());
const center=originalBox.getCenter(new THREE.Vector3());

shirt.position.sub(center);

const maxSize=Math.max(size.x,size.y,size.z);
if(maxSize>0){
shirt.scale.multiplyScalar(2.2/maxSize);
}

shirt.position.y+=MODEL_Y_OFFSET;

shirt.traverse(object=>{
if(object.isMesh){
shirtMeshes.push(object);
object.castShadow=false;
object.receiveShadow=false;
if(object.material){
object.material.side=THREE.FrontSide;
}
}
});

scene.add(shirt);
shirt.updateMatrixWorld(true);
updateShirtBounds();

loading.style.display="none";
},
xhr=>{
if(xhr.total){
const percent=xhr.loaded/xhr.total*100;
progress.style.width=percent.toFixed(0)+"%";
loadingText.textContent="Loading T-Shirt "+percent.toFixed(0)+"%";
}
},
error=>{
console.error("GLB ERROR:",error);
loadingText.textContent="Could not load shirt.glb";
showMessage("shirt.glb could not be loaded.");
}
);

function updateShirtBounds(){
if(!shirt)return;
shirt.updateMatrixWorld(true);
shirtBounds=new THREE.Box3().setFromObject(shirt);
}

function findPrintSurface(){
if(!shirt||!shirtMeshes.length)return null;

updateShirtBounds();

const height=shirtBounds.max.y-shirtBounds.min.y;
const targetY=shirtBounds.min.y+height*PRINT_Y_RATIO;
const targetX=(shirtBounds.min.x+shirtBounds.max.x)/2+PRINT_X;

const rayStart=new THREE.Vector3(
targetX,
targetY,
shirtBounds.max.z+2
);

const rayDirection=new THREE.Vector3(0,0,-1);

const raycaster=new THREE.Raycaster();
raycaster.set(rayStart,rayDirection);

const hits=raycaster.intersectObjects(shirtMeshes,true);

if(!hits.length)return null;

for(let i=0;i<hits.length;i++){
const hit=hits[i];

if(hit.object&&hit.face){
return hit;
}
}

return null;
}

function removeDecal(){
if(!decal)return;

if(decal.parent){
decal.parent.remove(decal);
}

if(decal.geometry){
decal.geometry.dispose();
}

if(decal.material){
decal.material.dispose();
}

decal=null;
}

function createPrintDecal(){
if(!shirt||!designTexture)return;

removeDecal();

const hit=findPrintSurface();

if(!hit){
showMessage("Could not find the front print area.");
return;
}

const mesh=hit.object;

mesh.updateMatrixWorld(true);

const localPosition=mesh.worldToLocal(
hit.point.clone()
);

const localNormal=hit.face.normal.clone().normalize();

const quaternion=new THREE.Quaternion();
quaternion.setFromUnitVectors(
new THREE.Vector3(0,0,1),
localNormal
);

const orientation=new THREE.Euler();
orientation.setFromQuaternion(quaternion);

const worldScale=new THREE.Vector3();
mesh.getWorldScale(worldScale);

const sx=Math.max(Math.abs(worldScale.x),.0001);
const sy=Math.max(Math.abs(worldScale.y),.0001);
const sz=Math.max(Math.abs(worldScale.z),.0001);

const decalSize=new THREE.Vector3(
PRINT_WIDTH/sx,
PRINT_HEIGHT/sy,
PRINT_DEPTH/sz
);

const geometry=new THREE.DecalGeometry(
mesh,
localPosition,
orientation,
decalSize
);

const material=new THREE.MeshBasicMaterial({
map:designTexture,
transparent:true,
depthTest:true,
depthWrite:false,
polygonOffset:true,
polygonOffsetFactor:-4,
polygonOffsetUnits:-4,
side:THREE.DoubleSide
});

decal=new THREE.Mesh(
geometry,
material
);

mesh.add(decal);
decal.renderOrder=10;
}

designInput.addEventListener("change",event=>{
const file=event.target.files&&event.target.files[0];

if(!file)return;

if(!file.type.startsWith("image/")){
showMessage("Please select an image file.");
return;
}

if(designURL){
URL.revokeObjectURL(designURL);
}

designURL=URL.createObjectURL(file);
cropImage.src=designURL;
cropModal.classList.add("active");

cropImage.onload=()=>{
setupCropper();
};
});

function setupCropper(){
if(cropper){
cropper.destroy();
cropper=null;
}

cropper=new Cropper(cropImage,{
aspectRatio:PRINT_RATIO,
responsive:true,
viewMode:1,
dragMode:"move",
autoCropArea:.80,
background:false,
guides:true,
center:true,
highlight:false,
cropBoxMovable:false,
cropBoxResizable:true,
zoomable:true,
zoomOnWheel:true,
zoomOnTouch:true,
movable:true,
rotatable:false,
scalable:false
});
}

applyCrop.addEventListener("click",()=>{
if(!cropper){
showMessage("Please select a design first.");
return;
}

const canvas=cropper.getCroppedCanvas({
width:1200,
height:Math.round(1200/PRINT_RATIO),
imageSmoothingEnabled:true,
imageSmoothingQuality:"high"
});

if(!canvas){
showMessage("Could not crop image.");
return;
}

const texture=new THREE.CanvasTexture(canvas);

texture.encoding=THREE.sRGBEncoding;
texture.minFilter=THREE.LinearFilter;
texture.magFilter=THREE.LinearFilter;
texture.generateMipmaps=false;

if(designTexture){
designTexture.dispose();
}

designTexture=texture;

createPrintDecal();

if(decal){
closeCropModal();
showMessage("Design applied to print area.");
}else{
showMessage("Could not create print area.");
}
});

function closeCropModal(){
cropModal.classList.remove("active");

if(cropper){
cropper.destroy();
cropper=null;
}

designInput.value="";
}

cancelCrop.addEventListener("click",closeCropModal);
closeCrop.addEventListener("click",closeCropModal);

removeBtn.addEventListener("click",()=>{
removeDecal();

if(designTexture){
designTexture.dispose();
designTexture=null;
}

showMessage("Design removed.");
});

resetBtn.addEventListener("click",()=>{
camera.position.set(
0,
DEFAULT_CAMERA_Y,
DEFAULT_CAMERA_Z
);

if(controls){
controls.target.set(
0,
DEFAULT_TARGET_Y,
0
);
controls.update();
}

if(decal&&designTexture){
createPrintDecal();
}
});

window.addEventListener("resize",()=>{
const width=viewer.clientWidth;
const height=viewer.clientHeight;

camera.aspect=width/height;
camera.updateProjectionMatrix();

renderer.setSize(width,height);
});

function animate(){
requestAnimationFrame(animate);

if(controls){
controls.update();
}

renderer.render(scene,camera);
}

animate();
</script>

</body>
</html>
