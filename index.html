<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Printmotive 3D T-Shirt Designer</title>


<!-- =========================================================
     THREE.JS
     IMPORTANT:
     All THREE files use EXACTLY the same version.
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>


<!-- =========================================================
     CROPPER
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">


<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #080a0d;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

body {

    overflow-x: hidden;

    -webkit-tap-highlight-color:
        transparent;

}


/* =========================================================
   APP
========================================================= */

.app {

    width: 100%;

    max-width: 900px;

    margin: auto;

    min-height: 100vh;

    display: flex;

    flex-direction: column;

}


/* =========================================================
   HEADER
========================================================= */

.header {

    height: 60px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 16px;

    background: #111419;

    border-bottom:
        1px solid #272b32;

}

.logo {

    font-size: 19px;

    font-weight: 800;

}

.badge {

    font-size: 11px;

    color: #aeb5c0;

    background: #20242b;

    padding: 6px 9px;

    border-radius: 20px;

}


/* =========================================================
   VIEWER
========================================================= */

.viewer {

    position: relative;

    width: 100%;

    height: 62vh;

    min-height: 430px;

    background:

        radial-gradient(
            circle at 50% 35%,
            #30353d 0%,
            #15181d 40%,
            #080a0d 75%
        );

    overflow: hidden;

}

#canvas {

    width: 100%;

    height: 100%;

    display: block;

    touch-action: none;

}


/* =========================================================
   HINT
========================================================= */

.hint {

    position: absolute;

    left: 50%;

    bottom: 14px;

    transform:
        translateX(-50%);

    padding: 8px 13px;

    background:
        rgba(0,0,0,.65);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 30px;

    font-size: 12px;

    color: #dce1e8;

    white-space: nowrap;

    pointer-events: none;

}


/* =========================================================
   CONTROL PANEL
========================================================= */

.panel {

    padding: 16px;

    background: #111419;

    border-top:
        1px solid #272b32;

}

.buttons {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

}

.btn {

    border: none;

    padding: 12px 17px;

    border-radius: 12px;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    background: white;

    color: #111;

    touch-action: manipulation;

}

.btn.secondary {

    background: #252a31;

    color: white;

}

.btn:active {

    transform: scale(.97);

}

input[type="file"] {

    display: none;

}


/* =========================================================
   STATUS
========================================================= */

.status {

    margin-top: 11px;

    font-size: 12px;

    color: #aeb6c3;

    line-height: 1.5;

}

.note {

    margin-top: 7px;

    font-size: 11px;

    color: #747d89;

}


/* =========================================================
   LOADING
========================================================= */

.loading-box {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    width: min(320px, 80%);

    padding: 20px;

    border-radius: 16px;

    background:
        rgba(10,12,16,.88);

    border:
        1px solid
        rgba(255,255,255,.08);

    text-align: center;

    z-index: 10;

    pointer-events: none;

}

.loading-title {

    font-size: 15px;

    font-weight: 700;

    margin-bottom: 12px;

}

.loading-percent {

    font-size: 12px;

    color: #b8c0cb;

    margin-bottom: 10px;

}

.progress {

    width: 100%;

    height: 6px;

    border-radius: 20px;

    background: #292e36;

    overflow: hidden;

}

.progress-bar {

    width: 0%;

    height: 100%;

    background: white;

    border-radius: 20px;

    transition:
        width .15s linear;

}


/* =========================================================
   CROP MODAL
========================================================= */

.modal {

    position: fixed;

    inset: 0;

    z-index: 999;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 14px;

    background:
        rgba(0,0,0,.88);

}

.modal.show {

    display: flex;

}

.modal-box {

    width:
        min(720px, 100%);

    background: #15181d;

    border:
        1px solid #30353e;

    border-radius: 18px;

    padding: 14px;

}

.modal-title {

    font-size: 14px;

    font-weight: 700;

    margin-bottom: 10px;

}

.crop-area {

    width: 100%;

    height: 55vh;

    min-height: 300px;

    background: #080a0d;

    overflow: hidden;

}

.crop-area img {

    max-width: 100%;

    display: block;

}

.modal-buttons {

    display: flex;

    justify-content: flex-end;

    gap: 9px;

    margin-top: 12px;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    .header {

        height: 54px;

        padding:
            0 12px;

    }

    .logo {

        font-size: 17px;

    }

    .badge {

        font-size: 10px;

    }

    .viewer {

        height: 60vh;

        min-height: 390px;

    }

    .panel {

        padding: 12px;

    }

    .btn {

        flex: 1;

        min-width: 120px;

        padding:
            12px 10px;

        font-size: 13px;

    }

    .hint {

        font-size: 11px;

        bottom: 10px;

    }

}

</style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="logo">
            Printmotive
        </div>

        <div class="badge">
            3D Designer Prototype
        </div>

    </header>


    <!-- =====================================================
         3D VIEWER
    ====================================================== -->

    <section
        class="viewer"
        id="viewer"
    >

        <canvas
            id="canvas"
        ></canvas>


        <!-- LOADING -->

        <div
            class="loading-box"
            id="loadingBox"
        >

            <div
                class="loading-title"
            >
                Loading 3D T-Shirt
            </div>

            <div
                class="loading-percent"
                id="loadingPercent"
            >
                Starting...
            </div>

            <div
                class="progress"
            >

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>

        </div>


        <div class="hint">

            Drag to rotate
            •
            Pinch to zoom

        </div>

    </section>


    <!-- =====================================================
         CONTROLS
    ====================================================== -->

    <section class="panel">

        <div class="buttons">


            <label
                class="btn"
                for="designInput"
            >

                📷 Upload Design

            </label>


            <input
                id="designInput"
                type="file"
                accept="image/*"
            >


            <button
                class="btn secondary"
                id="removeDesign"
            >

                Remove Design

            </button>


            <button
                class="btn secondary"
                id="resetView"
            >

                Reset View

            </button>


        </div>


        <div
            class="status"
            id="status"
        >

            Loading 3D T-shirt...

        </div>


        <div class="note">

            Prototype processing happens
            inside your browser.

        </div>

    </section>


</div>


<!-- =========================================================
     CROP MODAL
========================================================= -->

<div
    class="modal"
    id="cropModal"
>

    <div class="modal-box">


        <div class="modal-title">

            Crop your design

        </div>


        <div class="crop-area">

            <img
                id="cropImage"
                alt="Crop image"
            >

        </div>


        <div class="modal-buttons">


            <button
                class="btn secondary"
                id="cancelCrop"
            >

                Cancel

            </button>


            <button
                class="btn"
                id="applyCrop"
            >

                Apply to T-Shirt

            </button>


        </div>


    </div>

</div>



<script>

/* =========================================================
   CONFIG
========================================================= */

const MODEL_FILE =
    "./shirt.glb";


/* =========================================================
   VARIABLES
========================================================= */

let scene = null;

let camera = null;

let renderer = null;

let controls = null;

let shirt = null;

let originalMaterials = [];

let designTexture = null;

let cropper = null;


/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById(
        "canvas"
    );

const viewer =
    document.getElementById(
        "viewer"
    );

const status =
    document.getElementById(
        "status"
    );

const designInput =
    document.getElementById(
        "designInput"
    );

const cropModal =
    document.getElementById(
        "cropModal"
    );

const cropImage =
    document.getElementById(
        "cropImage"
    );

const loadingBox =
    document.getElementById(
        "loadingBox"
    );

const loadingPercent =
    document.getElementById(
        "loadingPercent"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );


/* =========================================================
   ENGINE CHECK
========================================================= */

if (
    typeof THREE ===
    "undefined"
) {

    status.innerText =
        "Three.js failed to load. Check your internet connection.";

    throw new Error(
        "Three.js failed to load."
    );

}


if (
    typeof THREE.OrbitControls ===
    "undefined"
) {

    status.innerText =
        "OrbitControls failed to load.";

    throw new Error(
        "OrbitControls failed to load."
    );

}


if (
    typeof THREE.GLTFLoader ===
    "undefined"
) {

    status.innerText =
        "GLTFLoader failed to load.";

    throw new Error(
        "GLTFLoader failed to load."
    );

}


/* =========================================================
   INIT
========================================================= */

function init() {


    /* =====================================================
       SCENE
    ====================================================== */

    scene =
        new THREE.Scene();


    /* =====================================================
       CAMERA
    ====================================================== */

    camera =
        new THREE.PerspectiveCamera(
            35,
            1,
            0.01,
            1000
        );


    camera.position.set(
        0,
        0.8,
        3.4
    );


    /* =====================================================
       RENDERER
    ====================================================== */

    renderer =
        new THREE.WebGLRenderer({

            canvas:
                canvas,

            antialias:
                true,

            alpha:
                true,

            powerPreference:
                "high-performance",

            preserveDrawingBuffer:
                false

        });


    /*
       Mobile performance:
       cap pixel ratio.
    */

    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio || 1,

            1.35

        )

    );


    renderer.outputEncoding =
        THREE.sRGBEncoding;


    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
        1.15;


    /* =====================================================
       LIGHTS
    ====================================================== */

    const hemiLight =
        new THREE.HemisphereLight(

            0xffffff,

            0x333333,

            2.1

        );

    scene.add(
        hemiLight
    );


    const keyLight =
        new THREE.DirectionalLight(

            0xffffff,

            2.5

        );


    keyLight.position.set(
        3,
        5,
        4
    );


    scene.add(
        keyLight
    );


    const fillLight =
        new THREE.DirectionalLight(

            0xffffff,

            1.2

        );


    fillLight.position.set(
        -4,
        2,
        2
    );


    scene.add(
        fillLight
    );


    /* =====================================================
       ORBIT CONTROLS
    ====================================================== */

    controls =
        new THREE.OrbitControls(

            camera,

            canvas

        );


    controls.enableDamping =
        true;


    controls.dampingFactor =
        0.08;


    controls.enablePan =
        false;


    controls.minDistance =
        1.5;


    controls.maxDistance =
        6;


    controls.rotateSpeed =
        0.7;


    controls.zoomSpeed =
        0.8;


    controls.target.set(

        0,
        0.55,
        0

    );


    controls.update();


    /* =====================================================
       LOAD MODEL
    ====================================================== */

    loadModel();


    /* =====================================================
       RESIZE
    ====================================================== */

    resize();


    window.addEventListener(

        "resize",

        resize

    );


    /* =====================================================
       START RENDER LOOP
    ====================================================== */

    animate();

}


/* =========================================================
   LOAD GLB
========================================================= */

function loadModel() {


    status.innerText =
        "Loading 3D T-shirt...";


    const loader =
        new THREE.GLTFLoader();


    loader.load(

        MODEL_FILE,


        /* =================================================
           SUCCESS
        ================================================== */

        function(gltf) {


            shirt =
                gltf.scene;


            originalMaterials =
                [];


            shirt.traverse(

                function(object) {


                    if (
                        !object.isMesh
                    ) {

                        return;

                    }


                    /*
                       Disable expensive shadows.
                       This improves mobile performance.
                    */

                    object.castShadow =
                        false;

                    object.receiveShadow =
                        false;


                    originalMaterials.push({

                        mesh:
                            object,

                        material:
                            object.material

                    });


                    /*
                       Improve texture filtering.
                    */

                    if (
                        object.material &&
                        object.material.map
                    ) {

                        object.material.map
                            .generateMipmaps =
                            true;

                    }

                }

            );


            /* =============================================
               CENTER MODEL
            ============================================== */

            const box =
                new THREE.Box3()
                    .setFromObject(
                        shirt
                    );


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            shirt.position.sub(
                center
            );


            /* =============================================
               NORMALIZE SIZE
            ============================================== */

            const maxSize =
                Math.max(

                    size.x,

                    size.y,

                    size.z

                );


            if (
                maxSize > 0
            ) {

                shirt.scale
                    .multiplyScalar(
                        2.2 / maxSize
                    );

            }


            /* =============================================
               ADD TO SCENE
            ============================================== */

            scene.add(
                shirt
            );


            /* =============================================
               HIDE LOADING
            ============================================== */

            progressBar.style.width =
                "100%";


            loadingPercent.innerText =
                "100%";


            setTimeout(

                function() {

                    loadingBox.style.display =
                        "none";

                },

                250

            );


            status.innerText =
                "3D T-shirt ready. Upload your design.";

        },


        /* =================================================
           PROGRESS
        ================================================== */

        function(xhr) {


            if (
                xhr.lengthComputable
            ) {


                const percent =
                    (
                        xhr.loaded /
                        xhr.total
                    ) * 100;


                const rounded =
                    Math.min(

                        100,

                        Math.round(
                            percent
                        )

                    );


                progressBar.style.width =
                    rounded + "%";


                loadingPercent.innerText =
                    rounded + "%";

            }
            else {

                loadingPercent.innerText =
                    "Loading...";

            }

        },


        /* =================================================
           ERROR
        ================================================== */

        function(error) {


            console.error(
                "GLB ERROR:",
                error
            );


            loadingBox.style.display =
                "none";


            status.innerText =
                "Model load failed. Make sure shirt.glb is beside index.html.";

        }

    );

}


/* =========================================================
   RESIZE
========================================================= */

function resize() {


    if (
        !renderer ||
        !camera ||
        !viewer
    ) {

        return;

    }


    const rect =
        viewer.getBoundingClientRect();


    if (
        rect.width <= 0 ||
        rect.height <= 0
    ) {

        return;

    }


    renderer.setSize(

        rect.width,

        rect.height,

        false

    );


    camera.aspect =
        rect.width /
        rect.height;


    camera.updateProjectionMatrix();

}


/* =========================================================
   CREATE DESIGN TEXTURE
========================================================= */

function createDesignTexture(
    image
) {


    const textureCanvas =
        document.createElement(
            "canvas"
        );


    const context =
        textureCanvas.getContext(
            "2d"
        );


    /*
       1536 instead of 2048
       for better mobile memory/performance.
    */

    const size =
        1536;


    textureCanvas.width =
        size;


    textureCanvas.height =
        size;


    context.clearRect(

        0,
        0,
        size,
        size

    );


    const scale =
        Math.min(

            size / image.width,

            size / image.height

        );


    const width =
        image.width *
        scale;


    const height =
        image.height *
        scale;


    context.drawImage(

        image,

        (size - width) / 2,

        (size - height) / 2,

        width,

        height

    );


    const texture =
        new THREE.CanvasTexture(
            textureCanvas
        );


    texture.encoding =
        THREE.sRGBEncoding;


    texture.generateMipmaps =
        true;


    texture.minFilter =
        THREE.LinearMipmapLinearFilter;


    texture.magFilter =
        THREE.LinearFilter;


    /*
       Limit anisotropy on mobile.
    */

    texture.anisotropy =
        Math.min(

            4,

            renderer
                .capabilities
                .getMaxAnisotropy()

        );


    texture.needsUpdate =
        true;


    return texture;

}


/* =========================================================
   APPLY DESIGN
========================================================= */

function applyDesign(
    image
) {


    if (!shirt) {

        status.innerText =
            "Please wait for the 3D model to load.";

        return;

    }


    /*
       Dispose previous texture.
    */

    if (
        designTexture
    ) {

        designTexture.dispose();

        designTexture =
            null;

    }


    designTexture =
        createDesignTexture(
            image
        );


    /*
       Prototype:
       apply uploaded design to
       model meshes.
    */

    shirt.traverse(

        function(object) {


            if (
                !object.isMesh
            ) {

                return;

            }


            const oldMaterial =
                object.material;


            /*
               Handle material arrays.
            */

            if (
                Array.isArray(
                    oldMaterial
                )
            ) {


                const newMaterials =
                    oldMaterial.map(

                        function(material) {


                            const cloned =
                                material.clone();


                            cloned.map =
                                designTexture;


                            cloned.needsUpdate =
                                true;


                            return cloned;

                        }

                    );


                object.material =
                    newMaterials;


            }
            else {


                const newMaterial =
                    oldMaterial.clone();


                newMaterial.map =
                    designTexture;


                newMaterial.needsUpdate =
                    true;


                object.material =
                    newMaterial;

            }

        }

    );


    status.innerText =
        "Design applied. Drag the T-shirt to rotate.";

}


/* =========================================================
   FILE UPLOAD
========================================================= */

designInput.addEventListener(

    "change",

    function(event) {


        const file =
            event.target.files[0];


        if (!file) {

            return;

        }


        /*
           Only images.
        */

        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            status.innerText =
                "Please select an image.";

            return;

        }


        const imageURL =
            URL.createObjectURL(
                file
            );


        cropImage.onload =
            function() {


                if (
                    cropper
                ) {

                    cropper.destroy();

                }


                cropper =
                    new Cropper(

                        cropImage,

                        {

                            viewMode:
                                1,

                            autoCropArea:
                                0.8,

                            background:
                                false,

                            responsive:
                                true,

                            zoomable:
                                true,

                            movable:
                                true,

                            rotatable:
                                false,

                            scalable:
                                false

                        }

                    );


                cropModal.classList.add(
                    "show"
                );


                URL.revokeObjectURL(
                    imageURL
                );

            };


        cropImage.src =
            imageURL;

    }

);


/* =========================================================
   CANCEL CROP
========================================================= */

document
    .getElementById(
        "cancelCrop"
    )
    .addEventListener(

        "click",

        function() {


            cropModal.classList.remove(
                "show"
            );


            if (
                cropper
            ) {

                cropper.destroy();

                cropper =
                    null;

            }


            designInput.value =
                "";

        }

    );


/* =========================================================
   APPLY CROP
========================================================= */

document
    .getElementById(
        "applyCrop"
    )
    .addEventListener(

        "click",

        function() {


            if (
                !cropper
            ) {

                return;

            }


            const croppedCanvas =
                cropper.getCroppedCanvas({

                    maxWidth:
                        1536,

                    maxHeight:
                        1536,

                    imageSmoothingQuality:
                        "high"

                });


            if (
                !croppedCanvas
            ) {

                return;

            }


            const image =
                new Image();


            image.onload =
                function() {


                    applyDesign(
                        image
                    );


                    /*
                       Cleanup cropper.
                    */

                    if (
                        cropper
                    ) {

                        cropper.destroy();

                        cropper =
                            null;

                    }

                };


            /*
               JPEG is smaller than PNG
               for normal designs.

               Use PNG if transparency is
               important later.
            */

            image.src =
                croppedCanvas.toDataURL(
                    "image/png"
                );


            cropModal.classList.remove(
                "show"
            );

        }

    );


/* =========================================================
   REMOVE DESIGN
========================================================= */

document
    .getElementById(
        "removeDesign"
    )
    .addEventListener(

        "click",

        function() {


            if (
                !shirt
            ) {

                return;

            }


            originalMaterials.forEach(

                function(item) {


                    item.mesh.material =
                        item.material;

                }

            );


            if (
                designTexture
            ) {

                designTexture.dispose();

                designTexture =
                    null;

            }


            status.innerText =
                "Design removed.";

        }

    );


/* =========================================================
   RESET VIEW
========================================================= */

document
    .getElementById(
        "resetView"
    )
    .addEventListener(

        "click",

        function() {


            if (
                !camera ||
                !controls
            ) {

                return;

            }


            camera.position.set(

                0,

                0.8,

                3.4

            );


            controls.target.set(

                0,

                0.55,

                0

            );


            controls.update();

        }

    );


/* =========================================================
   ANIMATION
========================================================= */

function animate() {


    requestAnimationFrame(
        animate
    );


    if (
        controls
    ) {

        controls.update();

    }


    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(

            scene,

            camera

        );

    }

}
