<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Printmotive 3D T-Shirt Designer</title>


<!-- =====================================================
     THREE.JS
     ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/examples/js/controls/OrbitControls.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/examples/js/loaders/GLTFLoader.js"></script>


<!-- =====================================================
     CROPPER
     ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css"
>


<style>

/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;

    padding: 0;

    width: 100%;

    min-height: 100%;

    background: #080a0d;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


body {

    overflow-x: hidden;

}


/* =====================================================
   APP
   ===================================================== */

.app {

    width: 100%;

    max-width: 900px;

    margin: auto;

    min-height: 100vh;

    display: flex;

    flex-direction: column;

}


/* =====================================================
   HEADER
   ===================================================== */

.header {

    height: 60px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 16px;

    background: #111419;

    border-bottom:
        1px solid #272b32;

    flex-shrink: 0;

}


.logo {

    font-size: 19px;

    font-weight: 800;

}


.badge {

    font-size: 11px;

    color: #aeb5c0;

    background: #20242b;

    padding: 6px 9px;

    border-radius: 20px;

}


/* =====================================================
   VIEWER
   ===================================================== */

.viewer {

    position: relative;

    width: 100%;

    height: 62vh;

    min-height: 430px;

    background:
        radial-gradient(
            circle at 50% 35%,
            #30353d 0%,
            #15181d 40%,
            #080a0d 75%
        );

    overflow: hidden;

}


#canvas {

    width: 100%;

    height: 100%;

    display: block;

    touch-action: none;

}


/* =====================================================
   HINT
   ===================================================== */

.hint {

    position: absolute;

    left: 50%;

    bottom: 14px;

    transform:
        translateX(-50%);

    padding:
        8px 13px;

    background:
        rgba(0,0,0,.65);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 30px;

    font-size: 12px;

    color: #dce1e8;

    white-space: nowrap;

    pointer-events: none;

}


/* =====================================================
   MESSAGE
   ===================================================== */

.viewer-message {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    width:
        calc(100% - 40px);

    max-width: 430px;

    padding: 18px;

    text-align: center;

    background:
        rgba(8,10,13,.90);

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 16px;

    z-index: 10;

}


.viewer-message.hidden {

    display: none;

}


.viewer-message-title {

    font-size: 16px;

    font-weight: 700;

    margin-bottom: 8px;

}


.viewer-message-text {

    font-size: 12px;

    line-height: 1.5;

    color: #aeb6c3;

}


/* =====================================================
   PANEL
   ===================================================== */

.panel {

    padding: 16px;

    background: #111419;

    border-top:
        1px solid #272b32;

    flex-shrink: 0;

}


.buttons {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

}


.btn {

    border: none;

    padding:
        12px 17px;

    border-radius: 12px;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    background: white;

    color: #111;

    min-height: 46px;

    display: inline-flex;

    align-items: center;

    justify-content: center;

    user-select: none;

}


.btn.secondary {

    background: #252a31;

    color: white;

}


.btn:active {

    transform:
        scale(.97);

}


input[type="file"] {

    display: none;

}


.status {

    margin-top: 11px;

    font-size: 12px;

    color: #aeb6c3;

    line-height: 1.5;

}


.note {

    margin-top: 7px;

    font-size: 11px;

    color: #747d89;

}


/* =====================================================
   MODAL
   ===================================================== */

.modal {

    position: fixed;

    inset: 0;

    z-index: 999;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 14px;

    background:
        rgba(0,0,0,.88);

}


.modal.show {

    display: flex;

}


.modal-box {

    width:
        min(720px, 100%);

    max-height:
        calc(100vh - 28px);

    overflow: hidden;

    background: #15181d;

    border:
        1px solid #30353e;

    border-radius: 18px;

    padding: 14px;

}


.modal-title {

    font-size: 14px;

    font-weight: 700;

    margin-bottom: 10px;

}


.crop-area {

    width: 100%;

    height: 55vh;

    min-height: 300px;

    background: #080a0d;

    overflow: hidden;

}


.crop-area img {

    max-width: 100%;

    display: block;

}


.modal-buttons {

    display: flex;

    justify-content: flex-end;

    gap: 9px;

    margin-top: 12px;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 600px) {

    .viewer {

        height: 62vh;

        min-height: 430px;

    }


    .buttons {

        display: grid;

        grid-template-columns:
            1fr 1fr;

        width: 100%;

    }


    .btn {

        width: 100%;

    }

}


</style>

</head>


<body>


<div class="app">


<!-- =====================================================
     HEADER
     ===================================================== -->

<header class="header">

    <div class="logo">
        Printmotive
    </div>

    <div class="badge">
        3D Designer Prototype
    </div>

</header>


<!-- =====================================================
     3D VIEWER
     ===================================================== -->

<section
    class="viewer"
    id="viewer"
>

    <canvas id="canvas"></canvas>


    <div
        class="hint"
    >
        Drag to rotate • Pinch to zoom
    </div>


    <div
        class="viewer-message"
        id="viewerMessage"
    >

        <div
            class="viewer-message-title"
            id="viewerMessageTitle"
        >
            Loading 3D T-shirt...
        </div>


        <div
            class="viewer-message-text"
            id="viewerMessageText"
        >
            Please wait.
        </div>

    </div>

</section>


<!-- =====================================================
     CONTROLS
     ===================================================== -->

<section class="panel">

    <div class="buttons">


        <label
            class="btn"
            for="designInput"
        >
            📷 Upload Design
        </label>


        <input
            id="designInput"
            type="file"
            accept="image/*"
        >


        <button
            class="btn secondary"
            id="removeDesign"
            type="button"
        >
            Remove Design
        </button>


        <button
            class="btn secondary"
            id="resetView"
            type="button"
        >
            Reset View
        </button>


    </div>


    <div
        class="status"
        id="status"
    >
        Starting 3D viewer...
    </div>


    <div class="note">
        Prototype processing happens inside your browser.
    </div>

</section>


</div>


<!-- =====================================================
     CROP MODAL
     ===================================================== -->

<div
    class="modal"
    id="cropModal"
>

    <div class="modal-box">


        <div class="modal-title">
            Crop your design
        </div>


        <div class="crop-area">

            <img
                id="cropImage"
                alt="Crop image"
            >

        </div>


        <div class="modal-buttons">


            <button
                class="btn secondary"
                id="cancelCrop"
                type="button"
            >
                Cancel
            </button>


            <button
                class="btn"
                id="applyCrop"
                type="button"
            >
                Apply to T-Shirt
            </button>


        </div>

    </div>

</div>


<script>

/* =====================================================
   CONFIG
   ===================================================== */

const MODEL_FILE =
    "./shirt.glb";


/* =====================================================
   VARIABLES
   ===================================================== */

let scene = null;

let camera = null;

let renderer = null;

let controls = null;

let shirt = null;

let originalMaterials = [];

let designTexture = null;

let cropper = null;


/* =====================================================
   ELEMENTS
   ===================================================== */

const canvas =
    document.getElementById("canvas");

const viewer =
    document.getElementById("viewer");

const status =
    document.getElementById("status");

const designInput =
    document.getElementById("designInput");

const cropModal =
    document.getElementById("cropModal");

const cropImage =
    document.getElementById("cropImage");

const viewerMessage =
    document.getElementById(
        "viewerMessage"
    );

const viewerMessageTitle =
    document.getElementById(
        "viewerMessageTitle"
    );

const viewerMessageText =
    document.getElementById(
        "viewerMessageText"
    );


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(
    title,
    message
) {

    viewerMessageTitle.innerText =
        title;

    viewerMessageText.innerText =
        message;

    viewerMessage.classList.remove(
        "hidden"
    );

}


function hideMessage() {

    viewerMessage.classList.add(
        "hidden"
    );

}


/* =====================================================
   START
   ===================================================== */

window.addEventListener(
    "load",
    function() {

        startViewer();

    }
);


/* =====================================================
   START VIEWER
   ===================================================== */

function startViewer() {

    /*
       Check Three.js
    */

    if (
        typeof THREE ===
        "undefined"
    ) {

        status.innerText =
            "Three.js could not load.";

        showMessage(
            "Three.js Failed",
            "The Three.js library could not be loaded. Refresh the page and try again."
        );

        return;

    }


    /*
       Check OrbitControls
    */

    if (
        typeof THREE.OrbitControls ===
        "undefined"
    ) {

        status.innerText =
            "OrbitControls could not load.";

        showMessage(
            "Controls Failed",
            "Three.js loaded, but OrbitControls did not load."
        );

        return;

    }


    /*
       Check GLTFLoader
    */

    if (
        typeof THREE.GLTFLoader ===
        "undefined"
    ) {

        status.innerText =
            "GLTFLoader could not load.";

        showMessage(
            "GLTFLoader Failed",
            "The GLTF loader could not be loaded."
        );

        return;

    }


    try {

        init();

    }
    catch (error) {

        console.error(
            "INIT ERROR:",
            error
        );

        status.innerText =
            "3D viewer initialization failed.";

        showMessage(
            "3D Viewer Error",
            error.message ||
            "Unable to start the 3D viewer."
        );

    }

}


/* =====================================================
   INIT
   ===================================================== */

function init() {


    /* =================================================
       SCENE
       ================================================= */

    scene =
        new THREE.Scene();


    /* =================================================
       CAMERA
       ================================================= */

    camera =
        new THREE.PerspectiveCamera(
            35,
            1,
            0.01,
            1000
        );


    camera.position.set(
        0,
        0.8,
        3.4
    );


    /* =================================================
       RENDERER
       ================================================= */

    renderer =
        new THREE.WebGLRenderer({

            canvas:
                canvas,

            antialias:
                true,

            alpha:
                true

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio ||
                1,
            1.5
        )
    );


    /*
       Compatible with Three.js r149
    */

    if (
        renderer.outputEncoding !==
        undefined
    ) {

        renderer.outputEncoding =
            THREE.sRGBEncoding;

    }


    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
        1.1;


    /* =================================================
       LIGHTS
       ================================================= */

    const hemi =
        new THREE.HemisphereLight(
            0xffffff,
            0x333333,
            2
        );


    scene.add(
        hemi
    );


    const key =
        new THREE.DirectionalLight(
            0xffffff,
            2.5
        );


    key.position.set(
        3,
        5,
        4
    );


    scene.add(
        key
    );


    const fill =
        new THREE.DirectionalLight(
            0xffffff,
            1.2
        );


    fill.position.set(
        -4,
        2,
        2
    );


    scene.add(
        fill
    );


    const rim =
        new THREE.DirectionalLight(
            0xffffff,
            0.8
        );


    rim.position.set(
        0,
        3,
        -4
    );


    scene.add(
        rim
    );


    /* =================================================
       CONTROLS
       ================================================= */

    controls =
        new THREE.OrbitControls(
            camera,
            canvas
        );


    controls.enableDamping =
        true;


    controls.dampingFactor =
        0.08;


    controls.enablePan =
        false;


    controls.minDistance =
        1.5;


    controls.maxDistance =
        6;


    controls.target.set(
        0,
        0,
        0
    );


    controls.update();


    /* =================================================
       LOAD MODEL
       ================================================= */

    loadModel();


    /* =================================================
       RESIZE
       ================================================= */

    resize();


    window.addEventListener(
        "resize",
        resize
    );


    window.addEventListener(
        "orientationchange",
        function() {

            setTimeout(
                resize,
                200
            );

        }
    );


    /* =================================================
       ANIMATION
       ================================================= */

    animate();

}


/* =====================================================
   LOAD MODEL
   ===================================================== */

function loadModel() {

    status.innerText =
        "Loading 3D T-shirt...";


    showMessage(
        "Loading 3D T-shirt...",
        "Please wait while the model loads."
    );


    const loader =
        new THREE.GLTFLoader();


    loader.load(

        MODEL_FILE,


        function(gltf) {

            console.log(
                "GLB LOADED:",
                gltf
            );


            shirt =
                gltf.scene;


            if (!shirt) {

                modelError(
                    "GLB file contains no scene."
                );

                return;

            }


            originalMaterials =
                [];


            let meshCount =
                0;


            /* =========================================
               MODEL MESHES
               ========================================= */

            shirt.traverse(
                function(object) {

                    if (
                        !object.isMesh
                    ) {

                        return;

                    }


                    meshCount++;


                    object.castShadow =
                        true;


                    object.receiveShadow =
                        true;


                    originalMaterials.push({

                        mesh:
                            object,

                        material:
                            object.material

                    });

                }
            );


            if (
                meshCount === 0
            ) {

                modelError(
                    "No mesh was found inside shirt.glb."
                );

                return;

            }


            /* =========================================
               CENTER
               ========================================= */

            const box =
                new THREE.Box3()
                    .setFromObject(
                        shirt
                    );


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            shirt.position.sub(
                center
            );


            /* =========================================
               SCALE
               ========================================= */

            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            if (
                maxSize > 0
            ) {

                const scale =
                    2.2 /
                    maxSize;


                shirt.scale.setScalar(
                    scale
                );

            }


            /* =========================================
               ADD
               ========================================= */

            scene.add(
                shirt
            );


            controls.target.set(
                0,
                0,
                0
            );


            controls.update();


            hideMessage();


            status.innerText =
                "3D T-shirt ready. Upload your design.";


            console.log(
                "T-shirt successfully displayed."
            );

        },


        function(xhr) {

            if (
                xhr &&
                xhr.total
            ) {

                const percent =
                    Math.round(
                        (
                            xhr.loaded /
                            xhr.total
                        ) * 100
                    );


                status.innerText =
                    "Loading 3D T-shirt... " +
                    percent +
                    "%";

            }

        },


        function(error) {

            console.error(
                "GLB LOAD ERROR:",
                error
            );


            modelError(
                "Could not load shirt.glb."
            );

        }

    );

}


/* =====================================================
   MODEL ERROR
   ===================================================== */

function modelError(
    message
) {

    status.innerText =
        "Model loading failed.";


    showMessage(
        "3D Model Failed",
        message +
        " Make sure shirt.glb is beside index.html."
    );

}


/* =====================================================
   RESIZE
   ===================================================== */

function resize() {

    if (
        !renderer ||
        !camera
    ) {

        return;

    }


    const rect =
        viewer.getBoundingClientRect();


    const width =
        Math.max(
            1,
            rect.width
        );


    const height =
        Math.max(
            1,
            rect.height
        );


    renderer.setSize(
        width,
        height,
        false
    );


    camera.aspect =
        width /
        height;


    camera.updateProjectionMatrix();

}


/* =====================================================
   ANIMATION
   ===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (controls) {

        controls.update();

    }


    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(
            scene,
            camera
        );

    }

}


/* =====================================================
   CREATE DESIGN TEXTURE
   ===================================================== */

function createDesignTexture(
    image
) {

    const textureCanvas =
        document.createElement(
            "canvas"
        );


    const ctx =
        textureCanvas.getContext(
            "2d"
        );


    const size =
        2048;


    textureCanvas.width =
        size;


    textureCanvas.height =
        size;


    ctx.clearRect(
        0,
        0,
        size,
        size
    );


    const scale =
        Math.min(
            size /
                image.width,

            size /
                image.height
        );


    const width =
        image.width *
        scale;


    const height =
        image.height *
        scale;


    ctx.drawImage(

        image,

        (size - width) /
            2,

        (size - height) /
            2,

        width,

        height

    );


    const texture =
        new THREE.CanvasTexture(
            textureCanvas
        );


    texture.needsUpdate =
        true;


    if (
        texture.encoding !==
        undefined
    ) {

        texture.encoding =
            THREE.sRGBEncoding;

    }


    texture.anisotropy =
        renderer
            .capabilities
            .getMaxAnisotropy();


    return texture;

}


/* =====================================================
   APPLY DESIGN
   ===================================================== */

function applyDesign(
    image
) {

    if (!shirt) {

        status.innerText =
            "Please wait for the T-shirt to load.";

        return;

    }


    try {

        if (
            designTexture
        ) {

            designTexture.dispose();

        }


        designTexture =
            createDesignTexture(
                image
            );


        shirt.traverse(
            function(object) {

                if (
                    !object.isMesh
                ) {

                    return;

                }


                const material =
                    object.material;


                if (
                    Array.isArray(
                        material
                    )
                ) {

                    object.material =
                        material.map(
                            function(mat) {

                                const cloned =
                                    mat.clone();

                                cloned.map =
                                    designTexture;

                                cloned.needsUpdate =
                                    true;

                                return cloned;

                            }
                        );

                }
                else {

                    const cloned =
                        material.clone();


                    cloned.map =
                        designTexture;


                    cloned.needsUpdate =
                        true;


                    object.material =
                        cloned;

                }

            }
        );


        status.innerText =
            "Design applied. Drag to rotate.";

    }
    catch (error) {

        console.error(
            "DESIGN ERROR:",
            error
        );


        status.innerText =
            "Could not apply design.";

    }

}


/* =====================================================
   UPLOAD
   ===================================================== */

designInput.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files &&
            event.target.files[0];


        if (!file) {

            return;

        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            status.innerText =
                "Please select an image.";

            return;

        }


        const url =
            URL.createObjectURL(
                file
            );


        cropImage.onload =
            function() {

                URL.revokeObjectURL(
                    url
                );


                if (
                    cropper
                ) {

                    cropper.destroy();

                }


                cropper =
                    new Cropper(
                        cropImage,
                        {

                            viewMode:
                                1,

                            autoCropArea:
                                0.8,

                            background:
                                false,

                            responsive:
                                true,

                            zoomable:
                                true,

                            movable:
                                true,

                            rotatable:
                                false,

                            scalable:
                                false

                        }
                    );


                cropModal.classList.add(
                    "show"
                );

            };


        cropImage.src =
            url;

    }
);


/* =====================================================
   CANCEL CROP
   ===================================================== */

document
    .getElementById(
        "cancelCrop"
    )
    .addEventListener(
        "click",
        function() {

            cropModal.classList.remove(
                "show"
            );


            if (
                cropper
            ) {

                cropper.destroy();

                cropper =
                    null;

            }


            designInput.value =
                "";

        }
    );


/* =====================================================
   APPLY CROP
   ===================================================== */

document
    .getElementById(
        "applyCrop"
    )
    .addEventListener(
        "click",
        function() {

            if (
                !cropper
            ) {

                return;

            }


            try {

                const cropped =
                    cropper.getCroppedCanvas({

                        maxWidth:
                            2048,

                        maxHeight:
                            2048,

                        imageSmoothingEnabled:
                            true,

                        imageSmoothingQuality:
                            "high"

                    });


                if (!cropped) {

                    throw new Error(
                        "Crop failed."
                    );

                }


                const image =
                    new Image();


                image.onload =
                    function() {

                        applyDesign(
                            image
                        );

                    };


                image.src =
                    cropped.toDataURL(
                        "image/png"
                    );


                cropModal.classList.remove(
                    "show"
                );


                cropper.destroy();

                cropper =
                    null;

            }
            catch (error) {

                console.error(
                    "CROP ERROR:",
                    error
                );

                status.innerText =
                    "Could not crop image.";

            }

        }
    );


/* =====================================================
   REMOVE DESIGN
   ===================================================== */

document
    .getElementById(
        "removeDesign"
    )
    .addEventListener(
        "click",
        function() {

            if (!shirt) {

                return;

            }


            originalMaterials.forEach(
                function(item) {

                    item.mesh.material =
                        item.material;

                }
            );


            if (
                designTexture
            ) {

                designTexture.dispose();

                designTexture =
                    null;

            }


            status.innerText =
                "Design removed.";

        }
    );


/* =====================================================
   RESET VIEW
   ===================================================== */

document
    .getElementById(
        "resetView"
    )
    .addEventListener(
        "click",
        function() {

            if (
                !camera ||
                !controls
            ) {

                return;

            }


            camera.position.set(
                0,
                0.8,
                3.4
            );


            controls.target.set(
                0,
                0,
                0
            );


            controls.update();

        }
    );


</script>

</body>
</html>
