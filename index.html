<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Printmotive 3D T-Shirt Designer</title>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,Helvetica,sans-serif;
}

#app{
    width:100%;
    height:100%;
    position:relative;
}

#viewer{
    position:absolute;
    inset:0;
}

canvas{
    display:block;
}

#ui{
    position:absolute;
    left:12px;
    right:12px;
    bottom:12px;
    z-index:20;

    padding:14px;

    border-radius:18px;

    background:rgba(20,20,20,.88);

    backdrop-filter:blur(12px);

    box-shadow:
        0 10px 35px rgba(0,0,0,.35);
}

#upload{
    display:none;
}

.uploadBtn{
    width:100%;
    height:48px;

    border:0;
    border-radius:13px;

    background:#fff;
    color:#111;

    font-size:15px;
    font-weight:700;

    cursor:pointer;
}

#removeBtn{
    width:100%;
    height:42px;

    margin-top:9px;

    border:1px solid rgba(255,255,255,.15);
    border-radius:12px;

    background:#252525;
    color:#fff;

    font-size:14px;

    cursor:pointer;

    display:none;
}

.controlRow{
    margin-top:11px;
}

.controlLabel{
    color:#fff;
    font-size:13px;
    margin-bottom:5px;
}

input[type="range"]{
    width:100%;
}

#status{
    margin-top:9px;

    color:#ddd;

    text-align:center;

    font-size:12px;

    min-height:17px;
}

#loading{
    position:absolute;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:50;

    background:#111;

    color:#fff;

    font-size:15px;
}

#cropModal{
    position:absolute;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    padding:15px;

    background:rgba(0,0,0,.88);
}

.cropBox{
    width:min(95vw,500px);

    background:#181818;

    border-radius:18px;

    padding:15px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.5);
}

.cropTitle{
    color:#fff;

    font-size:16px;
    font-weight:700;

    margin-bottom:12px;

    text-align:center;
}

#cropCanvas{
    display:block;

    width:100%;

    aspect-ratio:3/4;

    background:#222;

    border-radius:12px;

    object-fit:contain;
}

.cropButtons{
    display:flex;

    gap:10px;

    margin-top:12px;
}

.cropButtons button{
    flex:1;

    height:45px;

    border:0;

    border-radius:12px;

    font-weight:700;

    cursor:pointer;
}

#applyCrop{
    background:#fff;
    color:#111;
}

#cancelCrop{
    background:#292929;
    color:#fff;
}

</style>
</head>

<body>

<div id="app">

    <div id="viewer"></div>

    <div id="loading">
        Loading 3D T-Shirt...
    </div>

    <div id="ui">

        <label for="upload" class="uploadBtn"
               style="display:flex;align-items:center;justify-content:center;">
            Upload Your Design
        </label>

        <input
            id="upload"
            type="file"
            accept="image/png,image/jpeg,image/webp"
        >

        <button id="removeBtn">
            Remove Design
        </button>

        <div class="controlRow">

            <div class="controlLabel">
                Print Brightness
            </div>

            <input
                id="brightness"
                type="range"
                min="0.5"
                max="2"
                step="0.05"
                value="1"
            >

        </div>

        <div id="status">
            Drag to rotate • Pinch to zoom
        </div>

    </div>

    <!-- CROP MODAL -->

    <div id="cropModal">

        <div class="cropBox">

            <div class="cropTitle">
                Adjust Your Design
            </div>

            <canvas id="cropCanvas"
                    width="600"
                    height="800">
            </canvas>

            <div class="cropButtons">

                <button id="cancelCrop">
                    Cancel
                </button>

                <button id="applyCrop">
                    Apply Design
                </button>

            </div>

        </div>

    </div>

</div>


<script>

"use strict";


/* =========================================================
   CONFIG
========================================================= */

const MODEL_FILE = "shirt.glb";

/*
   Fixed print ratio.

   3:4 means:

   width  = 3
   height = 4
*/
const PRINT_RATIO = 3 / 4;


/*
   Print area size.

   Change ONLY PRINT_WIDTH if you want
   print bigger/smaller.
*/
const PRINT_WIDTH = 0.82;

const PRINT_HEIGHT =
    PRINT_WIDTH / PRINT_RATIO;


/*
   Shirt vertical position.
*/
const MODEL_Y_OFFSET = 0.25;


/*
   Camera.
*/
const CAMERA_Z = 5.2;

const CAMERA_Y = 0.65;

const TARGET_Y = 0.55;


/*
   Print position on shirt.

   0.50 = middle
   0.55 = slightly lower
   0.60 = chest/lower chest

   Start with 0.59.
*/
const PRINT_Y_RATIO = 0.59;


/*
   Small distance between shirt
   and print layer.
*/
const PRINT_OFFSET = 0.012;


/* =========================================================
   GLOBALS
========================================================= */

let scene;

let camera;

let renderer;

let controls;

let shirt;

let shirtMeshes = [];

let printLayer = null;

let designCanvas = null;

let designTexture = null;

let pendingImage = null;


/* =========================================================
   DOM
========================================================= */

const viewer =
    document.getElementById("viewer");

const loading =
    document.getElementById("loading");

const upload =
    document.getElementById("upload");

const removeBtn =
    document.getElementById("removeBtn");

const brightness =
    document.getElementById("brightness");

const status =
    document.getElementById("status");

const cropModal =
    document.getElementById("cropModal");

const cropCanvas =
    document.getElementById("cropCanvas");

const applyCrop =
    document.getElementById("applyCrop");

const cancelCrop =
    document.getElementById("cancelCrop");


/* =========================================================
   INIT
========================================================= */

init();


function init(){

    /* -----------------------------------------------------
       SCENE
    ----------------------------------------------------- */

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x111111);


    /* -----------------------------------------------------
       CAMERA
    ----------------------------------------------------- */

    camera =
        new THREE.PerspectiveCamera(
            35,
            window.innerWidth /
            window.innerHeight,
            0.01,
            100
        );

    camera.position.set(
        0,
        CAMERA_Y,
        CAMERA_Z
    );


    /* -----------------------------------------------------
       RENDERER
    ----------------------------------------------------- */

    renderer =
        new THREE.WebGLRenderer({
            antialias:true,
            alpha:false,
            powerPreference:"high-performance"
        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            1.35
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputEncoding =
        THREE.sRGBEncoding;

    renderer.physicallyCorrectLights =
        false;

    viewer.appendChild(
        renderer.domElement
    );


    /* -----------------------------------------------------
       LIGHTS
    ----------------------------------------------------- */

    const hemi =
        new THREE.HemisphereLight(
            0xffffff,
            0x555555,
            1.25
        );

    hemi.name =
        "Main Hemisphere Light";

    scene.add(hemi);


    const keyLight =
        new THREE.DirectionalLight(
            0xffffff,
            1.25
        );

    keyLight.position.set(
        2,
        4,
        5
    );

    scene.add(keyLight);


    const fillLight =
        new THREE.DirectionalLight(
            0xffffff,
            0.7
        );

    fillLight.position.set(
        -3,
        2,
        4
    );

    scene.add(fillLight);


    /* -----------------------------------------------------
       CONTROLS
    ----------------------------------------------------- */

    controls =
        new THREE.OrbitControls(
            camera,
            renderer.domElement
        );

    controls.enableDamping = true;

    controls.dampingFactor = 0.08;

    controls.enablePan = false;

    controls.minDistance = 3;

    controls.maxDistance = 8;

    controls.target.set(
        0,
        TARGET_Y,
        0
    );


    /* -----------------------------------------------------
       LOAD MODEL
    ----------------------------------------------------- */

    const loader =
        new THREE.GLTFLoader();


    loader.load(

        MODEL_FILE,

        function(gltf){

            shirt =
                gltf.scene;


            /*
               Collect meshes.
            */

            shirtMeshes = [];


            shirt.traverse(
                function(object){

                    if(
                        object.isMesh
                    ){

                        shirtMeshes.push(
                            object
                        );


                        /*
                           Keep original materials.
                           DO NOT replace them.
                        */

                        if(
                            object.material
                        ){

                            object.material =
                                object.material.clone();

                        }


                        object.castShadow =
                            false;

                        object.receiveShadow =
                            true;
                    }

                }
            );


            /*
               Normalize model size.
            */

            const box =
                new THREE.Box3()
                    .setFromObject(
                        shirt
                    );


            const size =
                new THREE.Vector3();

            box.getSize(size);


            const maxSize =
                Math.max(
                    size.x,
                    size.y,
                    size.z
                );


            const scale =
                2.25 / maxSize;


            shirt.scale.setScalar(
                scale
            );


            /*
               Move shirt upward.
            */

            shirt.position.y +=
                MODEL_Y_OFFSET;


            scene.add(
                shirt
            );


            /*
               Reset camera.
            */

            camera.position.set(
                0,
                CAMERA_Y,
                CAMERA_Z
            );


            controls.target.set(
                0,
                TARGET_Y,
                0
            );


            controls.update();


            loading.style.display =
                "none";


            status.textContent =
                "3D T-Shirt Ready • Upload your design";


            /*
               Render first frame.
            */

            renderer.render(
                scene,
                camera
            );

        },

        function(xhr){

            if(
                xhr.lengthComputable
            ){

                const percent =
                    Math.round(
                        (
                            xhr.loaded /
                            xhr.total
                        ) * 100
                    );

                loading.textContent =
                    "Loading 3D T-Shirt " +
                    percent +
                    "%";

            }

        },

        function(error){

            console.error(
                "GLB ERROR:",
                error
            );

            loading.textContent =
                "Unable to load shirt.glb";

        }

    );


    /* -----------------------------------------------------
       EVENTS
    ----------------------------------------------------- */

    upload.addEventListener(
        "change",
        handleUpload
    );


    applyCrop.addEventListener(
        "click",
        applyDesign
    );


    cancelCrop.addEventListener(
        "click",
        function(){

            cropModal.style.display =
                "none";

            pendingImage =
                null;

            upload.value =
                "";

        }
    );


    removeBtn.addEventListener(
        "click",
        removeDesign
    );


    brightness.addEventListener(
        "input",
        updateBrightness
    );


    window.addEventListener(
        "resize",
        onResize
    );


    animate();

}


/* =========================================================
   UPLOAD
========================================================= */

function handleUpload(event){

    const file =
        event.target.files &&
        event.target.files[0];


    if(!file){

        return;
    }


    if(
        !file.type.startsWith("image/")
    ){

        status.textContent =
            "Please select an image.";

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            const image =
                new Image();


            image.onload =
                function(){

                    pendingImage =
                        image;


                    openCropper(
                        image
                    );

                };


            image.onerror =
                function(){

                    status.textContent =
                        "Could not read image.";

                };


            image.src =
                e.target.result;

        };


    reader.readAsDataURL(
        file
    );

}


/* =========================================================
   CROP
========================================================= */

function openCropper(image){

    cropModal.style.display =
        "flex";


    const ctx =
        cropCanvas.getContext(
            "2d"
        );


    const canvasWidth =
        600;

    const canvasHeight =
        800;


    cropCanvas.width =
        canvasWidth;

    cropCanvas.height =
        canvasHeight;


    /*
       Cover image inside 3:4 box.
    */

    const scale =
        Math.max(
            canvasWidth /
                image.width,

            canvasHeight /
                image.height
        );


    const drawWidth =
        image.width *
        scale;


    const drawHeight =
        image.height *
        scale;


    const x =
        (
            canvasWidth -
            drawWidth
        ) / 2;


    const y =
        (
            canvasHeight -
            drawHeight
        ) / 2;


    /*
       Clear.
    */

    ctx.clearRect(
        0,
        0,
        canvasWidth,
        canvasHeight
    );


    /*
       Draw design.
    */

    ctx.drawImage(
        image,
        x,
        y,
        drawWidth,
        drawHeight
    );

}


/* =========================================================
   APPLY DESIGN
========================================================= */

function applyDesign(){

    if(!shirt){

        status.textContent =
            "3D model is still loading.";

        return;
    }


    if(!pendingImage){

        return;
    }


    /*
       Hide crop popup.
    */

    cropModal.style.display =
        "none";


    /*
       Remove old print.
    */

    removePrintLayer();


    /*
       Create final print canvas.
    */

    designCanvas =
        document.createElement(
            "canvas"
        );


    designCanvas.width =
        900;

    designCanvas.height =
        1200;


    const ctx =
        designCanvas.getContext(
            "2d"
        );


    /*
       Transparent background.

       IMPORTANT:
       We do NOT draw a white rectangle.
       Only uploaded design appears.
    */

    ctx.clearRect(
        0,
        0,
        designCanvas.width,
        designCanvas.height
    );


    /*
       Draw cropped image.
    */

    ctx.drawImage(
        cropCanvas,
        0,
        0,
        designCanvas.width,
        designCanvas.height
    );


    /*
       Create texture.
    */

    designTexture =
        new THREE.CanvasTexture(
            designCanvas
        );


    /*
       Important for correct colors.
    */

    designTexture.encoding =
        THREE.sRGBEncoding;


    designTexture.minFilter =
        THREE.LinearFilter;


    designTexture.magFilter =
        THREE.LinearFilter;


    designTexture.generateMipmaps =
        false;


    designTexture.needsUpdate =
        true;


    /*
       Create visible print layer.
    */

    createPrintLayer();


    removeBtn.style.display =
        "block";


    status.textContent =
        "Design applied successfully";


    pendingImage =
        null;

}


/* =========================================================
   CREATE PRINT LAYER
========================================================= */

function createPrintLayer(){

    if(!shirt){

        return;
    }


    /*
       Calculate shirt bounds
       AFTER normalization.
    */

    const bounds =
        new THREE.Box3()
            .setFromObject(
                shirt
            );


    const shirtSize =
        new THREE.Vector3();

    bounds.getSize(
        shirtSize
    );


    /*
       Find front chest point.

       The model front is +Z.
    */

    const chestY =
        bounds.min.y +
        (
            shirtSize.y *
            PRINT_Y_RATIO
        );


    /*
       Raycast from front toward shirt.

       This finds the actual shirt
       surface instead of guessing Z.
    */

    const rayStart =
        new THREE.Vector3(
            0,
            chestY,
            bounds.max.z + 2
        );


    const rayDirection =
        new THREE.Vector3(
            0,
            0,
            -1
        );


    const raycaster =
        new THREE.Raycaster();


    raycaster.set(
        rayStart,
        rayDirection
    );


    const hits =
        raycaster.intersectObjects(
            shirtMeshes,
            true
        );


    let hit = null;


    /*
       First valid front hit.
    */

    for(
        let i = 0;
        i < hits.length;
        i++
    ){

        if(
            hits[i] &&
            hits[i].object &&
            hits[i].point
        ){

            hit =
                hits[i];

            break;

        }

    }


    /*
       If ray misses because the
       shirt has unusual geometry,
       use front center fallback.
    */

    let printPosition;


    let printNormal =
        new THREE.Vector3(
            0,
            0,
            1
        );


    if(hit){

        printPosition =
            hit.point.clone();


        /*
           Surface normal.
        */

        if(
            hit.face &&
            hit.object
        ){

            const normalMatrix =
                new THREE.Matrix3()
                    .getNormalMatrix(
                        hit.object.matrixWorld
                    );


            printNormal =
                hit.face.normal
                    .clone()
                    .applyMatrix3(
                        normalMatrix
                    )
                    .normalize();

        }

    }else{

        /*
           Fallback position.
        */

        printPosition =
            new THREE.Vector3(
                0,
                chestY,
                bounds.max.z
            );

    }


    /*
       Push print slightly
       outside shirt surface.

       This prevents z-fighting.
    */

    printPosition.add(
        printNormal
            .clone()
            .multiplyScalar(
                PRINT_OFFSET
            )
    );


    /*
       Create print plane.
    */

    const geometry =
        new THREE.PlaneGeometry(
            PRINT_WIDTH,
            PRINT_HEIGHT,
            1,
            1
        );


    const material =
        new THREE.MeshBasicMaterial({

            map:
                designTexture,

            transparent:
                true,

            opacity:
                1,

            side:
                THREE.DoubleSide,

            depthTest:
                true,

            depthWrite:
                false,

            toneMapped:
                false

        });


    /*
       IMPORTANT:
       Plane must be visible over
       original shirt.
    */

    material.polygonOffset =
        true;

    material.polygonOffsetFactor =
        -1;

    material.polygonOffsetUnits =
        -1;


    printLayer =
        new THREE.Mesh(
            geometry,
            material
        );


    printLayer.name =
        "PRINT_DESIGN_LAYER";


    /*
       Position.
    */

    printLayer.position.copy(
        printPosition
    );


    /*
       Rotate plane so its front
       faces the shirt surface.

       Default PlaneGeometry normal
       is +Z.
    */

    const defaultNormal =
        new THREE.Vector3(
            0,
            0,
            1
        );


    const quaternion =
        new THREE.Quaternion();


    quaternion.setFromUnitVectors(
        defaultNormal,
        printNormal
    );


    printLayer.quaternion.copy(
        quaternion
    );


    /*
       Keep design above shirt.
    */

    printLayer.renderOrder =
        999;


    /*
       Add to scene, NOT inside
       shirt mesh.

       This makes it much more
       reliable.
    */

    scene.add(
        printLayer
    );


    /*
       Force texture update.
    */

    designTexture.needsUpdate =
        true;


    /*
       DEBUG RENDER.
    */

    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   REMOVE DESIGN
========================================================= */

function removeDesign(){

    removePrintLayer();


    removeBtn.style.display =
        "none";


    status.textContent =
        "Design removed";


    upload.value =
        "";

}


/* =========================================================
   REMOVE PRINT OBJECT
========================================================= */

function removePrintLayer(){

    if(!printLayer){

        return;
    }


    scene.remove(
        printLayer
    );


    if(
        printLayer.geometry
    ){

        printLayer.geometry.dispose();

    }


    if(
        printLayer.material
    ){

        printLayer.material.dispose();

    }


    printLayer =
        null;


    if(designTexture){

        designTexture.dispose();

        designTexture =
            null;

    }

}


/* =========================================================
   BRIGHTNESS
========================================================= */

function updateBrightness(){

    const value =
        parseFloat(
            brightness.value
        );


    const lights =
        scene.children;


    for(
        let i = 0;
        i < lights.length;
        i++
    ){

        const object =
            lights[i];


        if(
            object.isLight
        ){

            /*
               Preserve relative
               lighting.
            */

            if(
                object.name ===
                "Main Hemisphere Light"
            ){

                object.intensity =
                    1.25 * value;

            }

            else
            if(
                object.isDirectionalLight
            ){

                /*
                   Base directional
                   intensity.
                */

                if(
                    object ===
                    lights[1]
                ){

                    object.intensity =
                        1.25 * value;

                }else{

                    object.intensity =
                        0.7 * value;

                }

            }

        }

    }

}


/* =========================================================
   RESIZE
========================================================= */

function onResize(){

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(controls){

        controls.update();

    }


    renderer.render(
        scene,
        camera
    );

}

</script>

</body>
</html>
