initial-scale=1.0,

user-scalable=no">

rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">

<style>

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#080808;

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =====================================================
   APP
===================================================== */

#app{

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;

}


/* =====================================================
   HEADER
===================================================== */

#header{

    height:62px;

    flex-shrink:0;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#090909;

    border-bottom:
        1px solid #252525;

}


#header h1{

    margin:0;

    font-size:20px;

    font-weight:800;

    letter-spacing:.2px;

}


/* =====================================================
   3D VIEWER
===================================================== */

#viewer{

    position:relative;

    flex:1;

    min-height:0;

    background:#080808;

}


#viewer canvas{

    width:100% !important;
    height:100% !important;

    display:block;

}


/* =====================================================
   CONTROL AREA
===================================================== */

#controls{

    flex-shrink:0;

    background:#080808;

    padding:

        16px
        18px
        calc(16px + env(safe-area-inset-bottom));

    border-top:
        1px solid #202020;

}


/* =====================================================
   BUTTON ROW
===================================================== */

.buttonRow{

    display:flex;

    gap:18px;

    align-items:center;

}


.button{

    height:50px;

    border-radius:14px;

    border:
        1px solid #333;

    background:#202020;

    color:#fff;

    font-size:15px;

    font-weight:700;

    padding:
        0 20px;

    cursor:pointer;

    white-space:nowrap;

}


.button.primary{

    background:#fff;

    color:#111;

    border-color:#fff;

}


.button:active{

    transform:scale(.97);

}


#upload{

    display:none;

}


/* =====================================================
   BRIGHTNESS
===================================================== */

.brightnessBox{

    margin-top:18px;

    height:58px;

    border:
        1px solid #303030;

    border-radius:17px;

    background:#181818;

    display:flex;

    align-items:center;

    padding:
        0 18px;

    gap:16px;

}


.brightnessText{

    color:#d9d9d9;

    font-size:15px;

    min-width:82px;

}


#brightness{

    flex:1;

    min-width:0;

    accent-color:#fff;

}


/* =====================================================
   STATUS
===================================================== */

#status{

    display:none;

}


/* =====================================================
   LOADING
===================================================== */

#loading{

    position:absolute;

    inset:0;

    z-index:50;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#080808;

    color:#fff;

    font-size:15px;

}


/* =====================================================
   CROP MODAL
===================================================== */

#cropModal{

    position:fixed;

    inset:0;

    z-index:1000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:15px;

    background:
        rgba(0,0,0,.94);

}


.cropBox{

    width:min(
        94vw,
        500px
    );

    background:#171717;

    border:
        1px solid #333;

    border-radius:18px;

    padding:15px;

    overflow:hidden;

}


.cropTitle{

    text-align:center;

    color:#fff;

    font-size:17px;

    font-weight:800;

    margin-bottom:12px;

}


.cropArea{

    width:100%;

    height:min(
        65vh,
        600px

    background:#222;

    border-radius:12px;

    overflow:hidden;

}


#cropImage{

    display:block;

    max-width:100%;

}


.cropInfo{

    margin-top:9px;

    text-align:center;

    color:#999;

    font-size:11px;

}


.cropButtons{

    display:flex;

    gap:10px;

    margin-top:12px;

}


.cropButtons button{

    flex:1;

    height:46px;

    border:0;

    border-radius:12px;

    font-size:14px;

    font-weight:700;

}


#cancelCrop{

    background:#292929;

    color:#fff;

}


#applyCrop{

    background:#fff;

    color:#111;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    #header{

        height:62px;

    }

    #header h1{

        font-size:19px;

    }


    .buttonRow{

        gap:18px;

    }


    .button{

        flex:1;

        padding:0 8px;

        font-size:15px;

    }


    .brightnessBox{

        margin-top:18px;

        height:58px;

    }

<body>


<div id="app">


    <!-- =================================================
         HEADER
    ================================================= -->

    <header id="header">

        <h1>
            Printmotive 3D T-Shirt Designer
        </h1>

    </header>


    <!-- =================================================
         VIEWER
    ================================================= -->

    <main id="viewer">

        <div id="loading">
            Loading 3D T-Shirt...
        </div>

    </main>


    <!-- =================================================
         CONTROLS
    ================================================= -->

    <section id="controls">


        <div class="buttonRow">


            <label
                class="button primary"
                for="upload">

                Upload Design

            </label>


            <input
                id="upload"
                type="file"
                accept="image/png,image/jpeg,image/webp">


            <button
                class="button"
                id="removeBtn">

                Remove

            </button>


            <button
                class="button"
                id="resetBtn">

                Reset View

            </button>


        </div>


        <div class="brightnessBox">

            <div class="brightnessText">
                Brightness
            </div>

            <input
                id="brightness"
                type="range"
                min="0.5"
                max="2"
                step="0.05"
                value="1">

        </div>


    </section>


</div>


<!-- =====================================================
     CROP MODAL
===================================================== -->

<div id="cropModal">


    <div class="cropBox">


        <div class="cropTitle">
            Adjust Your Design
        </div>


        <div class="cropArea">

            <img
                id="cropImage"
                alt="Design">

        </div>


        <div class="cropInfo">

            Fixed 3:4 print area • Move or zoom your design

        </div>


        <div class="cropButtons">


            <button
                id="cancelCrop">

                Cancel

            </button>


            <button
                id="applyCrop">

                Apply Design

            </button>


        </div>


    </div>

</div>


<script>

"use strict";


/* =====================================================
   CONFIG
===================================================== */

const MODEL_FILE =
    "shirt.glb";


/*
    PRINT RATIO
*/

const PRINT_RATIO =
    3 / 4;


/*
    PRINT SIZE
*/

const PRINT_WIDTH =
    0.78;


const PRINT_HEIGHT =
    PRINT_WIDTH /
    PRINT_RATIO;


/*
    DECAL DEPTH
*/

const PRINT_DEPTH =
    0.24;


/*
    PRINT VERTICAL POSITION
*/

const PRINT_Y_RATIO =
    0.59;


/*
    ★ IMPORTANT ★

    PRINT X POSITION

    Positive X = RIGHT

    Current shirt print was too far left,
    so we shift it right.

    If you later want tiny adjustment:

    0.08 = slightly right
    0.12 = current setting
    0.15 = more right
*/

const PRINT_X_OFFSET =
    0.12;


/*
    Surface offset
*/

const PRINT_OFFSET =
    0.004;


/*
    Shirt position
*/

const MODEL_Y_OFFSET =
    0.25;


/*
    Camera
*/

const CAMERA_Z =
    5.2;

const CAMERA_Y =
    0.65;

const TARGET_Y =
    0.55;


/* =====================================================
   GLOBALS
===================================================== */

let scene;

let camera;

let renderer;

let controls;

let shirt = null;

let shirtMeshes = [];

let printDecal = null;

let designTexture = null;

let cropper = null;

let pendingImageURL = null;


/* =====================================================
   DOM
===================================================== */

const viewer =
    document.getElementById(
        "viewer"
    );


const loading =
    document.getElementById(
        "loading"
    );


const upload =
    document.getElementById(
        "upload"
    );


const removeBtn =
    document.getElementById(
        "removeBtn"
    );


const resetBtn =
    document.getElementById(
        "resetBtn"
    );


const brightness =
    document.getElementById(
        "brightness"
    );


const cropModal =
    document.getElementById(
        "cropModal"
    );


const cropImage =
    document.getElementById(
        "cropImage"
    );


const cancelCrop =
    document.getElementById(
        "cancelCrop"
    );


const applyCrop =
    document.getElementById(
        "applyCrop"
    );


/* =====================================================
   INIT
===================================================== */

init();


function init(){

    if(
        typeof THREE ===
        "undefined"
    ){

        alert(
            "Three.js could not be loaded."
        );

        return;

    }


    if(
        typeof THREE.OrbitControls ===
        "undefined"
    ){

        alert(
            "OrbitControls could not be loaded."
        );

        return;

    }


    if(
        typeof THREE.GLTFLoader ===
        "undefined"
    ){

        alert(
            "GLTFLoader could not be loaded."
        );

        return;

    }


    if(
        typeof THREE.DecalGeometry ===
        "undefined"
    ){

        alert(
            "DecalGeometry could not be loaded."
        );

        return;

    }


    if(
        typeof Cropper ===
        "undefined"
    ){

        alert(
            "Cropper could not be loaded."
        );

        return;

    }


    /* -------------------------------------------------
       SCENE
    ------------------------------------------------- */

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x080808
        );


    /* -------------------------------------------------
       CAMERA
    ------------------------------------------------- */

    camera =
        new THREE.PerspectiveCamera(

            35,

            1,

            0.01,

            100

        );


    camera.position.set(

        0,

        CAMERA_Y,

        CAMERA_Z

    );


    /* -------------------------------------------------
       RENDERER
    ------------------------------------------------- */

    renderer =
        new THREE.WebGLRenderer({

            antialias:true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio ||
            1,

            1.35

        )

    );


    renderer.outputEncoding =
        THREE.sRGBEncoding;


    renderer.setSize(

        viewer.clientWidth,

        viewer.clientHeight,

        false

    );


    viewer.appendChild(
        renderer.domElement
    );


    /* -------------------------------------------------
       LIGHTS
    ------------------------------------------------- */

    const hemi =
        new THREE.HemisphereLight(

            0xffffff,
            0x555555,
            1.25

        );


    hemi.name =
        "Main Hemisphere Light";


    scene.add(
        hemi
    );


    const key =
        new THREE.DirectionalLight(

            0xffffff,
            1.25

        );


    key.name =
        "Main Key Light";


    key.position.set(

        2,
        4,
        5

    );


    scene.add(
        key
    );


    const fill =
        new THREE.DirectionalLight(

            0xffffff,
            0.7

        );


    fill.name =
        "Main Fill Light";


    fill.position.set(

        -3,
        2,
        4

    );


    scene.add(
        fill
    );


    /* -------------------------------------------------
       CONTROLS
    ------------------------------------------------- */

    controls =
        new THREE.OrbitControls(

            camera,

            renderer.domElement

        );


    controls.enableDamping =
        true;


    controls.dampingFactor =
        0.08;


    controls.enablePan =
        false;


    controls.minDistance =
        3;


    controls.maxDistance =
        8;


    controls.target.set(

        0,
        TARGET_Y,
        0

    );


    /* -------------------------------------------------
       EVENTS
    ------------------------------------------------- */

    upload.addEventListener(
        "change",
        handleUpload
    );


    applyCrop.addEventListener(
        "click",
        applyCroppedDesign
    );


    cancelCrop.addEventListener(
        "click",
        cancelCropper
    );


    removeBtn.addEventListener(
        "click",
        removeDesign
    );


    resetBtn.addEventListener(
        "click",
        resetView
    );


    brightness.addEventListener(
        "input",
        updateBrightness
    );


    window.addEventListener(
        "resize",
        resize
    );


    /* -------------------------------------------------
       LOAD
    ------------------------------------------------- */

    loadModel();


    animate();

}


/* =====================================================
   LOAD MODEL
===================================================== */

function loadModel(){

    const loader =
        new THREE.GLTFLoader();


    loader.load(

        MODEL_FILE,


        function(gltf){

            shirt =
                gltf.scene;


            shirtMeshes =
                [];


            shirt.traverse(

                function(object){

                    if(
                        object.isMesh
                    ){

                        shirtMeshes.push(
                            object
                        );


                        /*
                           Preserve original
                           shirt materials.
                        */

                        if(
                            object.material
                        ){

                            if(
                                Array.isArray(
                                    object.material
                                )
                            ){

                                object.material =
                                    object.material.map(

                                        function(mat){

                                            return mat.clone();

                                        }

                                    );

                            }
                            else{

                                object.material =
                                    object.material.clone();

                            }

                        }

                    }

                }

            );


            /* ---------------------------------------------
               NORMALIZE
            --------------------------------------------- */

            const box =
                new THREE.Box3()
                    .setFromObject(
                        shirt
                    );


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            const maxSize =
                Math.max(

                    size.x,
                    size.y,
                    size.z

                );


            const scale =
                2.25 /
                maxSize;


            shirt.scale.setScalar(
                scale
            );


            /*
               Move shirt up.
            */

            shirt.position.y +=
                MODEL_Y_OFFSET;


            scene.add(
                shirt
            );


            /*
               Update world matrix.
            */

            shirt.updateMatrixWorld(
                true
            );


            /* ---------------------------------------------
               CAMERA
            --------------------------------------------- */

            camera.position.set(

                0,
                CAMERA_Y,
                CAMERA_Z

            );


            controls.target.set(

                0,
                TARGET_Y,
                0

            );


            controls.update();


            loading.style.display =
                "none";

        },


        function(xhr){

            if(
                xhr &&
                xhr.lengthComputable
            ){

                const percent =
                    Math.round(

                        xhr.loaded /
                        xhr.total *
                        100

                    );


                loading.textContent =
                    "Loading 3D T-Shirt " +
                    percent +
                    "%";

            }

        },


        function(error){

            console.error(
                error
            );


            loading.textContent =
                "Unable to load shirt.glb";

        }

    );

}


/* =====================================================
   UPLOAD
===================================================== */

function handleUpload(event){

    const file =
        event.target.files &&
        event.target.files[0];


    if(!file){

        return;

    }


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        return;

    }


    if(
        pendingImageURL
    ){

        URL.revokeObjectURL(
            pendingImageURL
        );

    }


    pendingImageURL =
        URL.createObjectURL(
            file
        );


    cropImage.onload =
        function(){

            openCropper();

        };


    cropImage.src =
        pendingImageURL;

}


/* =====================================================
   CROP
===================================================== */

function openCropper(){

    cropModal.style.display =
        "flex";


    if(cropper){

        cropper.destroy();

    }


    requestAnimationFrame(

        function(){

            cropper =
                new Cropper(

                    cropImage,

                    {

                        aspectRatio:
                            PRINT_RATIO,

                        viewMode:
                            1,

                        dragMode:
                            "move",

                        autoCropArea:
                            0.88,

                        responsive:
                            true,

                        guides:
                            true,

                        center:
                            true,

                        highlight:
                            true,

                        cropBoxMovable:
                            true,

                        cropBoxResizable:
                            true,

                        zoomable:
                            true,

                        zoomOnWheel:
                            true,

                        movable:
                            true,

                        rotatable:
                            false,

                        scalable:
                            false

                    }

                );

        }

    );

}


/* =====================================================
   CANCEL CROP
===================================================== */

function cancelCropper(){

    if(cropper){

        cropper.destroy();

        cropper =
            null;

    }


    cropModal.style.display =
        "none";


    if(
        pendingImageURL
    ){

        URL.revokeObjectURL(
            pendingImageURL
        );

        pendingImageURL =
            null;

    }


    upload.value =
        "";

}


/* =====================================================
   APPLY CROP
===================================================== */

function applyCroppedDesign(){

    if(
        !cropper ||
        !shirt
    ){

        return;

    }


    const croppedCanvas =
        cropper.getCroppedCanvas({

            width:900,

            height:1200,

            imageSmoothingEnabled:
                true,

            imageSmoothingQuality:
                "high",

            fillColor:
                "transparent"

        });


    if(!croppedCanvas){

        return;

    }


    cropper.destroy();

    cropper =
        null;


    cropModal.style.display =
        "none";


    /*
       Dispose previous texture.
    */

    if(
        designTexture
    ){

        designTexture.dispose();

    }


    designTexture =
        new THREE.CanvasTexture(
            croppedCanvas
        );


    designTexture.encoding =
        THREE.sRGBEncoding;


    designTexture.minFilter =
        THREE.LinearFilter;


    designTexture.magFilter =
        THREE.LinearFilter;


    designTexture.generateMipmaps =
        false;


    designTexture.needsUpdate =
        true;


    /*
       Create curved print.
    */

    createCurvedPrint();


    if(
        pendingImageURL
    ){

        URL.revokeObjectURL(
            pendingImageURL
        );

        pendingImageURL =
            null;

    }


    upload.value =
        "";

}


/* =====================================================
   FIND SHIRT FRONT
===================================================== */

function findFrontSurface(){

    if(
        !shirt ||
        shirtMeshes.length === 0
    ){

        return null;

    }


    shirt.updateMatrixWorld(
        true
    );


    const bounds =
        new THREE.Box3()
            .setFromObject(
                shirt
            );


    const size =
        bounds.getSize(
            new THREE.Vector3()
        );


    const chestY =
        bounds.min.y +
        size.y *
        PRINT_Y_RATIO;


    /*
       Start X around center.

       IMPORTANT:
       We are not using the hit's
       X position as final print center.
    */

    const xTests = [

        0,

        -size.x * .08,

        size.x * .08

    ];


    const raycaster =
        new THREE.Raycaster();


    for(
        let i=0;
        i<xTests.length;
        i++
    ){

        const origin =
            new THREE.Vector3(

                xTests[i],

                chestY,

                bounds.max.z + 2

            );


        raycaster.set(

            origin,

            new THREE.Vector3(
                0,
                0,
                -1
            )

        );


        const hits =
            raycaster.intersectObjects(

                shirtMeshes,

                true

            );


        for(
            let j=0;
            j<hits.length;
            j++
        ){

            const hit =
                hits[j];


            if(
                !hit.object ||
                !hit.face
            ){

                continue;

            }


            const normalMatrix =
                new THREE.Matrix3()
                    .getNormalMatrix(

                        hit.object.matrixWorld

                    );


            const normal =
                hit.face.normal
                    .clone()
                    .applyMatrix3(
                        normalMatrix
                    )
                    .normalize();


            if(
                normal.z <= 0
            ){

                continue;

            }


            return {

                hit:hit,

                normal:normal,

                bounds:bounds,

                size:size,

                chestY:chestY

            };

        }

    }


    return null;

}


/* =====================================================
   CREATE CURVED PRINT
===================================================== */

function createCurvedPrint(){

    if(
        !shirt ||
        !designTexture
    ){

        return;

    }


    /*
       Remove previous.
    */

    removePrintOnly();


    const surface =
        findFrontSurface();


    if(!surface){

        return;

    }


    const hit =
        surface.hit;


    const normal =
        surface.normal;


    const bounds =
        surface.bounds;


    const shirtSize =
        surface.size;


    /*
       Start from real shirt surface.
    */

    const position =
        hit.point.clone();


    /*
       ★ CENTER FIX ★

       The previous version used hit.point.x
       directly.

       That made the print inherit the
       left-side ray hit.

       Now we explicitly move the complete
       print toward the shirt center/right.

       Positive X = right.
    */

    position.x +=
        PRINT_X_OFFSET;


    /*
       Move slightly outside fabric.
    */

    position.add(

        normal.clone()
            .multiplyScalar(
                PRINT_OFFSET
            )

    );


    /* =================================================
       ORIENTATION
    ================================================= */

    const forward =
        new THREE.Vector3(

            0,
            0,
            1

        );


    const quaternion =
        new THREE.Quaternion();


    quaternion.setFromUnitVectors(

        forward,

        normal

    );


    const orientation =
        new THREE.Euler();


    orientation.setFromQuaternion(

        quaternion,

        "XYZ"

    );


    /* =================================================
       DECAL SIZE
    ================================================= */

    const decalSize =
        new THREE.Vector3(

            PRINT_WIDTH,

            PRINT_HEIGHT,

            PRINT_DEPTH

        );


    /* =================================================
       DECAL GEOMETRY
    ================================================= */

    let geometry;


    try{

        geometry =
            new THREE.DecalGeometry(

                hit.object,

                position,

                orientation,

                decalSize

            );

    }
    catch(error){

        console.error(
            "Decal error:",
            error
        );

        return;

    }


    if(
        !geometry.attributes ||
        !geometry.attributes.position ||
        geometry.attributes.position.count === 0
    ){

        geometry.dispose();

        return;

    }


    /* =================================================
       MATERIAL
    ================================================= */

    const material =
        new THREE.MeshBasicMaterial({

            map:
                designTexture,

            transparent:
                true,

            opacity:
                1,

            side:
                THREE.DoubleSide,

            depthTest:
                true,

            depthWrite:
                false,

            polygonOffset:
                true,

            polygonOffsetFactor:
                -4,

            polygonOffsetUnits:
                -4

        });


    printDecal =
        new THREE.Mesh(

            geometry,

            material

        );


    printDecal.name =
        "Printmotive_Curved_Print";


    printDecal.renderOrder =
        20;


    printDecal.frustumCulled =
        false;


    scene.add(
        printDecal
    );


    /*
       Show remove button.
    */

    removeBtn.style.display =
        "block";


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   REMOVE PRINT
===================================================== */

function removePrintOnly(){

    if(
        !printDecal
    ){

        return;

    }


    scene.remove(
        printDecal
    );


    if(
        printDecal.geometry
    ){

        printDecal.geometry.dispose();

    }


    if(
        printDecal.material
    ){

        printDecal.material.dispose();

    }


    printDecal =
        null;

}


/* =====================================================
   REMOVE DESIGN
===================================================== */

function removeDesign(){

    removePrintOnly();


    if(
        designTexture
    ){

        designTexture.dispose();

        designTexture =
            null;

    }


    removeBtn.style.display =
        "block";


    upload.value =
        "";

}


/* =====================================================
   RESET VIEW
===================================================== */

function resetView(){

    camera.position.set(

        0,
        CAMERA_Y,
        CAMERA_Z

    );


    controls.target.set(

        0,
        TARGET_Y,
        0

    );


    controls.update();

}


/* =====================================================
   BRIGHTNESS
===================================================== */

function updateBrightness(){

    const value =
        parseFloat(
            brightness.value
        );


    const hemi =
        scene.getObjectByName(
            "Main Hemisphere Light"
        );


    const key =
        scene.getObjectByName(
            "Main Key Light"
        );


    const fill =
        scene.getObjectByName(
            "Main Fill Light"
        );


    if(hemi){

        hemi.intensity =
            1.25 *
            value;

    }


    if(key){

        key.intensity =
            1.25 *
            value;

    }


    if(fill){

        fill.intensity =
            .7 *
            value;

    }

}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

    const width =
        viewer.clientWidth;


    const height =
        viewer.clientHeight;


    renderer.setSize(

        width,

        height,

        false

    );


    camera.aspect =
        width /
        height;


    camera.updateProjectionMatrix();

}


/* =====================================================
   LOOP
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(
        controls
    ){

        controls.update();

    }


    renderer.render(
        scene,
        camera
    );

}

</script>

</body>
</html>
