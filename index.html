<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #080a0d;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}

body {

    overflow-x: hidden;

    -webkit-tap-highlight-color:
        transparent;

}


/* =========================================================
   APP
========================================================= */

.app {

    width: 100%;

    max-width: 900px;

    margin: auto;

    min-height: 100vh;

    display: flex;

    flex-direction: column;

}


/* =========================================================
   HEADER
========================================================= */

.header {

    height: 60px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 16px;

    background: #111419;

    border-bottom:
        1px solid #272b32;

}

.logo {

    font-size: 19px;

    font-weight: 800;

}

.badge {

    font-size: 11px;

    color: #aeb5c0;

    background: #20242b;

    padding: 6px 9px;

    border-radius: 20px;

}


/* =========================================================
   VIEWER
========================================================= */

.viewer {

    position: relative;

    width: 100%;

    height: 62vh;

    min-height: 430px;

    background:

        radial-gradient(
            circle at 50% 35%,
            #30353d 0%,
            #15181d 40%,
            #080a0d 75%
        );

    overflow: hidden;

}

#canvas {

    width: 100%;

    height: 100%;

    display: block;

    touch-action: none;

}


/* =========================================================
   HINT
========================================================= */

.hint {

    position: absolute;

    left: 50%;

    bottom: 14px;

    transform:
        translateX(-50%);

    padding: 8px 13px;

    background:
        rgba(0,0,0,.65);

    border:

        rgba(255,255,255,.08);

    border-radius: 30px;

    font-size: 12px;

    color: #dce1e8;

    white-space: nowrap;

    pointer-events: none;

}


/* =========================================================
   CONTROL PANEL
========================================================= */

.panel {

    padding: 16px;

    background: #111419;

    border-top:
        1px solid #272b32;

}

.buttons {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

}

.btn {

    border: none;

    padding: 12px 17px;

    border-radius: 12px;

    font-size: 14px;

    font-weight: 700;

    cursor: pointer;

    background: white;

    color: #111;

    touch-action: manipulation;

}

.btn.secondary {

    background: #252a31;

    color: white;

}

.btn:active {

    transform: scale(.97);

}

input[type="file"] {

    display: none;

}


/* =========================================================
   STATUS
========================================================= */

.status {

    margin-top: 11px;

    font-size: 12px;

    color: #aeb6c3;

    line-height: 1.5;

}

.note {

    margin-top: 7px;

    font-size: 11px;

    color: #747d89;

}


/* =========================================================
   LOADING
========================================================= */

.loading-box {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    width: min(320px, 80%);

    padding: 20px;

    border-radius: 16px;

    background:
        rgba(10,12,16,.88);

    border:
        1px solid
        rgba(255,255,255,.08);

    text-align: center;

    z-index: 10;

}

.loading-title {

    font-size: 15px;

    font-weight: 700;

    margin-bottom: 12px;

}

.loading-percent {

    font-size: 12px;

    color: #b8c0cb;

    margin-bottom: 10px;

}

.progress {

    width: 100%;

    height: 6px;

    border-radius: 20px;

    background: #292e36;

    overflow: hidden;

}

.progress-bar {

    width: 0%;

    height: 100%;

    background: white;

    border-radius: 20px;

}


/* =========================================================
   CROP MODAL
========================================================= */

.modal {

    position: fixed;

    inset: 0;

    z-index: 999;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 14px;

    background:
        rgba(0,0,0,.88);

}

.modal.show {

    display: flex;

}

.modal-box {

    width:
        min(720px, 100%);

    background: #15181d;

    border:
        1px solid #30353e;

    border-radius: 18px;

    padding: 14px;

}

.modal-title {

    font-size: 14px;

    font-weight: 700;

    margin-bottom: 10px;

}

.crop-area {

    width: 100%;

    height: 55vh;

    min-height: 300px;

    background: #080a0d;

    overflow: hidden;

}

.crop-area img {

    display: block;

}

.modal-buttons {

    display: flex;

    justify-content: flex-end;

    gap: 9px;

    margin-top: 12px;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    }

    }

    .panel {

    }

    .btn {

        min-width: 120px;

        padding: 12px 10px;

        font-size: 13px;

    }

    .hint {

        font-size: 11px;

        bottom: 10px;

    }

}

<script>

/* =========================================================
   CONFIGURATION
========================================================= */


/*
    ========================================================
    MODEL
    ========================================================
*/

const MODEL_FILE =
    "./shirt.glb";


/*
    ========================================================
    PRINT AREA
    ========================================================

    IMPORTANT:

    Ye values shirt ke normalized 3D coordinates
    ke according hain.

    Agar print thoda upar/neeche/left/right ho,
    SIRF yahan values change karni hongi.

    X = left / right
    Y = up / down
    Z = front / back

    width  = print area width
    height = print area height

    depth = decal depth
*/

const PRINT_AREA = {

    /*
       Horizontal position
    */

    x: 0.0,


    /*
       Vertical position

       Positive = upar
       Negative = neeche
    */

    y: 0.48,


    /*
       Front surface position
    */

    z: 0.47,


    /*
       Print width
    */

    width: 0.78,


    /*
       Print height
    */

    height: 0.95,


    /*
       Decal thickness/depth
    */

    depth: 0.12

};


/*
    ========================================================
    DESIGN SCALE
    ========================================================

    Design ko print box ke andar fit karne ke liye.

*/

const DESIGN_MAX_SIZE =
    0.92;


/* =========================================================
   VARIABLES
========================================================= */

let scene = null;

let camera = null;

let renderer = null;

let controls = null;

let shirt = null;

let printDecal = null;

let designTexture = null;

let cropper = null;


/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById(
        "canvas"
    );

const viewer =
    document.getElementById(
        "viewer"
    );

const status =
    document.getElementById(
        "status"
    );

const designInput =
    document.getElementById(
        "designInput"
    );

const cropModal =
    document.getElementById(
        "cropModal"
    );

const cropImage =
    document.getElementById(
        "cropImage"
    );

const loadingBox =
    document.getElementById(
        "loadingBox"
    );

const loadingPercent =
    document.getElementById(
        "loadingPercent"
    );

const progressBar =
    document.getElementById(
        "progressBar"
    );


/* =========================================================
   THREE.JS CHECK
========================================================= */

if (
    typeof THREE ===
    "undefined"
) {

    status.innerText =
        "Three.js failed to load.";

    throw new Error(
        "THREE is not available."
    );

}


if (
    typeof THREE.OrbitControls ===
    "undefined"
) {

    status.innerText =
        "OrbitControls failed to load.";

    throw new Error(
        "OrbitControls is not available."
    );

}


if (
    typeof THREE.GLTFLoader ===
    "undefined"
) {

    status.innerText =
        "GLTFLoader failed to load.";

    throw new Error(
        "GLTFLoader is not available."
    );

}


if (
    typeof THREE.DecalGeometry ===
    "undefined"
) {

    status.innerText =
        "DecalGeometry failed to load.";

    throw new Error(
        "DecalGeometry is not available."
    );

}


/* =========================================================
   INIT
========================================================= */

function init() {


    /* =====================================================
       SCENE
    ====================================================== */

    scene =
        new THREE.Scene();


    /* =====================================================
       CAMERA
    ====================================================== */

    camera =
        new THREE.PerspectiveCamera(

            35,

            1,

            0.01,

            1000

        );


    camera.position.set(

        0,

        0.8,

        3.4

    );


    /* =====================================================
       RENDERER
    ====================================================== */

    renderer =
        new THREE.WebGLRenderer({

            canvas:
                canvas,

            antialias:
                true,

            alpha:
                true,

            powerPreference:
                "high-performance",

            preserveDrawingBuffer:
                false

        });


    /*
       Mobile performance
    */

    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio || 1,

            1.35

        )

    );


    renderer.outputEncoding =
        THREE.sRGBEncoding;


    renderer.toneMapping =
        THREE.ACESFilmicToneMapping;


    renderer.toneMappingExposure =
        1.15;


    /* =====================================================
       LIGHTING
    ====================================================== */

    const hemiLight =
        new THREE.HemisphereLight(

            0xffffff,

            0x333333,

            2.1

        );


    scene.add(
        hemiLight
    );


    const keyLight =
        new THREE.DirectionalLight(

            0xffffff,

            2.5

        );


    keyLight.position.set(

        3,

        5,

        4

    );


    scene.add(
        keyLight
    );


    const fillLight =
        new THREE.DirectionalLight(

            0xffffff,

            1.2

        );


    fillLight.position.set(

        -4,

        2,

        2

    );


    scene.add(
        fillLight
    );


    /* =====================================================
       ORBIT CONTROLS
    ====================================================== */

    controls =
        new THREE.OrbitControls(

            camera,

            canvas

        );


    controls.enableDamping =
        true;


    controls.dampingFactor =
        0.08;


    controls.enablePan =
        false;


    controls.minDistance =
        1.5;


    controls.maxDistance =
        6;


    controls.rotateSpeed =
        0.7;


    controls.zoomSpeed =
        0.8;


    controls.target.set(

        0,

        0.55,

        0

    );


    controls.update();


    /* =====================================================
       LOAD MODEL
    ====================================================== */

    loadModel();


    /* =====================================================
       RESIZE
    ====================================================== */

    resize();


    window.addEventListener(

        "resize",

        resize

    );


    /* =====================================================
       RENDER
    ====================================================== */

    animate();

}


/* =========================================================
   LOAD MODEL
========================================================= */

function loadModel() {


    status.innerText =
        "Loading 3D T-shirt...";


    const loader =
        new THREE.GLTFLoader();


    loader.load(

        MODEL_FILE,


        /* =================================================
           SUCCESS
        ================================================== */

        function(gltf) {


            shirt =
                gltf.scene;


            /*
               Process model.
            */

            shirt.traverse(

                function(object) {


                    if (
                        !object.isMesh
                    ) {

                        return;

                    }


                    /*
                       Mobile performance
                    */

                    object.castShadow =
                        false;

                    object.receiveShadow =
                        false;


                    /*
                       Keep original material.

                       IMPORTANT:

                       We DO NOT replace
                       object.material.map.
                    */

                    if (
                        object.material
                    ) {

                        object.material
                            .needsUpdate =
                            true;

                    }

                }

            );


            /* =================================================
               CENTER MODEL
            ================================================== */

            const box =
                new THREE.Box3()
                    .setFromObject(
                        shirt
                    );


            const size =
                box.getSize(
                    new THREE.Vector3()
                );


            const center =
                box.getCenter(
                    new THREE.Vector3()
                );


            shirt.position.sub(
                center
            );


            /* =================================================
               NORMALIZE MODEL
            ================================================== */

            const maxSize =
                Math.max(

                    size.x,

                    size.y,

                    size.z

                );


            if (
                maxSize > 0
            ) {

                shirt.scale
                    .multiplyScalar(

                        2.2 /
                        maxSize

                    );

            }


            /* =================================================
               ADD SHIRT
            ================================================== */

            scene.add(
                shirt
            );


            /* =================================================
               LOADING COMPLETE
            ================================================== */

            progressBar.style.width =
                "100%";


            loadingPercent.innerText =
                "100%";


            setTimeout(

                function() {

                    loadingBox.style.display =
                        "none";

                },

                250

            );


            status.innerText =
                "3D T-shirt ready. Upload your design.";

        },


        /* =================================================
           PROGRESS
        ================================================== */

        function(xhr) {


            if (
                xhr.lengthComputable
            ) {


                const percent =
                    (
                        xhr.loaded /
                        xhr.total
                    ) * 100;


                const value =
                    Math.min(

                        100,

                        Math.round(
                            percent
                        )

                    );


                progressBar.style.width =
                    value + "%";


                loadingPercent.innerText =
                    value + "%";

            }
            else {

                loadingPercent.innerText =
                    "Loading...";

            }

        },


        /* =================================================
           ERROR
        ================================================== */

        function(error) {


            console.error(
                "GLB ERROR:",
                error
            );


            loadingBox.style.display =
                "none";


            status.innerText =
                "Model load failed. Check shirt.glb.";

        }

    );

}


/* =========================================================
   RESIZE
========================================================= */

function resize() {


    if (
        !renderer ||
        !camera
    ) {

        return;

    }


    const rect =
        viewer.getBoundingClientRect();


    renderer.setSize(

        rect.width,

        rect.height,

        false

    );


    camera.aspect =
        rect.width /
        rect.height;


    camera.updateProjectionMatrix();

}


/* =========================================================
   CREATE DESIGN TEXTURE
========================================================= */

function createDesignTexture(
    image
) {


    const textureCanvas =
        document.createElement(
            "canvas"
        );


    const context =
        textureCanvas.getContext(
            "2d"
        );


    /*
       1536 is enough for mobile
       and keeps memory lower.
    */

    const size =
        1536;


    textureCanvas.width =
        size;


    textureCanvas.height =
        size;


    context.clearRect(

        0,

        0,

        size,

        size

    );


    /*
       Fit image inside canvas
       without stretching.
    */

    const scale =
        Math.min(

            size /
            image.width,

            size /
            image.height

        );


    const width =
        image.width *
        scale;


    const height =
        image.height *
        scale;


    context.drawImage(

        image,

        (size - width) / 2,

        (size - height) / 2,

        width,

        height

    );


    const texture =
        new THREE.CanvasTexture(

            textureCanvas

        );


    texture.encoding =
        THREE.sRGBEncoding;


    texture.generateMipmaps =
        true;


    texture.minFilter =
        THREE.LinearMipmapLinearFilter;


    texture.magFilter =
        THREE.LinearFilter;


    texture.anisotropy =
        Math.min(

            4,

            renderer
                .capabilities
                .getMaxAnisotropy()

        );


    texture.needsUpdate =
        true;


    return texture;

}


/* =========================================================
   REMOVE OLD DECAL
========================================================= */

function removePrintDecal() {


    if (
        !printDecal
    ) {

        return;

    }


    /*
       Remove decal from scene.
    */

    scene.remove(
        printDecal
    );


    /*
       Dispose geometry.
    */

    if (
        printDecal.geometry
    ) {

        printDecal.geometry.dispose();

    }


    /*
       Dispose material.
    */

    if (
        printDecal.material
    ) {

        printDecal.material.dispose();

    }


    printDecal =
        null;

}


/* =========================================================
   FIND FRONT SHIRT MESH
========================================================= */

function getShirtMeshes() {


    const meshes = [];


    if (
        !shirt
    ) {

        return meshes;

    }


    shirt.traverse(

        function(object) {


            if (
                object.isMesh
            ) {

                meshes.push(
                    object
                );

            }

        }

    );


    return meshes;

}


/* =========================================================
   CREATE PRINT DECAL
========================================================= */

function createPrintDecal() {


    if (
        !shirt ||
        !designTexture
    ) {

        return;

    }


    /*
       Remove previous print.
    */

    removePrintDecal();


    const meshes =
        getShirtMeshes();


    if (
        meshes.length === 0
    ) {

        return;

    }


    /*
       Update world matrices
       before raycasting.
    */

    shirt.updateMatrixWorld(
        true
    );


    /*
       ------------------------------------------------------
       PRINT POSITION
       ------------------------------------------------------

       The shirt is already normalized to
       approximately 2.2 units.

       PRINT_AREA values are therefore
       relative to this normalized model.
    */


    const printPosition =
        new THREE.Vector3(

            PRINT_AREA.x,

            PRINT_AREA.y,

            PRINT_AREA.z

        );


    /*
       ------------------------------------------------------
       DECAL ORIENTATION
       ------------------------------------------------------

       Shirt front is assumed to face +Z,
       which matches the current viewer
       orientation in your screenshot.
    */

    const printRotation =
        new THREE.Euler(

            0,

            0,

            0

        );


    /*
       ------------------------------------------------------
       DECAL SIZE
       ------------------------------------------------------
    */

    const printSize =
        new THREE.Vector3(

            PRINT_AREA.width,

            PRINT_AREA.height,

            PRINT_AREA.depth

        );


    /*
       ------------------------------------------------------
       CREATE DECAL
       ------------------------------------------------------
    */

    let decalGeometry =
        null;


    /*
       Try meshes until decal can be created.
    */

    for (
        let i = 0;
        i < meshes.length;
        i++
    ) {


        try {


            decalGeometry =
                new THREE.DecalGeometry(

                    meshes[i],

                    printPosition,

                    printRotation,

                    printSize

                );


            if (
                decalGeometry &&
                decalGeometry.attributes &&
                decalGeometry.attributes.position &&
                decalGeometry.attributes.position.count > 0
            ) {

                break;

            }


            if (
                decalGeometry
            ) {

                decalGeometry.dispose();

                decalGeometry =
                    null;

            }


        }
        catch (
            error
        ) {

            console.warn(
                "Decal attempt failed:",
                error
            );

        }

    }


    /*
       If no decal geometry found.
    */

    if (
        !decalGeometry
    ) {

        status.innerText =
            "Could not create print area.";

        return;

    }


    /* =====================================================
       DECAL MATERIAL
    ====================================================== */

    const decalMaterial =
        new THREE.MeshBasicMaterial({

            map:
                designTexture,

            transparent:
                true,

            depthTest:
                true,

            depthWrite:
                false,

            polygonOffset:
                true,

            polygonOffsetFactor:
                -4,

            polygonOffsetUnits:
                -4,

            side:
                THREE.FrontSide

        });


    /*
       ------------------------------------------------------
       CREATE DECAL MESH
       ------------------------------------------------------
    */

    printDecal =
        new THREE.Mesh(

            decalGeometry,

            decalMaterial

        );


    /*
       Decal is created in shirt/model
       coordinates.

       Therefore make it child of shirt.
    */

    shirt.add(
        printDecal
    );


    /*
       Important:

       DecalGeometry position was calculated
       against the shirt mesh in its current
       normalized world transform.

       Reset local transform so it doesn't
       double-transform.
    */

    printDecal.position.set(
        0,
        0,
        0
    );


    printDecal.rotation.set(
        0,
        0,
        0
    );


    printDecal.scale.set(
        1,
        1,
        1
    );


    status.innerText =
        "Design applied inside the print area.";

}


/* =========================================================
   APPLY DESIGN
========================================================= */

function applyDesign(
    image
) {


    if (
        !shirt
    ) {

        status.innerText =
            "Please wait for the T-shirt to load.";

        return;

    }


    /*
       Remove previous design.
    */

    removePrintDecal();


    /*
       Dispose previous texture.
    */

    if (
        designTexture
    ) {

        designTexture.dispose();

        designTexture =
            null;

    }


    /*
       Create new texture.
    */

    designTexture =
        createDesignTexture(
            image
        );


    /*
       Put it ONLY inside
       the print area.
    */

    createPrintDecal();

}


/* =========================================================
   FILE UPLOAD
========================================================= */

designInput.addEventListener(

    "change",

    function(event) {


        const file =
            event.target.files[0];


        if (
            !file
        ) {

            return;

        }


        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            status.innerText =
                "Please select an image.";

            return;

        }


        const imageURL =
            URL.createObjectURL(
                file
            );


        cropImage.onload =
            function() {


                if (
                    cropper
                ) {

                    cropper.destroy();

                }


                cropper =
                    new Cropper(

                        cropImage,

                        {

                            viewMode:
                                1,

                            autoCropArea:
                                0.8,

                            background:
                                false,

                            responsive:
                                true,

                            zoomable:
                                true,

                            movable:
                                true,

                            rotatable:
                                false,

                            scalable:
                                false

                        }

                    );


                cropModal.classList.add(
                    "show"
                );


                URL.revokeObjectURL(
                    imageURL
                );

            };


        cropImage.src =
            imageURL;

    }

);


/* =========================================================
   CANCEL CROP
========================================================= */

document
    .getElementById(
        "cancelCrop"
    )
    .addEventListener(

        "click",

        function() {


            cropModal.classList.remove(
                "show"
            );


            if (
                cropper
            ) {

                cropper.destroy();

                cropper =
                    null;

            }


            designInput.value =
                "";

        }

    );


/* =========================================================
   APPLY CROP
========================================================= */

document
    .getElementById(
        "applyCrop"
    )
    .addEventListener(

        "click",

        function() {


            if (
                !cropper
            ) {

                return;

            }


            const croppedCanvas =
                cropper.getCroppedCanvas({

                    maxWidth:
                        1536,

                    maxHeight:
                        1536,

                    imageSmoothingQuality:
                        "high"

                });


            if (
                !croppedCanvas
            ) {

                return;

            }


            const image =
                new Image();


            image.onload =
                function() {


                    applyDesign(
                        image
                    );


                    if (
                        cropper
                    ) {

                        cropper.destroy();

                        cropper =
                            null;

                    }

                };


            image.src =
                croppedCanvas.toDataURL(
                    "image/png"
                );


            cropModal.classList.remove(
                "show"
            );

        }

    );


/* =========================================================
   REMOVE DESIGN
========================================================= */

document
    .getElementById(
        "removeDesign"
    )
    .addEventListener(

        "click",

        function() {


            removePrintDecal();


            if (
                designTexture
            ) {

                designTexture.dispose();

                designTexture =
                    null;

            }


            status.innerText =
                "Design removed.";

        }

    );


/* =========================================================
   RESET VIEW
========================================================= */

document
    .getElementById(
        "resetView"
    )
    .addEventListener(

        "click",

        function() {


            if (
                !camera ||
                !controls
            ) {

                return;

            }


            camera.position.set(

                0,

                0.8,

                3.4

            );


            controls.target.set(

                0,

                0.55,

                0

            );


            controls.update();

        }

    );


/* =========================================================
   ANIMATION LOOP
========================================================= */

function animate() {


    requestAnimationFrame(
        animate
    );


    if (
        controls
    ) {

        controls.update();

    }


    if (
        renderer &&
        scene &&
        camera
    ) {

        renderer.render(

            scene,

            camera

        );

    }

}


/* =========================================================
   START
========================================================= */

init();

</script>


</body>

</html>
